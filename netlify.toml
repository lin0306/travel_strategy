# 本文件刻意留在**仓库根**：Netlify 只在仓库根（或已配置的 base 目录）寻找它。
# 应用工程在 web/ 子目录里，所以这里用 base 指过去 —— 这是标准 monorepo 做法，
# 比把 netlify.toml 放进 web/ 更可靠（放进去反而找不到）。
#
# base 一旦设定，command 的执行目录与 publish 的解析基准**都相对 base**，
# 所以 publish 里的路径是相对 `web/` 解析的，不是仓库根。
#
# ★★ publish 必须是 **dist/client**，不能写 dist（2026-11-16 修正）
#   `react-router.config.ts` 设了 `buildDirectory: 'dist'`，但 React Router 会把
#   产物再分一层：HTML 与 assets 全在 `dist/client/`，`dist/` 只做容器。
#   实测 `web/dist/` 下**只有** `client/` 一个目录，`web/dist/index.html` 不存在。
#   ⇒ 写 `dist` 时 Netlify 发布的根是 `web/dist`：`/` 找不到 index.html、
#     `/assets/*` 全部落到空目录 ⇒ 连下面的 redirect 也指向不存在的文件 ⇒ **全站 404**。
#   ★ 这个坑本地永远看不出来（本地 `pnpm preview` 走的是 vite 的 dev server，
#     不读 netlify.toml），只有真部署才会炸。
[build]
  base = "web"
  # 工程只有 pnpm-lock.yaml（无 package-lock.json / yarn.lock），
  # 且 package.json 写了 `packageManager: pnpm@12.16.1` ⇒ 用 pnpm，别用 npm。
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # ★ 与 package.json 的 `packageManager` **必须同值**（2026-11-16）：
  #   Netlify 靠 corepack 拉起这个版本，两边不一致时以哪个为准并不透明。
  #   取 12.16.1 而不是原来的 11.1.2 —— 因为本地 `pnpm build` 实测通过的就是 12.16.1，
  #   CI 与本地同版本才能保证 lockfile 解析行为一致（11.1.2 是 11.x 最早期的补丁版）。
  PNPM_VERSION = "12.16.1"

  # ★★ 腾讯地图 JS API 的 key **天然是公开的**，别当密文扫（2026-11-17）
  #
  #   失败原文：`Secret env var "VITE_TMAP_KEY"'s value detected ... at line 1 in
  #   dist/client/assets/map-shell-*.js` ⇒ exit code 2，构建「成功后被判失败」。
  #
  #   为什么打进去：`VITE_` 前缀在构建期是**字符串替换**，值直接写进 JS bundle。
  #   为什么必须打进去：腾讯 JS API GL 是浏览器端 SDK，加载脚本时就要带 key，
  #   前端拿不到就等于地图打不开。**它的保护手段是 Referer 白名单**（在腾讯控制台配
  #   `*.netlify.app` + 勾 JavaScript API GL），不是保密。
  #
  #   为什么用 OMIT_KEYS 而不是取消标记：Netlify 一旦把变量标记为 secret 就**不可撤销**。
  #   为什么安全：真正的密文是 `AMAP_WEB_KEY`（高德 Web 服务 key，只被
  #   `netlify/functions/staticmap.mjs` 在服务端读，永不进 bundle）—— 它不在排除名单里，
  #   仍然全程受扫描保护。排除的只有一个「公开即设计」的浏览器 key。
  #
  #   ★ 值必须是**变量名**（逗号分隔），不是 key 的值本身。
  #   ★ 这套 SECRETS_SCAN_* 按官方口径属于「站点级环境变量」，UI 里同样配一份最稳妥；
  #     两边同值即可，不冲突。
  SECRETS_SCAN_OMIT_KEYS = "VITE_TMAP_KEY"

# ★ Functions 目录**相对 base 解析**（base = "web"）⇒ 实际路径是 web/netlify/functions。
#   目前只有一只 `staticmap.mjs`：海报底图代理。存在的原因是高德「Web服务」key
#   **没有域名白名单**（那只属于 JS API），浏览器直连就等于公开 ⇒ 把请求挪到服务端，
#   key 只从环境变量 `AMAP_WEB_KEY` 读（**不带 VITE_ 前缀**，永不进 bundle），
#   域名白名单由函数自己校验 Referer。
[functions]
  directory = "netlify/functions"

# 预渲染产物已是完整静态文件，无需 SPA fallback。
# 仅为未预渲染的深层路径兜底：Netlify 只在文件不存在时才走这条规则，
# 因此不会覆盖 /city/chengdu/index.html。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # 资源带内容哈希，可长期缓存
    Cache-Control = "public, max-age=31536000, immutable"
