<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="行迹">
  <!--
    站点图标（favicon）。2026-10-07 重做，同日三次调整 + 三次内边距修正。

    造型 = 导航箭头（描边）。左上尖端 + 右侧机翼 + 中间缺口 + 下方尾柱。
    语义是「指过去、点下去」—— 这个站的核心交互正是**在地图上点选**
    （点省、点市、点景点，点空白收起），光标形状不用解释就对。

    为什么是描边而不是实心：实心块在 16px 时缺口会被填平、尖端钝掉；
    描边版靠留白维持形状，小尺寸下更稳。

    ★ 内边距 = 视口的 20%（6.4 单位）。经三档调整定下：
      占满视口（顶端边距 1.2）→ 像被裁过；12.5% → 偏紧；15% → 仍偏紧。
      20% 是留白与体量的平衡点：几何占视口 51%，箭头不胖不瘦。
    ★ 定内边距时**只能缩几何、不能等比缩放整个图形** ——
      等比缩放会把线宽一起缩细：20% 时线宽会从 2.8 掉到 1.70，
      16px 下只剩 0.85px，线发虚断续。固定 2.8 则仍是 1.40px。
    ★ 三条硬约束，改形状/内边距时一起验：
      · 短边/长边 ≥ 0.38（低于此显瘦长、像纸飞机）—— 当前 0.43
      · 16px 实际线宽 = 线宽/2 ≥ 1.35px（低于此抗锯齿保不住，线会虚）—— 当前 1.40
      · 缺口 16px 净空 ≥ 0.8px（低于此缺口糊死、看不出是箭头）—— 当前 2.16
    ★ 上限提示：内边距再往上（25%+）缺口净空会掉到 1.44px、箭头明显缩水；
      那时该换更简的形状，而不是继续缩。

    ★ 四顶点（32 视口，已含 20% 内边距）：
        尖端 (9.6, 7.8) · 右机翼 (23.7, 14.0) · 中间缺口 (16.9, 17.0) · 尾柱 (15.1, 24.2)

    背景 = 近黑 #0f172a。原来的亮蓝在浏览器标签页里太扎眼，
    跟「地图即画布」的深色底图也不搭；深底把白色箭头的对比拉到最高。

    与顶栏的关系：顶栏 Brand.tsx 用同一套图形（SiteMark 组件），两边永远一致。

    ★ 改这个文件时注意：注释里不能出现连续两个连字符（XML 注释不允许），
      写 CSS 变量名（如 color-primary）要小心。
  -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />

  <path
    d="M9.6 7.8 L23.7 14 L16.9 17 L15.1 24.2 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
