      '<div class="p-head"><h2>' + esc(shortName(p ? p.name : '四川')) + '<span class="badge badge--region">' +
      (p && p.id === SC_PROVINCE ? '西南' : '省级') + '</span></h2>' +
      '<div class="sub">点城市进入城市地图，看具体点位分布。</div>' +
      '<div class="stats"><span><b>' + done + '</b> 市已收录</span><span><b>' + D.TOTAL_POIS +
      '</b> 个点位</span><span>' + cities.length + ' 个市州</span></div></div>' +
      '<div class="p-sep"></div>' +
      '<div class="p-list scroll" style="padding-top:8px">' + rows + '</div>' +
      '<div class="p-foot"><span>' + cities.length + ' 个市州 · 未收录灰显</span><span>下钻层级 2 / 3</span></div>' +
      '</div>';
  }

  function panelCity() {
    var city = CITY_BY_ID[S.cityId];
    var list = visiblePois();
    var chips = '<button class="chip" data-act="cat" data-cat="all" aria-pressed="' + (S.cat === 'all') + '">全部 <b>' +
      D.POIS.length + '</b></button>';
    CATS.forEach(function (c) {
      var n = D.POIS.filter(function (p) { return p.cat === c.key; }).length;
      chips += '<button class="chip" data-act="cat" data-cat="' + c.key + '" aria-pressed="' + (S.cat === c.key) + '">' +
        esc(c.name) + ' <b>' + n + '</b></button>';
    });

    var rows = list.length ? list.map(function (p) {
      var on = p.id === S.selectedId, hv = p.id === S.hoveredId;
      return '<button class="poirow' + (hv ? ' is-hover' : '') + '" data-act="select-poi" data-poi="' + p.id +
        '" aria-current="' + on + '">' +
        imgBox(p.imgKey, 200, 200, '', { alt: p.name }) +
        '<span class="pbody"><span class="ptop"><b>' + esc(p.name) + '</b>' + subBadge(p) + '</span>' +
        '<span class="pdesc">' + esc(p.lead) + '</span>' +
        '<span class="ptags">' + p.tags.slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</span>' +
        audHTML(p) + '</span>' +
        '<span class="pdist">' + rowMeta(p) + '</span></button>';
    }).join('') : '<div class="emptystate"><b>没有符合条件的点位</b>试试换个关键词、细类或分类</div>';

    var sortLabel = S.sort === 'hot' ? '热门优先' : '名称排序';
    return '<div class="flt flt--col panel-left">' +
      '<div class="p-head"><h2>' + esc(city.name) + '<span class="badge badge--region">' + esc(city.region) + '</span></h2>' +
      '<div class="sub">' + esc(city.tagline) + '</div>' +
      '<div class="stats"><span><b>' + D.POIS.length + '</b> 个点位</span>' +
      CATS.map(function (c) {
        var n = D.POIS.filter(function (p) { return p.cat === c.key; }).length;
        return '<span>' + esc(c.name) + ' <b>' + n + '</b></span>';
      }).join('') + '</div></div>' +
      '<div class="p-sep"></div>' +
      '<div class="chips">' + chips + '</div>' +
      subLegendHTML(true) +
      '<div class="filterrow"><label class="input">' + ico('search', 'ico--sm') +
      '<input type="search" data-role="search" placeholder="搜名字 / 标签 / 细类" value="' + esc(S.q) + '" aria-label="搜索点位">' +
      '</label><button class="sortbtn" data-act="sort">' + esc(sortLabel) + ico('chev-down', 'ico--sm') + '</button></div>' +
      '<div class="p-list scroll">' + rows + '</div>' +
      '<div class="p-foot"><span>共 ' + list.length + ' 个结果' +
      (S.sub !== 'all' ? ' · 已限定「' + esc(SUBTYPE_META[S.sub].label) + '」' : '') +
      (outlierCount() ? ' · ' + outlierCount() + ' 个郊县点位需缩小地图查看' : '') +
      '</span><span>' + (S.myPos ? '已按距我最近排序' : '默认视野为市区范围') + '</span></div>' +
      planEntryHTML() +
      '</div>';
  }

  /** 城市页 → 行程页的入口。放在面板底部而不是顶部：
      列表的主任务是「找点位」，把「排行程」压在底部既可见又不抢主流程（09 文档 6.1 入口策略）。 */
  function planEntryHTML() {
    var n = 0;
    D.PLAN_DAYS.forEach(function (d) { n += d.items.length; });
    return '<div class="p-itin">' +
      '<button class="btn btn--primary" data-act="goto-plan">' + ico('timer', 'ico--sm') + '规划我的行程</button>' +
      '<span class="hint">已有 ' + D.PLAN_DAYS.length + ' 天 · ' + n + ' 个点位 · 顺序由你决定，系统只算时间</span>' +
      '</div>';
  }

  function panelDetail() {
    var p = POI_BY_ID[S.poiId], city = CITY_BY_ID[S.cityId];
    if (!p) return '';
    var rel = D.POIS.filter(function (x) { return x.cat === p.cat && x.id !== p.id; }).slice(0, 4);

    return '<div class="flt flt--col panel-detail" id="detailPanel">' +
      '<div class="pd-scroll scroll">' +
        '<div class="gal">' + imgBox(p.images[0].key, 1080, 560, 'gal-main', { alt: p.name, credit: 'Unsplash · 氛围示意' }) + '</div>' +
        '<div class="thumbs">' + p.images.slice(1).map(function (im, i) {
          return '<button data-act="open-lightbox" data-idx="' + (i + 1) + '" aria-label="查看第 ' + (i + 2) + ' 张图" style="border:0;padding:0;background:none">' +
            imgBox(im.key, 320, 240, '', { alt: p.name + ' 图 ' + (i + 2) }) + '</button>';
        }).join('') + '</div>' +

        '<div class="pd-title"><h1>' + esc(p.name) + '</h1>' +
        subBadge(p) +
        '<span class="badge badge--region">' + esc(p.district) + '</span></div>' +
        '<p class="pd-lead">' + esc(p.lead) + '</p>' +

        '<h2 class="pd-h">实用信息</h2>' +
        '<div class="metagrid">' +
          metaCell('clock', '开放时间', p.hours, 1) +
          metaCell('ticket', '门票', p.ticket, 1) +
          metaCell('timer', '建议时长', p.duration, 0) +
          '<div class="metacell"><div class="k">' + ico('pin', 'ico--sm') + '细类</div>' +
          '<div class="v" style="color:' + p.subColor + '">' + esc(p.subtypeName) + '</div></div>' +
        '</div>' +

        /* ★ 适游群体：6 类 + ♿ 无障碍。两者都必须有来源依据；无数据整块不渲染，不臆造 */
        '<h2 class="pd-h">适合人群</h2>' +
        (p.audience && p.audience.length
          ? audHTML(p) + '<p class="pd-note">适游群体与无障碍信息逐条对应来源页面的客观描述，未核实的字段不展示。</p>'
          : '<p class="pd-note">该点位的适游群体信息尚未核实，暂不展示。</p>') +

        '<h2 class="pd-h">亮点</h2>' +
        '<div class="hllist">' + p.highlights.map(function (x) {
          return '<div class="hl"><span class="dot"></span><span>' + esc(x) + '</span></div>';
        }).join('') + '</div>' +

        '<h2 class="pd-h">同城同类推荐</h2>' +
        '<div class="nearby">' + rel.map(function (x) {
          return '<a href="#" data-act="goto-poi" data-poi="' + x.id + '">' + ico('pin', 'ico--sm') + esc(x.name) + '</a>';
        }).join('') + '</div>' +

        '<h2 class="pd-h">数据来源</h2>' +
        '<div class="srcbox" id="srcBlock">' +
          '<ol>' + p.sources.map(function (s, i) {
            return '<li><span class="num">' + (i + 1) + '</span><span>' + esc(s.text) + ' · ' +
              '<a href="https://' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.url) +
              '</a> · 抓取于 ' + esc(p.fetchedAt) + '</span></li>';
          }).join('') + '</ol>' +
          '<div class="fine">图片为开放许可素材（Unsplash），本站仅作外链引用并署名，版权归原作者所有。' +
          '<br><b>原型说明：</b>本页为高保真原型示例数据；正式版由采集流水线产出，来源链接与抓取日期均为真实值。</div>' +
        '</div>' +
      '</div>' +
      '</div>';
  }
  function metaCell(icon, k, v, ref) {
    return '<div class="metacell"><div class="k">' + ico(icon, 'ico--sm') + esc(k) +
      (ref ? '<button class="ref" data-act="jump-src" aria-label="查看来源">' + ref + '</button>' : '') +
      '</div><div class="v">' + esc(v) + '</div></div>';
  }

  /* ---------- 地图控件组 ---------- */
  function renderControls() {
    if (S.device !== 'desktop') { elCtl.innerHTML = ''; return; }
    var moved = S.userMoved ? '' : ' style="display:none"';
    elCtl.innerHTML = '<div class="ctlwrap">' +
      '<div class="mapctl">' +
      '<button data-act="zoom-in" aria-label="放大">' + ico('plus', 'ico--sm') + '</button>' +
      '<button data-act="zoom-out" aria-label="缩小">' + ico('minus', 'ico--sm') + '</button>' +
      '<button data-act="locate" aria-label="定位到我">' + ico('crosshair', 'ico--sm') + '</button>' +
      '<button data-act="fullscreen" aria-label="全屏">' + ico('expand', 'ico--sm') + '</button>' +
      '</div>' +
      '<button class="btn btn--sm" data-act="reset-view"' + moved +
      ' style="margin-top:8px;box-shadow:var(--flt-shadow-sm),var(--flt-ring);background:var(--flt-bg)">回到全览</button>' +
      '</div>';
  }
  function renderControlsState() {
    var btn = elCtl.querySelector('[data-act="reset-view"]');
    if (btn) btn.style.display = S.userMoved ? '' : 'none';
  }

  /* ---------- 底部图例条（仅桌面端；移动端缩为一条小字） ----------
     图例随层级切换：全国 / 省级说「区划颜色 = 收录密度」，城市级说「点位颜色 = 细类」。
     两套色语义刻意不复用（面是背景信息，点是内容），所以图例也必须换，否则用户会误读。 */
  var SUB_SHORT = {
    nature: '自然', museum: '博物馆', historic: '古迹', park: '园林', temple: '宗教',
    local: '本地菜', snack: '小吃', cafe: '咖啡',
    photo: '拍照', art: '艺术', street: '街区', performance: '剧场'
  };
  function renderLegend() {
    if (S.device !== 'desktop') { elLegend.innerHTML = ''; return; }
    var state;
    if (S.base === 'satellite') {
      state = '影像底图' + (S.baseLocked ? '（已锁定，不自动切换）' : '（zoom ≥ 15.5 自动切矢量）');
    } else {
      state = S.autoDown ? '矢量底图 · 由影像自动降级' : '矢量底图';
    }
    /* 地图服务降级时把提示并进状态区，而不是另起一个绝对定位的浮标：
       浮标无论怎么摆都会在某条路径上压住点位，并进已有状态区则零遮挡。 */
    var fbHint = S.mapMode === 'fallback'
      ? '<span class="vdiv"></span><span class="fbtag">示意画布</span>' : '';

    var legend = '';
    if (S.route === 'home' || S.route === 'province') {
      /* 区划面 / 徽标底色 = 收录密度 */
      legend = '<span class="legend-only">颜色 = 收录密度</span><span class="vdiv legend-only"></span>' +
        '<span class="legend-i legend-only"><i style="background:var(--d3)"></i>50+</span>' +
        '<span class="legend-i legend-only"><i style="background:var(--d2)"></i>20–49</span>' +
        '<span class="legend-i legend-only"><i style="background:var(--d1)"></i>1–19</span>' +
        '<span class="legend-i legend-only"><i style="background:var(--d0);border:1px dashed #C3CCD8"></i>待收录</span>';
    } else if (S.route === 'plan') {
      /* ★ 行程页图例说的是「这一屏地图上有哪些符号」，不是细类色：
         住宿旗标 / 序号圆点 / 连线（矩阵只存距离与时长，不存路径 → 只能是直线示意）。
         这条必须写在图例里，否则用户会把虚线当成真实路网。 */
      legend = '<span class="legend-only">行程符号</span><span class="vdiv legend-only"></span>' +
        '<span class="legend-i legend-only"><i class="lg-stay" style="background:var(--c-text)"></i>住宿点</span>' +
        '<span class="legend-i legend-only"><i class="lg-seq">1</i>当天顺序</span>' +
        '<span class="legend-i legend-only"><i class="lg-line is-solid"></i>驾车等实线</span>' +
        '<span class="legend-i legend-only"><i class="lg-line is-walk"></i>步行</span>' +
        '<span class="legend-i legend-only"><i class="lg-line is-jam"></i>拥堵段（示意）</span>' +
        '<span class="vdiv legend-only"></span><span class="legend-only" style="color:var(--c-text-3)">' +
        /* ★ 三件必须同时说清的事，缺一件就是把快照冒充实时：
             ① 采样时刻  ② 往返均值  ③ 连线是直连示意（矩阵不存路径点） */
        '点位颜色 = 细类 · 连线均为直线示意 · 时长按 2026-09-18 工作日上午路况估算（往返均值）</span>';
    } else {
      /* 点位颜色 = 细类（12 色）。条内用短标签，否则 12 项在 42px 条里会挤爆 */
      legend = '<span class="legend-only">点位颜色 = 细类</span><span class="vdiv legend-only"></span>' +
        Object.keys(SUBTYPE_META).map(function (k) {
          return '<span class="legend-i legend-only"><i style="background:' + SUBTYPE_META[k].color + '"></i>' +
            esc(SUB_SHORT[k] || SUBTYPE_META[k].label) + '</span>';
        }).join('');
    }

    elLegend.innerHTML = '<div class="flt flt--row bottombar">' + legend +
      '<span class="vdiv legend-only"></span><span class="state">' + esc(state) + '</span>' + fbHint +
      '<span class="creditline">© 腾讯地图 · 影像服务</span>' +
      '</div>';
  }

  /* ---------- 右侧预览卡 ---------- */
  /* 待收录引导卡：绝不停在空白页 —— 告知现状 + 给出可去的下一步 */
  function pendingCardHTML(name) {
    return '<div class="flt pending">' +
      '<button class="pv-close" data-act="close-pending" aria-label="关闭">' + ico('close', 'ico--sm') + '</button>' +
      '<h3>' + esc(shortName(name)) + '<span class="badge badge--region">待收录</span></h3>' +
      '<p>该区域内容正在整理中。本轮先把「全国 → 省 → 市」的下钻链路跑通，因此只填充了<b>四川（成都 46 个点位）</b>，' +
      '其余省级单位一律显示「待收录」——注意是<b>破折号而不是 0</b>：0 表示收录了但确实没有，两者不是一回事。</p>' +
      '<div class="sug">' +
      '<button class="btn btn--primary" data-act="goto-province" data-prov="' + SC_PROVINCE + '">去四川 →</button>' +
      '<button class="btn" data-act="close-pending">知道了</button>' +
      '</div></div>';
  }

  /* ---------- 右侧悬浮卡（POI 预览 / 待收录引导） ---------- */
  function renderPreview() {
    if (S.device !== 'desktop') { elPreview.innerHTML = ''; return; }
    if (S.pendingName) { elPreview.innerHTML = pendingCardHTML(S.pendingName); return; }
    if (S.route !== 'city' || !S.selectedId) { elPreview.innerHTML = ''; return; }
    var p = POI_BY_ID[S.selectedId];
    if (!p) { elPreview.innerHTML = ''; return; }
    elPreview.innerHTML = '<div class="flt preview">' +
      imgBox(p.images[0].key, 720, 400, 'pv-cover', { alt: p.name, credit: 'Unsplash' }) +
      '<button class="pv-close" data-act="close-preview" aria-label="关闭预览卡">' + ico('close', 'ico--sm') + '</button>' +
      '<div class="pv-body">' +
        '<div class="pv-title"><b>' + esc(p.name) + '</b>' + subBadge(p) + '</div>' +
        '<div class="pv-lead">' + esc(p.lead) + '</div>' +
        '<div class="pv-tags">' + p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
        /* ★ 适游群体：与地图列表、详情页三处同源，都读 POI_META */
        audHTML(p) +
        '<div class="pv-meta">' +
          '<div class="pv-metarow"><span class="k">开放时间</span><span class="v">' + esc(p.hours) + '</span></div>' +
          '<div class="pv-metarow"><span class="k">建议时长</span><span class="v">' + esc(p.duration) + '</span></div>' +
          '<div class="pv-metarow"><span class="k">地址</span><span class="v">' + esc(p.address) + '</span></div>' +
        '</div>' +
        '<div class="pv-actions">' +
          '<button class="btn btn--primary" data-act="goto-poi" data-poi="' + p.id + '">查看详情</button>' +
          '<button class="btn" data-act="nav">导航</button>' +
        '</div>' +
        '<div class="pv-foot">点「查看详情」进入独立页（可被搜索引擎收录与分享）</div>' +
      '</div></div>';
  }

  /* ---------- 移动端浮层 ---------- */
  function renderMobile() {
    /* 注意：这里只允许操作 elMobile —— 桌面端的浮层由各自的 render* 负责，
       早期版本在此处顺带清空 elPanel / elTopbar，导致桌面端左面板与顶栏被抹掉。 */
    if (S.device !== 'mobile') { elMobile.innerHTML = ''; return; }
    elTopbar.innerHTML = ''; elPanel.innerHTML = ''; elCtl.innerHTML = ''; elLegend.innerHTML = ''; elPreview.innerHTML = '';

    var city = CITY_BY_ID[S.cityId], poi = POI_BY_ID[S.poiId];
    var isHome = S.route === 'home', isDetail = S.route === 'detail';
    var isProvince = S.route === 'province';
    var isPlan = S.route === 'plan';
    var top;

    if (isDetail && poi) {
      top = '<div class="m-top">' +
        '<button class="m-pill m-pill--icon" data-act="goto-city" aria-label="返回">' + ico('back', 'ico--sm') + '</button>' +
        '<div class="m-pill m-pill--grow" style="justify-content:center;color:var(--c-text);font-weight:600">' +
        '<span>' + esc(city ? city.name : '') + ' · ' + esc(poi.name) + '</span></div>' +
        '<button class="m-pill m-pill--icon" data-act="share" aria-label="分享">' + ico('share', 'ico--sm') + '</button>' +
        '</div>';
    } else if (isPlan) {
      /* ★ 行程页顶部：返回城市 + 「我的行程」+ 分享。
         刻意不塞搜索框 —— 行程里的搜索是「搜点位加入行程」，与城市页的搜点位是两件事，
         原型里统一收进 Sheet 底部「添加点位」，避免顶部胶囊被挤成两行。 */
      top = '<div class="m-top">' +
        '<button class="m-pill m-pill--icon" data-act="goto-city" aria-label="返回城市页">' + ico('back', 'ico--sm') + '</button>' +
        '<div class="m-pill m-pill--grow" style="justify-content:center;color:var(--c-text);font-weight:600">' +
        '<span>' + esc(city ? city.name : '') + ' · 我的行程</span></div>' +
        '<button class="m-pill m-pill--icon" data-act="plan-share" aria-label="分享行程">' + ico('share', 'ico--sm') + '</button>' +
        '</div>';
    } else {
      /* ★ 移动端的面包屑 = 「返回上级」胶囊 + 「当前层级」胶囊。
         窄屏塞不下完整的「全国 / 四川 / 成都」三段，所以只保留上级与当前两级 ——
         一路点返回键即可逐级退出，和桌面端面包屑等价。 */
      var upAct = null, upLabel = null, hereLabel = '';
      if (isHome) { hereLabel = '全国'; }
      else if (isProvince) {
        upAct = 'goto-home'; upLabel = '全国';
        hereLabel = shortName((PROVINCE_BY_ID[S.provinceId] || {}).name || '四川');
      } else {
        upAct = 'goto-province'; upLabel = '四川';
        hereLabel = city ? city.name : '';
      }
      top = '<div class="m-top">' +
        (upLabel
          ? '<button class="m-pill m-pill--city" data-act="' + upAct + '"' +
            (upAct === 'goto-province' ? ' data-prov="' + S.provinceId + '"' : '') + '>' +
            ico('back', 'ico--sm') + '<span style="font-weight:500">' + esc(upLabel) + '</span></button>'
          : '<button class="m-pill m-pill--icon" data-act="menu" aria-label="菜单">' + ico('menu', 'ico--sm') + '</button>') +
        '<div class="m-pill" style="flex:none;color:var(--c-text);font-weight:600">' + esc(hereLabel) + '</div>' +
        '<label class="m-pill m-pill--grow">' + ico('search', 'ico--sm') +
        '<input type="search" data-role="search" placeholder="' +
        esc(isHome ? '搜索省份 / 城市' : (isProvince ? '搜市州' : '搜名字 / 细类')) +
        '" value="' + esc(S.q) + '" aria-label="搜索" style="flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:inherit">' +
        '</label>' +
        (isHome ? '<button class="m-pill m-pill--icon" data-act="locate" aria-label="定位">' + ico('crosshair', 'ico--sm') + '</button>' : '') +
        '</div>';
    }

    /* 底图切换（悬浮胶囊） */
    var seg = '<div class="m-segwrap"><div class="m-seg">' +
      '<button data-act="set-base" data-value="vector" aria-pressed="' + (S.base === 'vector') + '">矢量</button>' +
      '<button data-act="set-base" data-value="satellite" aria-pressed="' + (S.base === 'satellite') + '">影像</button>' +
      '<button data-act="lock" aria-pressed="' + S.baseLocked + '" aria-label="锁定底图">' + ico(S.baseLocked ? 'lock' : 'unlock', 'ico--sm') + '</button>' +
      '</div></div>';

    /* 跟随 Sheet 档位的浮动件：定位 + 版权署名（任何档位都不可被遮挡） */
    var creditTxt = S.base === 'satellite' ? '© 腾讯地图 · 影像服务' : '© 腾讯地图';
    var floats = '<div class="m-float" data-follow-sheet style="left:12px;right:12px">' +
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px">' +
        /* 署名 + 地图状态并排同一行：状态提示不再单独绝对定位，从根上消除互相压盖 */
        '<span style="display:flex;gap:6px;align-items:center;min-width:0">' +
          '<span class="m-pill" style="height:26px;padding:0 10px;font-size:10px;color:var(--c-text-3);white-space:nowrap">' + creditTxt + '</span>' +
          (S.mapMode === 'fallback'
            ? '<span class="m-pill" style="height:26px;padding:0 10px;font-size:10px;color:var(--c-text-3);border-style:dashed;white-space:nowrap">示意画布</span>'
            : '') +
        '</span>' +
        (isDetail ? '' : '<button class="m-pill m-pill--icon" data-act="locate" aria-label="定位">' + ico('crosshair', 'ico--sm') + '</button>') +
      '</div></div>';

    elMobile.innerHTML = top + seg + floats + '<div id="sheetMount"></div>';
    mountSheet();
    positionFloats();
  }

  function mountSheet() {
    var mount = document.getElementById('sheetMount');
    if (!mount) return;
    var isHome = S.route === 'home', isDetail = S.route === 'detail';
    var city = CITY_BY_ID[S.cityId], poi = POI_BY_ID[S.poiId];
    var inner = '';

    if (isHome) {
      /* 全国层：省级单位列表 + 计数（未收录 = 破折号，不是 0） */
      var collected = D.PROVINCES.filter(function (p) { return p.count != null; }).length;
      var rows = D.PROVINCES.map(function (p) {
        var pending = p.count == null;
        return '<button class="drow' + (pending ? ' is-pending' : '') + '" data-act="goto-province" data-prov="' + p.id + '">' +
          '<span class="dn"><b>' + esc(shortName(p.name)) + '</b><span>' + esc(provMeta(p)) + '</span></span>' +
          cntHTML(p.count) +
          '<span class="go">' + (pending ? '—' : ico('chev-right', 'ico--sm')) + '</span></button>';
      }).join('');
      inner = '<div class="sheet-head"><div class="row1"><b>全国概览</b><span class="hint">' + collected +
        ' 省已收录 · ' + D.TOTAL_POIS + ' 点位</span></div>' +
        '<div class="sub">点省份进入省地图；未收录显示破折号 —— 不是 0</div></div>' +
        '<div class="m-list scroll" style="padding-top:4px">' + rows + '</div>';
    } else if (S.route === 'province') {
      /* 省级层：该省市州列表 + 计数 */
      var pv = PROVINCE_BY_ID[S.provinceId] || {};
      var cities = D.SICHUAN_CITIES;
      var doneN = cities.filter(function (c) { return c.count != null; }).length;
      var rowsP = cities.map(function (c) {
        var pending = c.count == null;
        return '<button class="drow' + (pending ? ' is-pending' : '') + '" data-act="goto-city-by" data-adcode="' + c.id + '">' +
          '<span class="dn"><b>' + esc(shortName(c.name)) + '</b><span>' +
          esc(pending ? '待收录 · 内容整理中' : c.count + ' 个点位 · 景点 15 / 美食 15') + '</span></span>' +
          cntHTML(c.count) +
          '<span class="go">' + (pending ? '—' : ico('chev-right', 'ico--sm')) + '</span></button>';
      }).join('');
      inner = '<div class="sheet-head"><div class="row1"><b>' + esc(shortName(pv.name || '四川')) + ' · ' +
        cities.length + ' 个市州</b><span class="hint">' + doneN + ' 市已收录</span></div>' +

      inner = '<div class="sheet-head"><div class="row1"><b>' + esc(city.name) + ' · ' + list.length +
        ' 个点位</b><span class="hint">地图已同步</span></div>' +

        (S.sub !== 'all' ? ' · 已限定「' + esc(SUBTYPE_META[S.sub].label) + '」' : '') +

        '<div class="m-list scroll">' + rows2 + '</div>' +
        planEntryHTML() +
        '<div class="m-foot"><button class="btn" data-act="sort">' +
        esc(S.sort === 'hot' ? '热门优先' : '名称排序') + ico('chev-down', 'ico--sm') + '</button>' +

    } else if (isDetail && poi) {

          '<div class="m-metacell"><div class="k">' + ico('ticket', 'ico--sm') + '门票<button class="ref" data-act="jump-src">1</button></div><div class="v">' + esc(poi.ticket) + '</div></div>' +

          '<div class="m-metacell"><div class="k">' + ico('train', 'ico--sm') + '最近地铁</div><div class="v" style="font-size:var(--fs-sm)">' + esc(poi.metro) + '</div></div>' +
        '</div>' +
        /* ★ 适游群体：与桌面详情、列表、预览卡三处同源 */
        '<h3 class="pd-h" style="font-size:var(--fs-lg)">适合人群</h3>' +
        (poi.audience && poi.audience.length ? audHTML(poi)
          : '<p class="pd-note">该点位的适游群体信息尚未核实，暂不展示。</p>') +
        '<h3 class="pd-h" style="font-size:var(--fs-lg)">亮点</h3>' +
        poi.highlights.map(function (x) { return '<div class="m-hl"><span class="dot"></span><span>' + esc(x) + '</span></div>'; }).join('') +
        '<h3 class="pd-h" style="font-size:var(--fs-lg)">数据来源</h3>' +
        '<div class="srcbox" style="margin-bottom:20px">' +
          '<ol>' + poi.sources.map(function (s, i) {
            return '<li><span class="num">' + (i + 1) + '</span><span>' + esc(s.text) + ' · <a href="https://' + esc(s.url) +
              '" target="_blank" rel="noopener noreferrer">' + esc(s.url) + '</a></span></li>';
          }).join('') + '</ol>' +
          '<div class="fine">原型示例数据；正式版由采集流水线产出并附真实抓取日期。</div>' +
        '</div></div></div>' +
        '<div class="m-foot">' +
          '<button class="btn btn--primary" data-act="locate">' + ico('crosshair', 'ico--sm') + '在地图上定位</button>' +
        '<button class="btn" data-act="nearby">看周边</button></div>';
    } else if (S.route === 'plan') {
      /* ★ 必须排在 `poi` 分支之前：S.poiId 在从详情页跳过来时仍然有值，
         若先判 `if (poi)` 会把行程 Sheet 渲染成详情内容（踩过：探针显示 tl:0）。
         判据一律用 route，不用「某个 id 是否有值」。 */
      /* ★ 移动端三档 Sheet：档位不同，**内容也不同**（09 文档 6.4）。
         不是同一段 HTML 换个高度 —— 那样 peek 档会把时间轴塞进 28svh，等于没有。
           peek (28svh)  DayTabs + 当天首段：只回答「几点出门、先去哪」
           half (56svh)  + 时间轴前 3–4 项 + **汇总条**（默认档）
           full (88svh)  + 完整时间轴 + 过载提示 + 操作条 */
      var pday = planDay(), ptl = buildTimeline(pday), stay = D.stayOf(pday);
      var psrcTxt = stay.source === 'geocoded' ? '搜索定位' : stay.source === 'picked' ? '地图点选' : '从 POI 里选';
      var pwarns = overloadWarnings(ptl).map(function (w) {
        return '<div class="warnbar" style="margin:0 0 6px">' + ico('alert', 'ico--sm') + '<span>' + esc(w) + '</span></div>';
      }).join('');
      var tier = S.sheet;
      /* 汇总条：half 档的核心信息 —— 「一天够不够」在这里回答，不用滚到底 */
      var mSum = '<div class="m-sum">' +
        '<span>在途 <b>' + fmtDur(ptl.transitSec) + '</b></span>' +
        '<span>停留 <b>' + fmtDur(ptl.dwellMin * 60) + '</b></span>' +
        '<span class="tot">合计 <b>' + fmtDur((ptl.endMin - ptl.startMin) * 60) + '</b></span></div>';

      if (tier === 'peek') {
        /* peek：只给「几点出门 + 第一个点位」，其余交给上滑 */
        inner = '<div class="sheet-head">' +
            '<div class="row1"><b>第 ' + pday.day + ' 天 · ' + fmtClock(ptl.startMin) + ' 出发</b>' +
            '<span class="hint">' + pday.items.length + ' 个点位 · ' +
            fmtDur((ptl.endMin - ptl.startMin) * 60) + '</span></div>' +
            '<div class="sub">先去 ' + esc((placeOf(pday.items[0]) || {}).name || '—') +
            ' · 住宿 ' + esc(stay.name) + '</div></div>' +
          dayTabsHTML('m-daytabs');
      } else if (tier === 'half') {
        inner = '<div class="sheet-head">' +
            '<div class="row1"><b>我的行程 · 第 ' + pday.day + ' 天</b>' +
            '<span class="hint">' + pday.items.length + ' 个点位</span></div>' +
            '<div class="sub">住宿：' + esc(stay.name) + ' · ' + esc(psrcTxt) + ' · 仅存本机</div>' +
            '<button class="chg" data-act="plan-stay" style="position:absolute;right:14px;top:14px">更换</button></div>' +
          dayTabsHTML('m-daytabs') +
          '<div class="m-list scroll">' +
            '<div class="tl tl--m">' + planTimelineHTML(ptl, true, 4) + '</div>' +
          '</div>' + mSum;
      } else if (tier === 'full') {
        inner = '<div class="sheet-head">' +
            '<div class="row1"><b>我的行程 · 第 ' + pday.day + ' 天</b>' +
            '<span class="hint">' + pday.items.length + ' 个点位 · ' +
            fmtDur((ptl.endMin - ptl.startMin) * 60) + '</span></div>' +
            '<div class="sub">住宿：' + esc(stay.name) + ' · ' + esc(psrcTxt) + ' · 仅存本机</div>' +
            '<button class="chg" data-act="plan-stay" style="position:absolute;right:14px;top:14px">更换</button></div>' +
          dayTabsHTML('m-daytabs') +
          '<div class="m-list scroll">' +
            '<div class="tl tl--m">' + planTimelineHTML(ptl, true) + '</div>' +
            (pwarns ? '<div style="padding:4px 14px 10px">' + pwarns + '</div>' : '') +
          '</div>' + mSum +
          '<div class="m-foot">' +
            '<button class="btn" data-act="plan-export">' + ico('link', 'ico--sm') + '导出</button>' +
            '<button class="btn btn--primary" data-act="plan-add">' + ico('plus', 'ico--sm') + '添加点位</button>' +
          '</div>';
      }
    }

    mount.innerHTML = '<div class="sheet" id="sheet">' +
      '<div class="sheet-grip" role="separator" aria-label="拖动调整面板高度"></div>' + inner + '</div>';
    applySheet(S.sheet);
    bindSheetDrag();
  }

  function sheetEl() { return document.getElementById('sheet'); }
  function setSheetCSS(h) { vp.style.setProperty('--sheet-h', h + 'px'); positionFloats(); }
  function applySheet(snap) {
    var changed = S.sheet !== snap;
    S.sheet = snap;
    var el = sheetEl();
    if (el) el.classList.remove('is-dragging');
    setSheetCSS(SNAP[snap] || SNAP.half);
    /* ★ 行程页的三档是**不同内容**（peek 只给首段 / half 给前 4 项 + 汇总 / full 给全部），
       所以切档必须重渲染 Sheet；其他页面三档共用同一段内容，只改高度就够了。
       changed 守卫避免 renderMobile→applySheet 的无限递归。 */
    if (changed && S.route === 'plan' && S.device === 'mobile') renderMobile();
  }
  function positionFloats() {
    var h = SNAP[S.sheet] || SNAP.half;
    var strip = vp.clientHeight - h;      // Sheet 上方露出的地图带高度
    elMobile.querySelectorAll('[data-follow-sheet]').forEach(function (n) {
      /* Sheet 太高（露出 < 150px）时，跟随式定位会把署名顶进顶部胶囊那一行 →
         改为贴到地图区左上角（仍在最上层、仍不被遮挡）。
         注意：容器上有 inline 的 right，必须一并解除，否则类里的 right:auto 会被压过。 */
      var needsTop = strip < 150;
      n.classList.toggle('is-top', needsTop);
      n.style.bottom = needsTop ? '' : (h + 10) + 'px';
      n.style.right = needsTop ? 'auto' : '12px';
    });
  }
  function bindSheetDrag() {
    var el = sheetEl(); if (!el) return;
    var grip = el.querySelector('.sheet-grip');
    var dragging = false, startY = 0, startH = 0;
    function down(e) {
      dragging = true; startY = e.clientY; startH = SNAP[S.sheet];
      el.classList.add('is-dragging');
      if (grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      var dy = (e.clientY - startY) / (S.scale || 1);   // 画布已整体缩放，需换算回画布像素
      var h = Math.max(SNAP.peek - 40, Math.min(SNAP.full, startH - dy));
      setSheetCSS(Math.round(h));
    }
    function up() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('is-dragging');
      var cur = parseFloat(getComputedStyle(vp).getPropertyValue('--sheet-h'));
      var best = 'half', dmin = 1e9;
      Object.keys(SNAP).forEach(function (k) {
        var d = Math.abs(SNAP[k] - cur);
        if (d < dmin) { dmin = d; best = k; }
      });
      applySheet(best);
    }
    grip.addEventListener('pointerdown', down);
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    /* 点按手柄 = 循环换档（无拖拽时的快捷操作） */
    grip.addEventListener('click', function () {
      if (Math.abs(parseFloat(getComputedStyle(vp).getPropertyValue('--sheet-h')) - SNAP[S.sheet]) < 2) {
        var order = ['peek', 'half', 'full'];
        applySheet(order[(order.indexOf(S.sheet) + 1) % 3]);
      }
    });
  }

  function renderBasemapUI() {
    /* 顶栏 / 移动端分段控件的选中态（不重绘 DOM，只改 aria-pressed） */
    elTopbar.querySelectorAll('[data-act="set-base"]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.value === S.base);
    });
    elMobile.querySelectorAll('[data-act="set-base"]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.value === S.base);
    });
  }

  /* ======================================================================
     交互
     ====================================================================== */
  function showToast(msg, actionLabel, actionFn) {
    elToast.innerHTML = esc(msg) + (actionLabel ? '<button data-act="toast-action">' + esc(actionLabel) + '</button>' : '');
    elToast.classList.add('is-on');
    if (actionFn) elToast.__fn = actionFn; else elToast.__fn = null;
    clearTimeout(showToast.__t);
    showToast.__t = setTimeout(function () { elToast.classList.remove('is-on'); }, 5200);
  }

  function selectPoi(id, moveMap) {
    S.selectedId = id;
    if (moveMap && MAP && S.mapMode === 'real') {
      var p = POI_BY_ID[id];
      if (p) { try { MAP.easeTo({ center: new TMap.LatLng(p.lat, p.lng), duration: 520 }); } catch (e) {} S.userMoved = true; }
    }
    syncMarkers(); renderFallback(); renderPanel(); renderPreview(); renderMobile(); renderControlsState();
    /* 列表选中行滚入视野 */
    var row = document.querySelector('[data-act="select-poi"][data-poi="' + id + '"]');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
  }
  function deselect() {
    if (!S.selectedId) return;
    S.selectedId = null;
    syncMarkers(); renderFallback(); renderPanel(); renderPreview(); renderMobile();
  }
  function gotoCity(id) {
    S.cityId = id; S.route = 'city';
    S.selectedId = null; S.cat = 'all'; S.sub = 'all'; S.q = ''; S.pendingName = null;
    fitToRoute(); render(); applySheet('half');
  }
  function gotoHome() {
    S.route = 'home'; S.selectedId = null; S.q = ''; S.cat = 'all'; S.sub = 'all'; S.pendingName = null;
    fitToRoute(); render(); applySheet('half');
  }
  /* ★ 下钻跳转：全国 → 省 → 市。未收录的一律走「待收录」引导，不下钻 */
  function gotoProvince(adcode) {
    var p = PROVINCE_BY_ID[adcode];
    if (!p) return;
    if (p.count == null) { showPending(p.name); return; }
    S.provinceId = adcode; S.route = 'province';
    S.selectedId = null; S.cat = 'all'; S.sub = 'all'; S.q = ''; S.pendingName = null;
    fitToRoute(); render(); applySheet('half');
  }
  function gotoCityByAdcode(adcode) {
    var c = SCITY_BY_ID[adcode];
    if (!c) return;
    if (c.count == null) { showPending(c.name); return; }
    gotoCity('chengdu');   /* 本轮数据范围 = 先跑通链路，只有成都有内容 */
  }
  function showPending(name) {
    S.pendingName = name;
    renderPreview();
    if (S.device === 'mobile') {
      showToast('「' + shortName(name) + '」内容整理中 · 本轮先跑通链路，只填充了四川');
    } else {
      showToast('「' + shortName(name) + '」尚未收录，已给出可去的下一步');
    }
  }
  function closePending() { S.pendingName = null; renderPreview(); }
  function gotoPoi(id) {
    S.poiId = id; S.route = 'detail'; S.selectedId = null; S.pendingName = null;
    fitToRoute(); render();
    if (S.device === 'mobile') applySheet('full');
  }
  /** 进入行程页 —— ★ 住宿点只存在 localStorage，不进 URL、不上传（09 文档 3.2） */
  function gotoPlan() {
    S.route = 'plan'; S.selectedId = null; S.pendingName = null;
    if (S.planDay > D.PLAN_DAYS.length) S.planDay = 1;
    fitToRoute(); render();
    /* 移动端行程默认 half 档：先给时间轴前半段，地图仍然看得见连线 */
    if (S.device === 'mobile') applySheet('half');
  }

  /* ---------- 灯箱 ---------- */
  function openLightbox(poi, idx) {
    S.lbList = poi.images; S.lbIndex = idx || 0;
    paintLightbox();
    elLightbox.classList.add('is-on');
  }
  function paintLightbox() {
    var im = S.lbList[S.lbIndex];
    if (!im) return;
    elLbImg.src = D.photo(im.key, 1400, 950);
    elLbCap.innerHTML = '<b>' + esc(POI_BY_ID[S.poiId].name) + '</b> · 第 ' + (S.lbIndex + 1) + ' / ' + S.lbList.length +
      ' 张 · 图片：Unsplash（开放许可，氛围示意）';
  }
  function closeLightbox() { elLightbox.classList.remove('is-on'); }

  /* ---------- 事件委托 ---------- */
  function onClick(e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.dataset.act;
    if (act === 'toast-action') { if (elToast.__fn) elToast.__fn(); elToast.classList.remove('is-on'); return; }
    if (t.tagName === 'A') e.preventDefault();

    switch (act) {
      case 'goto-home': gotoHome(); break;
      case 'goto-city': gotoCity(t.dataset.city || S.cityId); break;
      case 'goto-province': gotoProvince(t.dataset.prov || S.provinceId); break;
      case 'goto-city-by': gotoCityByAdcode(t.dataset.adcode); break;
      case 'close-pending': closePending(); break;
      case 'goto-poi': gotoPoi(t.dataset.poi); break;
      case 'select-poi': selectPoi(t.dataset.poi, true); break;
      case 'close-preview': deselect(); break;
      case 'sub':
        /* 细类二次过滤：再点同一项 = 取消（回到全部细类） */
        S.sub = (S.sub === t.dataset.sub) ? 'all' : t.dataset.sub;
        S.selectedId = null;
        renderPanel(); renderMobile(); syncMarkers(); renderFallback(); renderPreview(); renderLegend();
        fitToRoute(false);
        break;
      case 'cat':
        /* 换大类时同步清掉细类限定，否则会出现「大类 A + 细类属于 B」的空结果 */
        S.cat = t.dataset.cat; S.sub = 'all'; S.selectedId = null;
        renderPanel(); renderMobile(); syncMarkers(); renderFallback(); renderPreview(); renderLegend();
        fitToRoute(false);
        break;
      case 'sort':
        S.sort = S.sort === 'hot' ? 'name' : 'hot';
        renderPanel(); renderMobile();
        break;
      case 'set-base':
        if (t.dataset.value === S.base && !S.autoDown) { S.baseLocked = !S.baseLocked; }
        else { S.base = t.dataset.value; S.autoDown = false; }
        applyBase(S.base, true);
        break;
      case 'lock':
        S.baseLocked = !S.baseLocked;
        renderTopbar(); renderMobile(); renderLegend();
        showToast(S.baseLocked ? '已锁定底图：缩放不再自动切换' : '已解锁底图：放大到 zoom 15.5 以上会自动切矢量');
        break;
      case 'zoom-in': if (MAP) { try { MAP.setZoom(MAP.getZoom() + 1, false); } catch (er) {} } break;
      case 'zoom-out': if (MAP) { try { MAP.setZoom(MAP.getZoom() - 1, false); } catch (er) {} } break;
      case 'reset-view': fitToRoute(false); renderControlsState(); break;
      case 'locate':
        runLocate();
        break;
      case 'fullscreen':
        showToast('全屏：正式版调用 Fullscreen API，地图与浮层共同进入全屏。');
        break;
      case 'share':
        copyText(location.href.split('#')[0] + '#/city/' + S.cityId + '/poi/' + S.poiId,
          '详情页链接已复制（原型内不跳转，正式版会生成可收录的静态页 URL）');
        break;
      case 'city-menu':
        showToast('下钻路径见顶栏面包屑：全国 → 四川 → 成都，每一级都可点回上级。');
        break;
      case 'about': showToast('「关于 / 数据来源」为独立说明页，列出全部数据与图片来源。'); break;
      case 'menu': applySheet(S.sheet === 'peek' ? 'half' : 'peek'); break;
      case 'nav': showToast('导航：正式版按六种通行方式（驾车 / 打车 / 公交 / 地铁 / 骑行 / 步行）给出多路线备选，应对堵车。'); break;
      case 'nearby': showToast('「看周边」把地图视野收拢到该点位附近的同类点位。'); break;
      case 'jump-src': {
        var box = document.getElementById('srcBlock');
        if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.style.boxShadow = 'inset 0 0 0 2px var(--c-primary)'; setTimeout(function(){ box.style.boxShadow = ''; }, 1200); }
        break;
      }
      /* ================= 行程规划（09 文档第六节）=================
         ★ 每条交互只改「用户自己的决定」（顺序 / 停留 / 方式 / 住宿），
           系统只负责把时间链重算一遍 —— 不做任何自动重排。 */
      case 'goto-plan': gotoPlan(); break;
      case 'sheet-full': applySheet('full'); break;   /* 时间轴截断处的「上滑查看全部」*/
      case 'plan-day':
        S.planDay = parseInt(t.dataset.day, 10) || 1;
        S.openLeg = null; S.editDwell = null; S.hoverLeg = null; S.fitLeg = null;
        render(); fitToRoute(false);     /* 换天 → 地图重新框住「住宿 + 当天点位」 */
        break;
      case 'plan-leg':
        /* 点开才拉方案：进入页面不拉，避免一屏 5 段 × 3 方案的配额浪费。
           ★ 同时把视野收窄到这一段的两个端点 —— 用户点某一段就是想看清这一段（09 文档 6.3） */
        S.openLeg = (S.openLeg === t.dataset.uid) ? null : t.dataset.uid;
        render();
        if (S.openLeg) fitToLeg(S.openLeg);
        break;
      case 'plan-mode': {
        var it0 = findPlanItem(t.dataset.uid);
        if (it0) {
          it0.modeToNext = t.dataset.mode;
          delete S.planOpts[it0.uid];     /* 换方式后 A/B/C 失效，回到默认方案 A */
          render();
          var mm = D.MODE_BY_KEY[t.dataset.mode];
          showToast('这一段改为「' + mm.label + '」' +
            (mm.live ? ' · 公交/地铁实时算，已带缓存' : '') +
            ' · 时间链已重算');
        }
        break;
      }
      case 'plan-opt':
        S.planOpts[t.dataset.uid] = t.dataset.opt;
        render();
        showToast('已选 ' + t.dataset.opt + ' 方案 · 时间链按该方案重算，顺序与点位不变');
        break;
      case 'plan-dwell': S.editDwell = t.dataset.uid; render(); break;
      case 'plan-dwell-inc':
      case 'plan-dwell-dec': {
        var it1 = findPlanItem(t.dataset.uid);
        if (it1) {
          it1.dwell = Math.min(480, Math.max(15, it1.dwell + (act === 'plan-dwell-inc' ? 15 : -15)));
          render();
        }
        break;
      }
      case 'plan-dwell-done': S.editDwell = null; render(); break;
      case 'plan-stay': cycleStay(); break;
      case 'plan-add': addPlanPoi(); break;
      case 'plan-move-day': movePlanItem(t.dataset.uid); break;
      case 'plan-import':
        /* ★ 导入是导出的另一半（09 文档第八节）：能导出就能导回，
           否则用户手里的 JSON 是一次性的。正式版走 Zod 校验后合并，同 uid 覆盖。 */
        showToast('导入：正式版选 JSON → Zod 校验（城市 / 住宿段 / 天数 / uid）→ 合并进当前行程' +
          '（同 uid 覆盖，不冲突的新增）· 全程在本机完成，不上传');
        break;
      case 'plan-export':
        /* 注意：这里**不提 .ics** —— 09 文档第八节只定了 JSON 备份与分享链接，
           原型不该替产品承诺没设计的格式 */
        showToast('导出：正式版下载「我的成都行程.json」（住宿段 + 每天点位与顺序 + 停留与方式）。' +
          '行程本来就只在本机，导出不经过服务器。');
        break;
      case 'plan-share':
        /* ★ 分享链接不含住宿点 —— 住宿点等于「他在哪过夜」，默认脱敏（09 文档 3.3） */
        if (S.degrade === 'broken-link') {
          /* 降级：链接解析失败要给出口，不能只留一个空白页（09 文档第九节最后一行） */
          showToast('链接已失效或格式不兼容 · 已保留你当前的行程，可继续手动添加点位');
          break;
        }
        copyText(location.href.split('#')[0] + '#/city/' + S.cityId + '/plan?d=' + S.planDay,
          '行程链接已复制 · 链接只含点位与顺序，不含住宿点（住宿点默认脱敏）');
        break;
      case 'open-lightbox': {
        var poi = POI_BY_ID[S.poiId] || POI_BY_ID[S.selectedId];
        if (poi) openLightbox(poi, parseInt(t.dataset.idx, 10));
        break;
      }
      case 'lb-close': closeLightbox(); break;
      case 'lb-prev': S.lbIndex = (S.lbIndex - 1 + S.lbList.length) % S.lbList.length; paintLightbox(); break;
      case 'lb-next': S.lbIndex = (S.lbIndex + 1) % S.lbList.length; paintLightbox(); break;
    }
  }
  vp.addEventListener('click', onClick);
  elToast.addEventListener('click', onClick);

  /**
   * hover 一段 Leg → 地图上这一段提亮、其余降到 40%（09 文档 6.3 第一行）。
   * ★ 只重画地图图层，不整屏 render —— 整屏重建会让正被 hover 的那一行在鼠标下重建，
   *   移动鼠标时会出现肉眼可见的抖动，比不做这个联动还糟。
   */
  function setHoverLeg(k) {
    if (S.hoverLeg === k) return;
    S.hoverLeg = k;
    syncMarkers();
    if (S.mapMode !== 'real') renderFallback();
  }
  vp.addEventListener('mouseover', function (e) {
    if (S.device !== 'desktop') return;               /* 移动端没有 hover，别做无用功 */
    var el = e.target && e.target.closest ? e.target.closest('[data-leg]') : null;
    setHoverLeg(el ? el.getAttribute('data-leg') : null);
  });
  vp.addEventListener('mouseout', function (e) {
    if (S.device !== 'desktop') return;
    var el = e.target && e.target.closest ? e.target.closest('[data-leg]') : null;
    if (el) setHoverLeg(null);
  });

  function copyText(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast(msg); }, function () { showToast(msg); });
    } else showToast(msg);
  }
  function runLocate() {
    if (!navigator.geolocation) { showToast('当前环境不支持定位；正式版会优雅降级为「不显示距离」。'); return; }
    showToast('正在获取当前位置…（位置只在本地内存计算，不采集、不上传）');
    navigator.geolocation.getCurrentPosition(function (pos) {
      S.myPos = { lng: pos.coords.longitude, lat: pos.coords.latitude };
      renderPanel(); renderMobile();
      showToast('已定位：列表尾改为显示「距我多远」。坐标只在本地内存参与排序，不落库、不上传。');
      if (MAP && S.mapMode === 'real') {
        try { MAP.easeTo({ center: new TMap.LatLng(pos.coords.latitude, pos.coords.longitude), zoom: 14, duration: 600 }); } catch (e) {}
      }
    }, function () {
      showToast('定位被拒绝或不可用，已回退为「不显示距离」——功能完全不受影响。');
    }, { timeout: 6000, maximumAge: 60000 });
  }

  /* 搜索输入（防抖 300ms） */
  var searchTimer = null;
  vp.addEventListener('input', function (e) {
    if (!e.target.matches('[data-role="search"]')) return;
    S.q = e.target.value || '';
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var focusPos = S.q.length;
      renderPanel(); renderMobile();
      var inp = vp.querySelector('[data-role="search"]');
      if (inp) { inp.focus(); try { inp.setSelectionRange(focusPos, focusPos); } catch (er) {} }
      syncMarkers(); renderFallback();
    }, 300);
  });

  /* hover 联动：列表行 → 地图 marker 放大（不移动地图） */
  vp.addEventListener('mouseover', function (e) {
    var row = e.target.closest('[data-act="select-poi"]');
    if (!row || row.dataset.poi === S.hoveredId) return;
    S.hoveredId = row.dataset.poi;
    row.classList.add('is-hover');
    if (MAP && S.mapMode === 'real' && markers) {
      try {
        var all = markers.getGeometries();
        markers.updateGeometries(all.map(function (g) {
          var p = POI_BY_ID[g.id];
          /* ★ 样式名必须用「细类」前缀 sub-<subtype>：marker 已全面改按细类着色，
             大类样式（sight / food …）在 buildLayers 里早已不再注册，
             这里若还用 p.cat 会拿到一个不存在的 styleId，hover 时图标直接消失 */
          return {
            id: g.id,
            styleId: 'sub-' + p.subtype + ((p.id === S.hoveredId || p.id === S.selectedId) ? 'A' : ''),
            position: g.position
          };
        }));
      } catch (er) {}
    }
  });
  vp.addEventListener('mouseout', function (e) {
    var row = e.target.closest('[data-act="select-poi"]');
    if (!row) return;
    S.hoveredId = null;
    row.classList.remove('is-hover');
    syncMarkers();
  });

  /* 键盘：Esc 关闭顶层浮层 / ← → 切换灯箱 / / 聚焦搜索 */
  document.addEventListener('keydown', function (e) {
    if (elLightbox.classList.contains('is-on')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') { S.lbIndex = (S.lbIndex - 1 + S.lbList.length) % S.lbList.length; paintLightbox(); }
      if (e.key === 'ArrowRight') { S.lbIndex = (S.lbIndex + 1) % S.lbList.length; paintLightbox(); }
      return;
    }
    if (e.key === 'Escape') {
      if (S.device === 'mobile' && S.sheet === 'full') { applySheet('half'); return; }
      if (S.selectedId) { deselect(); return; }
    }
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      var inp = vp.querySelector('[data-role="search"]');
      if (inp) { e.preventDefault(); inp.focus(); }
    }
  });

  /* ======================================================================
     端切换 / 缩放适配
     ====================================================================== */
  function fitStage() {
    var isM = S.device === 'mobile';
    var w = isM ? 390 : 1280, h = isM ? 844 : 820;
    var availW = window.innerWidth - 44;
    var availH = window.innerHeight - 116;
    S.scale = Math.min(1, availW / w, availH / h);
    scaler.style.transform = 'scale(' + S.scale + ')';
  }
  function setDevice(dev) {
    S.device = dev;
    vp.className = 'vp vp--' + dev;
    document.getElementById('island').hidden = dev !== 'mobile';
    document.getElementById('statusbar').hidden = dev !== 'mobile';
    document.getElementById('homebar').hidden = dev !== 'mobile';
    if (!S.baseExplicit) S.base = defaultBase();   // 分端默认底图（深链显式指定时不覆盖）
    S.autoDown = false; S.baseLocked = false;
    vp.classList.toggle('light-status', S.effBase === 'vector');
    fitStage();
    render();
    applyBase(S.base, false);
  }

  /* ======================================================================
     原型控制台
     ====================================================================== */
  function renderConsole() {
    function grp(items, cur, act, key) {
      return items.map(function (it) {
        return '<button class="cbtn" data-act="' + act + '" data-value="' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + '</button>';
      }).join('');
    }
    document.getElementById('cDevice').innerHTML = grp([['desktop', '桌面 1280×820'], ['mobile', '移动 390×844']], S.device, 'c-device');
    document.getElementById('cRoute').innerHTML = grp([['home', '首页'], ['province', '省页'], ['city', '城市页'], ['detail', '详情页'], ['plan', '行程页']], S.route, 'c-route');
    document.getElementById('cBase').innerHTML = grp([['vector', '矢量'], ['satellite', '影像']], S.base, 'c-base');
    document.getElementById('cExtra').innerHTML =
      '<button class="cbtn" data-act="c-guides" aria-pressed="' + S.guides + '">Sheet 参考线</button>' +
      (S.device === 'mobile' ? grp([['peek', 'peek'], ['half', 'half'], ['full', 'full']], S.sheet, 'c-sheet') : '') +
      /* ★ 降级演示开关（09 文档第九节）：这 5 条都说「必须逐条实现」，
         原型里至少要让每一条都能被点到、看得见 —— 否则验收时只能靠想象。 */
      (S.route === 'plan'
        ? grp([['none', '正常'], ['quota', '额度用尽'], ['nostore', '不能存储'],
               ['broken-link', '链接失效'], ['single-opt', '仅 1 方案'], ['no-fare', '无打车费']],
              S.degrade, 'c-deg')
        : '');

    document.querySelectorAll('#cDevice .cbtn,#cRoute .cbtn,#cExtra .cbtn').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act, v = b.dataset.value;
        if (a === 'c-device') setDevice(v);
        else if (a === 'c-route') {
          /* 四级下钻：全国 → 四川 → 成都 → 宽窄巷子；行程页是城市页的横向延伸 */
          if (v === 'home') gotoHome();
          else if (v === 'province') gotoProvince(SC_PROVINCE);
          else if (v === 'city') gotoCity('chengdu');
          else if (v === 'plan') gotoPlan();
          else gotoPoi('kuanzhai-alley');
        }
        else if (a === 'c-guides') { S.guides = !S.guides; elGuides.classList.toggle('is-on', S.guides); }
        else if (a === 'c-sheet') applySheet(v);
        else if (a === 'c-deg') { S.degrade = v; render(); }
        renderConsole();
      };
    });
    document.querySelectorAll('#cBase .cbtn').forEach(function (b) {
      b.onclick = function () { S.base = b.dataset.value; S.autoDown = false; applyBase(S.base, false); renderConsole(); };
    });
  }

  /* ---------- 深链：?v=mobile&r=detail&p=xxx&b=vector&s=full ----------
     便于直接打开某个形态做评审 / 截图 / 分享复现 */
  function applyDeepLink() {
    var h = location.search + location.hash, q = {};
    h.replace(/[?&#]([a-z]+)=([^&]*)/gi, function (_, k, v) { q[k.toLowerCase()] = decodeURIComponent(v); return ''; });
    if (q.v === 'mobile' || q.v === 'desktop') S.device = q.v;
    if (q.b === 'vector' || q.b === 'satellite') S.base = q.b;
    if (q.s && SNAP[q.s]) S.sheet = q.s;
    if (q.c && CITY_BY_ID[q.c]) S.cityId = q.c;
    if (q.adcode && PROVINCE_BY_ID[q.adcode] && PROVINCE_BY_ID[q.adcode].count != null) S.provinceId = q.adcode;
    if (q.r === 'city' || q.r === 'detail' || q.r === 'home' || q.r === 'province') {
      S.route = q.r;
      if (q.p && POI_BY_ID[q.p]) { S.poiId = q.p; S.selectedId = q.p; }
    }
    return q.b === 'vector' || q.b === 'satellite';   // 底图是否被显式指定
  }

  /* ---------- 启动 ---------- */
  window.addEventListener('resize', fitStage);
  S.baseExplicit = applyDeepLink();
  setDevice(S.device);
  fitToRoute(true);
  renderConsole();
  initMap();
  /* 控制台状态与视图联动（地图状态文字在 initMap 内更新） */
  var consoleTick = setInterval(function () {
    var btn = document.querySelector('#cRoute .cbtn[aria-pressed="true"]');
    if (btn && btn.dataset.value !== S.route) renderConsole();
    var db = document.querySelector('#cDevice .cbtn[aria-pressed="true"]');
    if (db && db.dataset.value !== S.device) renderConsole();
    var bb = document.querySelector('#cBase .cbtn[aria-pressed="true"]');
    if (bb && bb.dataset.value !== S.base) renderConsole();
    var sb = document.querySelector('#cExtra .cbtn[data-act="c-sheet"][aria-pressed="true"]');
    if (sb && sb.dataset.value !== S.sheet) renderConsole();
  }, 400);

  /* 暴露给控制台调试（含四级下钻跳转与端切换，便于自动化探针驱动层级 / 形态）
     注意：切端必须走 setDevice —— 只改 S.device 不会同步 .vp--mobile 类，
     移动端布局与底部 Sheet 的 CSS 全部挂在那个类上，只改数据会渲染出「空壳」。 */
  window.__HJ = {
    S: S, render: render, setDevice: setDevice, applySheet: applySheet,
    gotoHome: gotoHome, gotoProvince: gotoProvince, gotoCityByAdcode: gotoCityByAdcode,
    gotoCity: gotoCity, gotoPoi: gotoPoi, gotoPlan: gotoPlan
  };
})();
</script>
</body>
</html>
