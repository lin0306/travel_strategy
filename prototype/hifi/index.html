      fetchedAt: FETCHED_AT,
      cityId: 'chengdu'
    };
  });

  /* 图集：封面 + 3 张同类别的不同配图，避免同一 POI 五张图雷同 */
  var CAT_POOL = {
    sight:   ['pagoda', 'forest', 'treeSunset', 'mountain', 'hills', 'alleyRain'],
    food:    ['bowlsChili', 'dimsum', 'noodles1', 'noodles2', 'plated', 'dining', 'restaurant'],
    hot:     ['cityNight', 'citySkyline', 'cityRiver', 'gallery', 'alleyNight', 'cityStreet'],
    special: ['lanterns', 'teaField', 'dining', 'alleyRain', 'hills', 'tapas']
  };
  POIS.forEach(function (p, idx) {
    var pool = CAT_POOL[p.cat].filter(function (k) { return k !== p.imgKey; });
    var picks = [p.imgKey];
    for (var i = 0; picks.length < 5; i++) {
      picks.push(pool[(idx + i) % pool.length]);
    }
    p.images = picks.map(function (k, i) {
      return { key: k, role: i === 0 ? 'cover' : 'gallery', tier: 'ambience' };
    });
  });

  /* ---------- 派生：总量统计 ----------
     ★ 单一真源 = POIS（实际存在的点位记录数），不是 CITIES[].total 的求和。
     CITIES 是「首批 10 城」的规划元数据（name / tagline / 中心点仍在用），
     其 total 属于规划口径；本轮只填充了成都，若拿它求和会显示 462 这种
     「凭空多出来 400 多个点位」的假数字，与页面上 34 省里只有 1 省已收录自相矛盾。 */
  var TOTAL_POIS = POIS.length;

  /* ---------- 派生：省 / 市（下钻用） ----------
     计数以 POIS 为单一真源回填（避免"数组里写 46、实际 POI 有 46 条"这种迟早会漂移的双份真相）。
     未收录保持 null —— 渲染层负责把它变成「待收录」，绝不显示 0。 */
  var PROVINCES = PROVINCE_RAW.map(function (r) {
    return { id: r[1], name: r[0], adcode: r[1], lng: r[2], lat: r[3], count: r[4] };
  });
  var SICHUAN_CITIES = SICHUAN_RAW.map(function (r) {
    return { id: r[1], name: r[0], adcode: r[1], lng: r[2], lat: r[3], count: r[4] };
  });
  var PROVINCE_BY_ID = {}, SCITY_BY_ID = {};
  PROVINCES.forEach(function (p) { PROVINCE_BY_ID[p.id] = p; });
  SICHUAN_CITIES.forEach(function (c) { SCITY_BY_ID[c.id] = c; });
  /* 回填真实计数：四川省 / 成都市 = 当前已收录点位数 */
  if (PROVINCE_BY_ID['510000']) PROVINCE_BY_ID['510000'].count = POIS.length;
  if (SCITY_BY_ID['510100']) SCITY_BY_ID['510100'].count = POIS.length;

  var PROVINCE_COUNT = 34;
  /* 收录密度分级（0 未收录 / 1 → 1–19 / 2 → 20–49 / 3 → 50+），供徽标底色与图例共用 */
  function densityLevel(n) {
    if (n == null) return 0;
    if (n >= 50) return 3;
    if (n >= 20) return 2;
    return 1;
  }

  /* ======================================================================
     行程规划数据（09 文档第四节）
     -----------------------------------------------------------------------
     ★ 这里是「原型的 mock 替身」，边界要说清：
       真实实现里，行程（Stay / ItineraryDay / DayItem）存 localStorage，
       通勤时长读构建期预计算好的 base36 矩阵（data/_generated/transit.json）。
       原型没有那一步产物，于是用「真实坐标 + haversine 直线距离 × 方式系数」本地推算替代。
       这样做守住了三件事：
         ① 时间链是**真推导**的（纯函数累加），不是写死的字符串
         ② POI↔POI 段仍然零 API 调用（纯本地查 / 算）
         ③  distances 与真实 POI 坐标一致，换点位数值会跟着变
       没有守住的是：真实矩阵里的「路网绕行 + 路况快照」。所以 UI 上必须标「估算」。
     ====================================================================== */

  /**
   * 住宿段列表 —— ★ 支持中途换酒店（09 文档 I1）：每天归属一个住宿段，
   *   前几天住城中心、后几天住熊猫基地附近，是真实需求，不是边缘 case。
   *   住宿点 = 「他在哪过夜」，是隐私：只存 localStorage，不上传、不进 URL；
   *   分享链接默认脱敏（见 plan-share）。
   * source（4.1.1 三路输入）：poi = 从 POI 里选 / geocoded = 关键词搜索定位 /
   *   picked = 地图点选。地图挂掉时 picked 必须能降级到 geocoded。
   */
  var STAYS = [
    {
      id: 'stay-1', name: '春熙路某酒店', source: 'geocoded',
      address: '锦江区中纱帽街 8 号', lng: 104.0817, lat: 30.6570,
      fromDay: 1, toDay: 2
    },
    {
      /* 第 3 天换到城北 —— 这一天专攻熊猫基地与东郊，住城北能省下往返 40 分钟 */
      id: 'stay-2', name: '熊猫基地附近民宿', source: 'picked',
      address: '成华区熊猫大道 · 地图点选', lng: 104.1500, lat: 30.7400,
      fromDay: 3, toDay: 3
    }
  ];

  /** 按天取住宿段 —— 换酒店后同一份时间链代码不用改，取的 stay 自动跟着变 */
  function stayOf(day) {
    for (var i = 0; i < STAYS.length; i++) if (STAYS[i].id === day.stayId) return STAYS[i];
    return STAYS[0];
  }

  /** 三天行程示例 —— ★ items 的顺序完全由用户决定，系统不重排（不做 TSP / 2-opt） */
  var PLAN_DAYS = [
    { day: 1, stayId: 'stay-1', startTime: '09:00', items: [
      { uid: 'd1-1', poiId: 'kuanzhai-alley', dwell: 90, modeToNext: 'driving' },
      { uid: 'd1-2', poiId: 'peoples-park',   dwell: 60, modeToNext: 'walking' },
      { uid: 'd1-3', poiId: 'gaiwan-tea',     dwell: 45, modeToNext: 'walking' },
      { uid: 'd1-4', poiId: 'xiaolongkan',    dwell: 75, modeToNext: 'driving' },
      { uid: 'd1-5', poiId: 'taikooli',       dwell: 60, modeToNext: 'walking' }
    ]},
    { day: 2, stayId: 'stay-1', startTime: '08:30', items: [
      { uid: 'd2-1', poiId: 'panda-base',   dwell: 180, modeToNext: 'driving' },
      { uid: 'd2-2', poiId: 'wuhou-shrine', dwell: 120, modeToNext: 'driving' },
      { uid: 'd2-3', poiId: 'jinli',        dwell: 90,  modeToNext: 'walking' },
      { uid: 'd2-4', poiId: 'jiuyanqiao',   dwell: 75,  modeToNext: 'driving' }
    ]},
    { day: 3, stayId: 'stay-2', startTime: '09:00', items: [
      { uid: 'd3-1', poiId: 'dongjiao-memory', dwell: 60, modeToNext: 'walking' },
      { uid: 'd3-2', poiId: 'jianshe-alley',   dwell: 45, modeToNext: 'driving' },
      { uid: 'd3-3', poiId: 'qinglong-lake',   dwell: 75, modeToNext: 'driving' },
      { uid: 'd3-4', poiId: 'wenshu-monastery',dwell: 60, modeToNext: 'driving' }
    ]}
  ];

  /**
   * 六种出行方式 —— ★ 用户看到六种，但预计算矩阵只有 driving/walking/bicycling 三条通道。
   *   · 打车 taxi      复用 driving 的时长，差别只在费用（matrix 不复存第二份）
   *   · 公交 / 地铁    无批量接口 + 时效性最强 → 运行时按需算，不进矩阵
   * maxKm 是 09 文档 3.2.5 的阈值裁剪：步行 3km / 骑行 8km 之外即「不适用」，
   * UI 要引导换方式，而不是显示一个「步行 7 小时」的噪音数字。
   */
  var MODE_META = [
    { key: 'driving',   label: '驾车', ico: 'driving',   detour: 1.35, speed: 26,  maxKm: Infinity, channel: 'driving' },
    { key: 'taxi',      label: '打车', ico: 'taxi',      detour: 1.35, speed: 26,  maxKm: Infinity, channel: 'driving', fare: true },
    { key: 'transit',   label: '公交', ico: 'transit',   detour: 1.45, speed: 18,  maxKm: Infinity, channel: null, live: true },
    { key: 'subway',    label: '地铁', ico: 'subway',    detour: 1.45, speed: 20,  maxKm: Infinity, channel: null, live: true },
    { key: 'bicycling', label: '骑行', ico: 'bicycling', detour: 1.25, speed: 14,  maxKm: 8,        channel: 'bicycling' },
    { key: 'walking',   label: '步行', ico: 'walking',   detour: 1.22, speed: 4.8, maxKm: 3,        channel: 'walking' }
  ];
  var MODE_BY_KEY = {};
  MODE_META.forEach(function (m) { MODE_BY_KEY[m.key] = m; });

  /** haversine 直线距离（米）—— 纯本地，零调用，构建期做阈值裁剪也用它 */
  function straightMeters(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  /** 通勤矩阵替身：给两个地点 + 方式，返回 { distance 米, duration 秒, na 是否不适用 } */
  function legEstimate(from, to, modeKey) {
    var m = MODE_BY_KEY[modeKey] || MODE_BY_KEY.driving;
    var straight = straightMeters(from, to);
    if (straight / 1000 > m.maxKm) {
      return { distance: Math.round(straight), duration: 0, na: true, mode: m };
    }
    var road = straight * m.detour;
    return {
      distance: Math.round(road),
      duration: Math.round(road / 1000 / m.speed * 3600),
      na: false, mode: m
    };
  }

  return {
    PHOTO: PHOTO, photo: photo,
    STAYS: STAYS, stayOf: stayOf, PLAN_DAYS: PLAN_DAYS,
    MODE_META: MODE_META, MODE_BY_KEY: MODE_BY_KEY,
    straightMeters: straightMeters, legEstimate: legEstimate,
    CATS: CATS, CAT_NAME: CAT_NAME, CAT_KEY: CAT_KEY,
    SUBTYPE_META: SUBTYPE_META, SUBTYPE_GROUPS: SUBTYPE_GROUPS, subOf: subOf,
    AUDIENCE: AUDIENCE, AUD_LABEL: AUD_LABEL, A11Y_LABEL: A11Y_LABEL,
    CITIES: CITIES, POIS: POIS,
    PROVINCES: PROVINCES, PROVINCE_BY_ID: PROVINCE_BY_ID,
    SICHUAN_CITIES: SICHUAN_CITIES, SCITY_BY_ID: SCITY_BY_ID,
    PROVINCE_COUNT: PROVINCE_COUNT, densityLevel: densityLevel,
    TOTAL_POIS: TOTAL_POIS,
    FETCHED_AT: FETCHED_AT
  };
})();
</script>
<script id="appLogic">
/* ==========================================================================
   应用层 —— 视图渲染 / 地图接入 / 交互
   ---------------------------------------------------------------------------
   设计纪律（对应 05 文档第 1.0 节四条硬规则）：
     · 地图层绝对定位铺满视口，是「页面本身」，不参与文档流
     · 所有 UI 都是浮层（position:absolute + 白底 + 圆角 + 投影）
     · 浮层「盖」在地图上，不是「挤」地图 → 开合浮层时地图不重算尺寸
     · 关掉任何浮层，地图仍是满的
   ========================================================================== */
(function () {
  'use strict';

  var D = window.HJ;
  var CATS = D.CATS;
  var SUBTYPE_META = D.SUBTYPE_META;
  var SUBTYPE_GROUPS = D.SUBTYPE_GROUPS;
  var AUD_LABEL = D.AUD_LABEL;
  var A11Y_LABEL = D.A11Y_LABEL;
  var CITY_BY_ID = {};
  D.CITIES.forEach(function (c) { CITY_BY_ID[c.id] = c; });
  var POI_BY_ID = {};
  D.POIS.forEach(function (p) { POI_BY_ID[p.id] = p; });
  var PROVINCE_BY_ID = D.PROVINCE_BY_ID;
  var SCITY_BY_ID = D.SCITY_BY_ID;
  /* 固定入口：四川 / 成都（本轮"先跑通链路"只填四川） */
  var SC_PROVINCE = '510000';
  var SC_CITY = '510100';

  /* ---------- 元素 ---------- */
  var vp = document.getElementById('vp');
  var scaler = document.getElementById('scaler');
  var elMap = document.getElementById('map');
  var elFb = document.getElementById('mapFallback');
  var elTopbar = document.getElementById('layerTopbar');
  var elPanel = document.getElementById('layerPanel');
  var elCtl = document.getElementById('layerControls');
  var elPreview = document.getElementById('layerPreview');
  var elLegend = document.getElementById('layerLegend');
  var elMobile = document.getElementById('layerMobile');
  var elToast = document.getElementById('toast');
  var elLightbox = document.getElementById('lightbox');
  var elLbImg = document.getElementById('lbImg');
  var elLbCap = document.getElementById('lbCap');
  var elGuides = document.getElementById('guides');

  /* ---------- 全局状态 ---------- */
  var SNAP = { peek: 236, half: 472, full: 743 };
  var S = {
    device: 'desktop',          // desktop | mobile
    route: 'home',              // home(全国) | province(省) | city(市) | detail(详情)
    provinceId: SC_PROVINCE,    // 当前省级单位 adcode
    cityId: 'chengdu',
    poiId: 'kuanzhai-alley',
    sub: 'all',                 // 细类二次过滤（'all' 或某个 subtype key）
    base: 'satellite',          // 用户期望的底图（桌面默认影像）
    baseLocked: false,
    effBase: null,              // 实际生效的底图
    autoDown: false,            // 是否被 zoom 自动降级
    cat: 'all',
    q: '',
    sort: 'hot',
    selectedId: null,
    hoveredId: null,
    sheet: 'half',
    guides: false,
    scale: 1,
    mapMode: 'pending',         // pending | real | fallback
    mapReady: false,
    userMoved: false,
    myPos: null,             // 用户授权定位后的本地坐标（不落库、不上传）
    lbIndex: 0,
    lbList: [],
    planDay: 1,                 // 行程：当前查看第几天
    openLeg: null,              // 行程：当前展开方案卡的那一段（DayItem.uid），null = 全部收起
    editDwell: null,            // 行程：正在就地改停留时长的那一项（uid）
    planOpts: {},               // 行程：每段选中的方案 A/B/C（uid → 'A'|'B'|'C'）
    hoverLeg: null,             // 行程：鼠标悬停的那一段 → 地图连线提亮 + 其余降到 40%
    degrade: 'none'             // 降级演示开关：none | quota | nostore | broken-link | single-opt | no-fare
  };

  /* 分端默认底图：桌面影像 / 移动矢量（08 文档 2.6） */
  function defaultBase() { return S.device === 'mobile' ? 'vector' : 'satellite'; }

  /* ======================================================================
     工具
     ====================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function catOf(key) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].key === key) return CATS[i];
    return CATS[0];
  }
  function visiblePois() {
    var list = D.POIS;
    if (S.cat !== 'all') list = list.filter(function (p) { return p.cat === S.cat; });
    if (S.sub !== 'all') list = list.filter(function (p) { return p.subtype === S.sub; });
    var q = S.q.trim().toLowerCase();
    if (q) {
      list = list.filter(function (p) {
        return (p.name + ' ' + p.tags.join(' ') + ' ' + p.subtypeName + ' ' + p.lead + ' ' + p.district)
          .toLowerCase().indexOf(q) > -1;
      });
    }
    if (S.sort === 'name') list = list.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    return list;
  }

  /* ======================================================================
     ★ 下钻辅助（省 / 市 / 计数 / 适游群体 / 细类图例）
     ====================================================================== */
  /* 计数徽标：null → 「待收录」灰虚线 + 破折号；**绝不显示 0**
     0 的含义是"收录了但确实没有"，与"还没收录"是两件事，不能混为一谈 */
  function cntHTML(n) {
    var l = D.densityLevel(n);
    if (l === 0) return '<span class="cnt cnt--none">—</span>';
    return '<span class="cnt cnt--d' + l + '">' + n + '</span>';
  }
  function cbodyOf(n, extra) {
    if (n == null) return '待收录' + (extra ? ' · ' + extra : '');
    return n + ' 个点位' + (extra ? ' · ' + extra : '');
  }
  /* 省行说明：已收录的列出市州，未收录的直接「待收录」 */
  function provMeta(p) {
    if (p.count == null) return '待收录 · 内容整理中';
    if (p.id === SC_PROVINCE) {
      var done = D.SICHUAN_CITIES.filter(function (c) { return c.count != null; }).length;
      return done + ' 市已收录 · ' + D.SICHUAN_CITIES.length + ' 个市州';
    }
    return p.count + ' 个点位';
  }
  /* 适游群体标签组（6 类 + 无障碍）；无数据不渲染 —— 不臆造 */
  function audHTML(p) {
    if (!p || !p.audience || !p.audience.length) return '';
    var h = p.audience.map(function (k) {
      return '<span class="aud">' + esc(AUD_LABEL[k] || k) + '</span>';
    }).join('');
    if (p.accessible) h += '<span class="aud aud--a11y">' + esc(A11Y_LABEL) + '</span>';
    return '<div class="audrow">' + h + '</div>';
  }
  /* 细类徽章：颜色由细类决定（不是大类）。这是"marker 色 = 细类色"在文字处的同源表达 */
  function subBadge(p) {
    return '<span class="badge" style="color:' + p.subColor +
      ';background:color-mix(in srgb,' + p.subColor + ' 11%,#fff)">' + esc(p.subtypeName) + '</span>';
  }
  /* 细类图例：12 色按大类分组；点某一项 = 二次过滤到该细类（再点取消） */
  function subLegendHTML(withCounts) {
    var groups = SUBTYPE_GROUPS.map(function (g) {
      return g.items.map(function (k) {
        var m = SUBTYPE_META[k];
        var n = D.POIS.filter(function (p) { return p.subtype === k; }).length;
        var pressed = S.sub === 'all' ? 'true' : String(S.sub === k);
        return '<button class="si" data-act="sub" data-sub="' + k + '" aria-pressed="' + pressed + '">' +
          '<i style="background:' + m.color + '"></i>' + esc(m.label) + (withCounts ? ' ' + n : '') + '</button>';
      }).join('');
    }).join('<span class="gp"></span>');
    return '<div class="sublegend" role="group" aria-label="细类图例（决定地图点位颜色）">' + groups + '</div>';
  }
  /* 面包屑：全国 / 四川 / 成都 —— 各级可点回上级 */
  function crumbHTML() {
    var p = PROVINCE_BY_ID[S.provinceId];
    var city = CITY_BY_ID[S.cityId];
    var h = '<nav class="crumb" aria-label="下钻路径">';
    if (S.route === 'home') {
      h += '<b>全国</b>';
    } else {
      h += '<button data-act="goto-home">全国</button>';
      if (S.route === 'province') {
        h += '<span class="sep">/</span><b>' + esc(p ? p.name.replace(/(省|市|自治区|壮族自治区|回族自治区|维吾尔自治区|特别行政区)$/, '') || p.name : '四川') + '</b>';
      } else {
        h += '<span class="sep">/</span><button data-act="goto-province"' +
          (S.provinceId !== SC_PROVINCE ? ' style="opacity:.55;cursor:default"' : '') + '>' +
          esc(p ? p.name.replace(/(省|自治区)$/, '') : '四川') + '</button>' +
          '<span class="sep">/</span><b>' + esc(city ? city.name : '') + '</b>';
      }
    }
    return h + '</nav>';
  }
  /* 距离（仅用于展示，不采集、不上传；红线 4） */
  function distTo(lng, lat, origin) {
    var o = origin || CITY_BY_ID[S.cityId];
    var dy = (lat - o.lat) * 111;
    var dx = (lng - o.lng) * 111 * Math.cos(o.lat * Math.PI / 180);
    return Math.sqrt(dx * dx + dy * dy);
  }
  function fmtDist(km) { return km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(1) + 'km'; }
  /* 列表行尾字段：有定位 → 距我多远；无定位 → 行政区（绝不用「距市中心」冒充「距我」） */
  function rowMeta(p) {
    if (S.myPos) return fmtDist(distTo(p.lng, p.lat, S.myPos));
    return p.district;
  }

  /* ★ 视野裁剪：默认视野只纳「市区半径 45km 内」的点位。
     郊县 / 山岳景区点位（都江堰、青城山、街子古镇、西岭雪山）仍留在图层里，
     把地图缩小即可看到，但不参与默认 fitBounds —— 否则 4 个离群点会把视野拉到 zoom ≈ 8，
     市区 40 多个点位挤成一个像素团，空间关系完全读不出来。 */
  var VIEW_RADIUS_KM = 45;
  function outlierCount() {
    return visiblePois().filter(function (p) { return distTo(p.lng, p.lat) > VIEW_RADIUS_KM; }).length;
  }
  function viewPois() {
    var list = visiblePois();
    var near = list.filter(function (p) { return distTo(p.lng, p.lat) <= VIEW_RADIUS_KM; });
    return near.length >= 3 ? near : list;
  }

  /* ======================================================================
     图标
     ====================================================================== */
  function ico(name, cls) {
    return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
           'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<use href="#i-' + name + '"/></svg>';
  }

  /* ======================================================================
     图片：三级降级（实景 → 氛围图 → 占位卡），绝不留破图
     ====================================================================== */
  function imgBox(key, w, h, cls, extra) {
    var src = D.photo(key, w, h);
    var fb = D.photo(key, Math.max(240, Math.round(w / 2)), Math.max(180, Math.round(h / 2)));
    return '<div class="imgbox ' + (cls || '') + '" data-state="loading">' +
           '<img src="' + esc(src) + '" data-fb="' + esc(fb) + '" loading="lazy" decoding="async" alt="' +
           esc((extra && extra.alt) || '') + '">' +
           (extra && extra.credit ? '<span class="credit">' + esc(extra.credit) + '</span>' : '') +
           '</div>';
  }
  vp.addEventListener('load', function (e) {
    if (e.target && e.target.tagName === 'IMG') {
      var box = e.target.closest('.imgbox');
      if (box) box.setAttribute('data-state', 'ready');
    }
  }, true);
  vp.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var box = img.closest('.imgbox');
    var fb = img.getAttribute('data-fb');
    if (fb && img.getAttribute('src') !== fb) {      // 第一次失败 → 换小尺寸重试
      img.setAttribute('src', fb);
      return;
    }
    if (box) box.setAttribute('data-state', 'broken'); // 二次失败 → 占位卡
    img.style.display = 'none';
  }, true);

  /* ======================================================================
     地图：真实 SDK（预览环境免 key 走官方代理）+ 降级示意画布
     ====================================================================== */
  /* markers = POI 细类 marker 层；labels = POI 名称标签层；regLabels = 省 / 市计数徽标层。
     旧版还有 cityMarkers（城市点层）与 cluster（聚合层），四级下钻改造后已无引用，
     一并删掉 —— 留着会让后来者误以为还存在「城市点」这一层。 */
  var MAP = null, markers = null, labels = null;
  var regLabels = null;          // ★ 省 / 市计数徽标层（MultiLabel：内容逐条不同，样式按密度分级）
  /* 行程规划页专用图层（09 文档 6.3）：
       routeLines  = 当天连线（MultiPolyline）
       seqMarkers  = 序号圆点 ①②③（MultiMarker，与 POI marker 分层，避免互相覆盖） */
  var routeLines = null, seqMarkers = null, congestLines = null;
  var REG_STYLES = {};
  var PIN_STYLES = {};

  function pinSVG(width, color, glow) {
    var tipY = 66, cx = 26, s = width / 34, h = 44 * s, r = width / 2;
    var cy = tipY - h + r;
    var halo = glow ? '<circle cx="' + cx + '" cy="' + cy.toFixed(1) + '" r="' + (r * 2.5).toFixed(1) +
                      '" fill="' + color + '" opacity="0.13"/>' : '';
    var g = '<g transform="translate(' + cx + ',' + tipY + ') scale(' + s.toFixed(3) + ') translate(-17,-43)">' +
            '<path d="M17 43C17 43 32 26.5 32 16A15 15 0 1 0 2 16C2 26.5 17 43 17 43Z" fill="' + color +
            '" stroke="#fff" stroke-width="' + (2.8 / s).toFixed(2) + '" stroke-linejoin="round"/>' +
            '<circle cx="17" cy="16" r="' + (5.2 / s).toFixed(2) + '" fill="#fff"/></g>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="52" height="66" viewBox="0 0 52 66">' + halo + g + '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function citySVG(active) {
    var c = active ? '#1677FF' : '#161A22', r = active ? 13 : 10;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">' +
      (active ? '<circle cx="22" cy="22" r="20" fill="' + c + '" opacity="0.16"/>' : '') +
      '<circle cx="22" cy="22" r="' + r + '" fill="' + c + '" stroke="#fff" stroke-width="3.2"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function setMapState(txt) { document.getElementById('cMapState').textContent = txt; }

  function loadSDK() {
    return new Promise(function (resolve) {
      if (!window.__TRAVEL_MAP_IN_WB__) return resolve(false);
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(!!window.TMap); } }, 9000);
      var s = document.createElement('script');
      s.src = 'https://map.qq.com/api/gljs?v=1.exp';
      s.onload = function () { if (!done) { done = true; clearTimeout(t); resolve(!!window.TMap); } };
      s.onerror = function () { if (!done) { done = true; clearTimeout(t); resolve(false); } };
      document.head.appendChild(s);
    });
  }

  function initMap() {
    setMapState('地图：加载中…');
    loadSDK().then(function (ok) {
      if (!ok || !window.TMap) { useFallback('地图服务未就绪'); return; }
      try {
        MAP = new TMap.Map(elMap, {
          center: new TMap.LatLng(30.5723, 104.0665),
          zoom: 5,
          minZoom: 3, maxZoom: 20,
          pitch: 0, rotation: 0,
          viewMode: '2D',
          showControl: false,
          baseMap: { type: 'vector', features: ['base', 'road', 'building'] }
        });
        buildLayers();
        S.mapMode = 'real';
        S.mapReady = true;
        setMapState('地图：腾讯 GL JS 已接入');
        applyBase(defaultBase(), false);
        fitToRoute(true);

        MAP.on('zoom', onMapZoom);
        MAP.on('click', function () { if (S.mapMode === 'real') deselect(); });
        MAP.on('dragend', function () {
          if (!S.userMoved) { S.userMoved = true; renderControls(); }
        });
        elMap.style.cursor = 'grab';
        render();
      } catch (err) {
        useFallback('地图初始化失败：' + (err && err.message ? err.message : err));
      }
    });
  }

  function buildLayers() {
    /* ★ marker 样式：12 细类 × 常态/选中 —— marker 颜色由细类决定，不是大类 */
    Object.keys(SUBTYPE_META).forEach(function (k) {
      var col = SUBTYPE_META[k].color;
      PIN_STYLES['sub-' + k] = new TMap.MarkerStyle({ width: 52, height: 66, anchor: { x: 0.5, y: 1 }, src: pinSVG(34, col, false) });
      PIN_STYLES['sub-' + k + 'A'] = new TMap.MarkerStyle({ width: 52, height: 66, anchor: { x: 0.5, y: 1 }, src: pinSVG(46, col, true) });
    });
    PIN_STYLES.city = new TMap.MarkerStyle({ width: 44, height: 44, anchor: { x: 0.5, y: 0.5 }, src: citySVG(false) });
    PIN_STYLES.cityA = new TMap.MarkerStyle({ width: 44, height: 44, anchor: { x: 0.5, y: 0.5 }, src: citySVG(true) });

    /* ★ 行程页：序号圆点 ①–⑨ + 住宿点旗标（住宿点是行程的锚，形状刻意与 POI 水滴针区分） */
    function seqSVG(n) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">' +
        '<circle cx="15" cy="15" r="12.5" fill="#161A22" stroke="#FFFFFF" stroke-width="2.5"/>' +
        '<text x="15" y="15.5" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" ' +
        'font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">' + n + '</text></svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    function staySVG() {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="52" viewBox="0 0 40 52">' +
        '<path d="M20 50C20 50 34 30 34 19A14 14 0 1 0 6 19C6 30 20 50 20 50Z" fill="#E8672F" ' +
        'stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M13.5 17.5h13v10h-13z" fill="#FFFFFF"/>' +
        '<path d="M20 12.5l6.5 5h-13z" fill="#FFFFFF"/></svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    for (var si = 1; si <= 9; si++) {
      PIN_STYLES['seq' + si] = new TMap.MarkerStyle({
        width: 30, height: 30, anchor: { x: 0.5, y: 0.5 }, src: seqSVG(si)
      });
    }
    PIN_STYLES.stay = new TMap.MarkerStyle({
      width: 40, height: 52, anchor: { x: 0.5, y: 1 }, src: staySVG()
    });

    /* ★ 省 / 市计数徽标样式：底色 = 收录密度（0 未收录 / 1 → 1–19 / 2 → 20–49 / 3 → 50+），各带选中态。
       用 LabelStyle 而不是 MarkerStyle，因为徽标内容（「四川 46」）逐条不同，
       只有 MultiLabel 能按 geometry.content 动态渲染文字。 */
    function regStyle(bg, color, border, bw) {
      return new TMap.LabelStyle({
        color: color, size: 11.5, offset: { x: 0, y: 0 }, alignment: 'center',
        backgroundColor: bg, backgroundPadding: 6,
        borderColor: border, borderWidth: bw,
        fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
      });
    }
    REG_STYLES = {
      reg0:  regStyle('rgba(255,255,255,.90)', '#8B95A1', '#C3CCD8', 1),
      reg0A: regStyle('rgba(255,255,255,.97)', '#0B2B57', '#1677FF', 2),
      reg1:  regStyle('#D6E4F7', '#0B2B57', '#FFFFFF', 1),
      reg1A: regStyle('#D6E4F7', '#0B2B57', '#1677FF', 2),
      reg2:  regStyle('#A9C7F0', '#0B2B57', '#FFFFFF', 1),
      reg2A: regStyle('#A9C7F0', '#0B2B57', '#1677FF', 2),
      reg3:  regStyle('#6E9FE0', '#FFFFFF', '#FFFFFF', 1),
      reg3A: regStyle('#6E9FE0', '#FFFFFF', '#1677FF', 2)
    };

    try {
      markers = new TMap.MultiMarker({ map: MAP, styles: PIN_STYLES, geometries: [] });
      markers.on('click', function (evt) {
        var id = evt && evt.geometry ? evt.geometry.id : null;
        if (id) selectPoi(id, true);
      });
    } catch (e) { markers = null; }

    /* 下钻徽标层：同一图层复用，靠 route 分流（全国层点省进省，省层点市进市） */
    try {
      regLabels = new TMap.MultiLabel({ map: MAP, styles: REG_STYLES, geometries: [] });
      regLabels.on('click', function (evt) {
        var g = evt && evt.geometry;
        if (!g || !g.id) return;
        if (S.route === 'home') gotoProvince(g.id);
        else if (S.route === 'province') gotoCityByAdcode(g.id);
      });
    } catch (e) { regLabels = null; }

    /* ★ 行程连线层：预计算矩阵只存距离与时长、**不存路径点**（否则体积暴涨），
       所以静态命中画的是「直连」并必须标注「直线示意」；只有运行时真调了路线规划
       才画真实折线。这是 09 文档 6.1 的既定取舍，不是画得糙。

       ★ 每段一条 geometry（关键改动）：以前整条一天画成一根 path，导致
         6.3 的四条联动（hover 提亮 / 点段收窄 / 拥堵描色 / 换方式换线型）全部无从下手。
         样式按「方式（实/虚）× 聚焦态（提亮/常态/降透明度）」组合，共 6 个：
           leg / legWalk          常态：驾车类实线、步行虚线
           legOn / legWalkOn      聚焦：加粗并转主色
           legDim / legWalkDim    有聚焦但非本段：降到 40%
         dashArray 是腾讯 PolylineStyle 的官方参数（[0,0] 为实线）。 */
    try {
      function mkLine(color, width, dash) {
        return new TMap.PolylineStyle({
          color: color, width: width, borderWidth: 1.6, borderColor: '#FFFFFF',
          lineCap: 'round', dashArray: dash
        });
      }
      routeLines = new TMap.MultiPolyline({
        map: MAP,
        styles: {
          leg:        mkLine('#161A22', 4,   [0, 0]),
          legWalk:    mkLine('#161A22', 3.5, [8, 6]),
          legOn:      mkLine('#1677FF', 5.5, [0, 0]),
          legWalkOn:  mkLine('#1677FF', 5,   [8, 6]),
          legDim:     mkLine('rgba(22,26,34,0.4)', 4,   [0, 0]),
          legWalkDim: mkLine('rgba(22,26,34,0.4)', 3.5, [8, 6])
        },
        geometries: []
      });
    } catch (e) { routeLines = null; }

    /* ★ 拥堵子段层：叠在基准线之上画细红线（6.3.1 —— 同一条路线画两条线）。
       不给整条线换色，是因为那样看不出「堵的是哪一段」。
       ⚠️ 刻意不做「蚂蚁线」流光：那是导航 App 的语言，会让人误以为是实时导航，
       而我们给的是「查询时刻的快照」（09 文档 6.3.1 注）。 */
    try {
      congestLines = new TMap.MultiPolyline({
        map: MAP,
        styles: {
          jam: new TMap.PolylineStyle({ color: '#F5222D', width: 6, borderWidth: 0, lineCap: 'butt', dashArray: [0, 0] }),
          slow: new TMap.PolylineStyle({ color: '#FA8C16', width: 6, borderWidth: 0, lineCap: 'butt', dashArray: [0, 0] })
        },
        geometries: []
      });
    } catch (e) { congestLines = null; }

    /* 序号层：与 POI marker 分成两层，避免序号圆点被点位针盖住 */
    try {
      seqMarkers = new TMap.MultiMarker({ map: MAP, styles: PIN_STYLES, geometries: [] });
    } catch (e) { seqMarkers = null; }

    /* POI 名称标签层（城市视图按细类色显示名称） */
    try {
      labels = new TMap.MultiLabel({
        map: MAP,
        styles: {
          poi: new TMap.LabelStyle({
            color: '#161A22', size: 11, offset: { x: 0, y: -44 }, alignment: 'center',
            backgroundColor: 'rgba(255,255,255,0.93)', backgroundPadding: 5,
            borderColor: 'rgba(16,24,40,0.08)', borderWidth: 1,
            fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
          })
        },
        geometries: []
      });
    } catch (e) { labels = null; }
  }

  function onMapZoom() {
    if (!MAP || S.mapMode !== 'real' || !S.mapReady) return;
    var z = MAP.getZoom();
    if (S.base !== 'satellite') return;
    if (S.baseLocked) { renderLegend(); return; }
    if (!S.autoDown && z >= 15.5) {           // 触发降级
      S.autoDown = true;
      applyBase('vector', false);
      showToast('放大到 zoom ' + z.toFixed(1) + '，影像底图已自动切换为矢量（路名与门牌更清晰）', '不再提示', function () { S.baseLocked = true; renderAll(); });
    } else if (S.autoDown && z < 15.0) {      // 0.5 迟滞区，回退
      S.autoDown = false;
      applyBase('satellite', false);
    }
    renderLegend();
    renderControlsState();
  }

  function applyBase(type, notify) {
    S.effBase = type;
    if (MAP && S.mapMode === 'real') {
      try {
        MAP.setBaseMap(type === 'satellite'
          ? { type: 'satellite', features: ['base', 'road'] }   // 卫星必须带 road，否则没有参照物
          : { type: 'vector', features: ['base', 'road', 'building'] });
      } catch (e) { /* 忽略：底图切换失败不影响浮层 */ }
    }
    /* 矢量底图为浅色，移动端状态栏需换成深色文字 */
    vp.classList.toggle('light-status', type === 'vector');
    renderLegend(); renderBasemapUI(); renderControlsState();
    if (notify) showToast('底图已切换为' + (type === 'satellite' ? '影像' : '矢量'));
  }

  /* ---------- 降级示意画布（不绘制任何行政区界，合规） ---------- */

  /* 实测当前各浮层的实际占位，算出「未被遮挡」的地图可视矩形（vp 布局坐标）。
     返回 rect 直接对应真实地图 fitBounds 的 padding 语义：内容应放进这块空区，
     而不是在整屏里居中。好处是面板宽度 / 预览卡出现 / Sheet 换档都会自动生效，
     不必维护一组手调的 bias 系数（旧实现即因此反复失准）。 */
  function freeRect() {
    var W = vp.clientWidth, H = vp.clientHeight;
    /* 关键：必须用「实际渲染缩放」而不是 S.scale —— .scaler 上有 transform 过渡，
       刚设置完 transform 的那一帧 getBoundingClientRect 拿到的仍是旧值，两者会不同步。 */
    var sc = vp.getBoundingClientRect().width / (vp.offsetWidth || 1) || 1;
    var vr = vp.getBoundingClientRect();
    var sel = S.device === 'mobile'
      ? ['#layerMobile > .m-top', '#layerMobile > .m-segwrap', '#sheetMount > .sheet']
      : ['#layerTopbar > *', '#layerPanel > *', '.ctlwrap', '#layerPreview > *', '#layerLegend > *'];

    var boxes = [];
    sel.forEach(function (q) {
      [].slice.call(vp.querySelectorAll(q)).forEach(function (n) {
        var st = getComputedStyle(n);
        /* 只按 display/visibility 判定可见性：入场动画从 opacity:0 起步，
           若把 opacity 也算进去，同一帧里渲染出来的预览卡会被误判为不可见而漏掉。 */
        if (st.display === 'none' || st.visibility === 'hidden') return;
        var b = n.getBoundingClientRect();
        if (b.width < 2 || b.height < 2) return;
        boxes.push({
          x0: (b.left - vr.left) / sc, y0: (b.top - vr.top) / sc,
          x1: (b.right - vr.left) / sc, y1: (b.bottom - vr.top) / sc
        });
      });
    });

    var r = { x0: 16, y0: 16, x1: W - 16, y1: H - 16 };
    boxes.forEach(function (b) {
      var w = b.x1 - b.x0, h = b.y1 - b.y0;
      var wide = w > W * 0.5, tall = h > H * 0.5;
      if (wide && !tall) {                       // 横向条：顶栏 / 图例条 → 吃上沿或下沿
        if (b.y0 < H * 0.5) { if (b.y1 > r.y0) r.y0 = b.y1; }
        else if (b.y0 < r.y1) r.y1 = b.y0;
      } else if (tall && !wide) {                // 纵向条：左面板 / 详情抽屉 → 吃左沿或右沿
        if (b.x0 < W * 0.5) { if (b.x1 > r.x0) r.x0 = b.x1; }
        else if (b.x0 < r.x1) r.x1 = b.x0;
      } else if (wide && tall) {                 // 大块：底部 Sheet → 按所贴的半屏收一条边
        if (b.y0 > H * 0.4) { if (b.y0 < r.y1) r.y1 = b.y0; }
        else if (b.y1 < H * 0.6) { if (b.y1 > r.y0) r.y0 = b.y1; }
      } else {                                   // 小块：只收它真正贴住的那条边，避免误伤另一轴
        if (b.x1 < W * 0.35) { if (b.x1 > r.x0) r.x0 = b.x1; }
        else if (b.x0 > W * 0.65) { if (b.x0 < r.x1) r.x1 = b.x0; }
        if (w > W * 0.25) {                      // 只有横向够宽的小条才允许影响纵向可取范围
          if (b.y1 < H * 0.35) { if (b.y1 > r.y0) r.y0 = b.y1; }
          else if (b.y0 > H * 0.65) { if (b.y0 < r.y1) r.y1 = b.y0; }
        }
      }
    });

    r.x0 += 12; r.x1 -= 12; r.y0 += 12; r.y1 -= 12;

    /* 数据标签（.fb-lab）悬在圆点上方约 22px，顶部要多留一段，否则最上面一排标签会顶进顶栏 */
    r.y0 += 28;

    /* 移动端署名/提示 pill 挂在 Sheet 上沿，内容必须停在它上面（贴顶改位时它不在下方，忽略） */
    var fl = vp.querySelector('#layerMobile > .m-float');
    if (fl) {
      var ft = (fl.getBoundingClientRect().top - vr.top) / sc;
      if (ft > H * 0.5 && ft - 8 < r.y1) r.y1 = ft - 8;
    }

    /* 退化保护：浮层把地图挤没了就退回整屏，至少保证点位可见 */
    if (r.x1 - r.x0 < 160 || r.y1 - r.y0 < 120) return { x0: 16, y0: 16, x1: W - 16, y1: H - 16 };
    return r;
  }

  /* 把点位集合铺满可用空区，反推视野 —— 等价于真实地图的 fitBounds + padding。
     K = px/度经度，同时受「宽度铺满」与「高度铺满」两条约束，取更紧的一条。 */
  function fitToRect(pts, rect, W, H) {
    var minLng = 1e9, maxLng = -1e9, minLat = 1e9, maxLat = -1e9;
    (pts || []).forEach(function (p) {
      if (p.lng < minLng) minLng = p.lng;
      if (p.lng > maxLng) maxLng = p.lng;
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
    });
    var cLng = 104.6, cLat = 33.5, dx = 0, dy = 0;
    if (isFinite(minLng)) {
      cLng = (minLng + maxLng) / 2; cLat = (minLat + maxLat) / 2;
      dx = maxLng - minLng; dy = maxLat - minLat;
    }
    var cos = Math.cos(cLat * Math.PI / 180);
    var rw = Math.max(120, rect.x1 - rect.x0), rh = Math.max(100, rect.y1 - rect.y0);
    var K = Math.min(dx > 5e-4 ? rw / dx : 1e9, dy > 5e-4 ? rh * cos / dy : 1e9);
    if (!isFinite(K)) K = 4e5;
    K = Math.min(K, 4e5);                       // 单点或极近时的放大上限
    var tx = (rect.x0 + rect.x1) / 2, ty = (rect.y0 + rect.y1) / 2;
    return {
      lng: cLng - (tx - W / 2) / K,
      lat: cLat + (ty - H / 2) / (K / cos),
      span: W / K
    };
  }

  /* 腾讯 GL 的 zoom ↔ 视口经度跨度换算：1px = 156543.03392·cosφ / 2^z 米（cosφ 约掉后只剩常数） */
  function spanForZoom(z, W) { return W * 1.40625 / Math.pow(2, z); }

  /* 要让某个坐标落在「可用空区」中心，地图中心该放在哪 —— 等价于给 easeTo 加偏移量。
     降级画布与真实地图共用这一套换算，两边视野才会一致。 */
  function centerForPoint(lng, lat, rect, W, H, span) {
    var K = W / span, cos = Math.cos(lat * Math.PI / 180);
    return {
      lng: lng - ((rect.x0 + rect.x1) / 2 - W / 2) / K,
      lat: lat + ((rect.y0 + rect.y1) / 2 - H / 2) / (K / cos)
    };
  }

  /* 降级画布的点聚合（网格法）：避免密集点位互相覆盖，对应 08 文档「移动端必开点聚合」 */
  function clusterPts(list, view, W, H, cell) {
    var grid = {}, out = [];
    list.forEach(function (p) {
      var pt = projectPoint(p.lng, p.lat, view, W, H);
      if (pt.x < -40 || pt.x > W + 40 || pt.y < -40 || pt.y > H + 40) return;
      var k = Math.floor(pt.x / cell) + ':' + Math.floor(pt.y / cell);
      var g = grid[k] || (grid[k] = { x: 0, y: 0, items: [], subs: {}, cols: {} });
      g.x += pt.x; g.y += pt.y;
      g.items.push(p);
      /* 按「细类」统计：marker 颜色由细类决定（12 色），气泡取占比最高的细类色。
         大类只用于筛选，不用来决定颜色 —— 与真实地图的 marker 着色规则保持一致 */
      var sk = p.subtype || p.cat;
      if (sk) { g.subs[sk] = (g.subs[sk] || 0) + 1; if (p.subColor) g.cols[sk] = p.subColor; }
    });
    Object.keys(grid).forEach(function (k) {
      var g = grid[k];
      g.x /= g.items.length; g.y /= g.items.length;
      var best = null, bn = -1;
      Object.keys(g.subs).forEach(function (s) { if (g.subs[s] > bn) { bn = g.subs[s]; best = s; } });
      g.sub = best;
      g.subColor = g.cols[best] || null;
      out.push(g);
    });
    return out;
  }

  function useFallback(reason) {
    S.mapMode = 'fallback';
    S.mapReady = false;
    S.effBase = null;
    elFb.classList.add('is-on');
    setMapState('地图：' + reason + ' → 示意画布');
    VPUpdateClasses();
    render();
  }
  function VPUpdateClasses() {
    /* 只同步「真的有 CSS 规则消费」的类。
       原先这里还 toggle 过 fallback-on，但全文件没有任何 .fallback-on 规则 ——
       一个只写不读的类会让人误以为存在降级态的样式钩子，删掉。
       降级态的视觉全部由 #mapFallback.is-on 与图例里的「示意画布」标签承担。 */
    vp.classList.toggle('has-detail', S.device === 'desktop' && S.route === 'detail');
  }

  function projectPoint(lng, lat, view, W, H) {
    var K = W / view.span;                                  // px / 度经度
    var Klat = K / Math.cos(view.lat * Math.PI / 180);      // px / 度纬度
    return {
      x: W / 2 + (lng - view.lng) * K,
      y: H / 2 - (lat - view.lat) * Klat
    };
  }

  function renderFallback() {
    if (S.mapMode !== 'fallback') { elFb.innerHTML = ''; return; }
    var W = vp.clientWidth, H = vp.clientHeight;
    var me = POI_BY_ID[S.poiId];

    /* 先确定本屏要展示的点位集合，再由集合反推视野（对齐真实地图的 fitBounds 行为） */
    var pts, isRegion = (S.route === 'home' || S.route === 'province');
    if (S.route === 'home') {
      pts = D.PROVINCES.map(function (p) { return { lng: p.lng, lat: p.lat }; });
    } else if (S.route === 'province') {
      pts = D.SICHUAN_CITIES.map(function (c) { return { lng: c.lng, lat: c.lat }; });
    } else if (S.route === 'city') {
      pts = viewPois();
    } else if (S.route === 'plan') {
      /* 行程层：★ 住宿点必须参与 fitBounds，否则一进页面就看不见「我从哪出发」。
         取的是**当天所属**住宿段 —— 中途换酒店后视野跟着换锚点。
         S.fitLeg 时只框该段两端点（点一段 = 想看清这一段，见 09 文档 6.3） */
      if (S.fitLeg) {
        var lg0 = legByKey(S.fitLeg);
        if (lg0 && lg0.from && lg0.to) {
          pts = [{ lng: lg0.from.lng, lat: lg0.from.lat }, { lng: lg0.to.lng, lat: lg0.to.lat }];
        }
      }
      if (!pts) {
        var pDay0 = planDay(), planPts = pDay0.items.map(placeOf).filter(Boolean);
        var st0 = D.stayOf(pDay0);
        pts = [{ lng: st0.lng, lat: st0.lat }].concat(planPts);
      }
    } else {
      pts = (me ? [me] : []).concat(D.POIS.filter(function (p) {
        return me && p.id !== me.id && distTo(p.lng, p.lat) < 3.2;
      }).slice(0, 8));
    }
    var isM = S.device === 'mobile';
    /* 视野：把点位铺进「未被浮层遮挡」的空区（对齐真实地图 fitBounds + padding）。
       详情页额外把主点位钉在空区中心，并对齐真实地图的 zoom 15.2，
       保证降级画布与真实地图的「看周边」上下文一致。 */
    var rect = freeRect();
    var view;
    if (S.route === 'detail' && me) {
      var span = spanForZoom(15.2, W);
      view = centerForPoint(me.lng, me.lat, rect, W, H, span);
      view.span = span;
    } else {
      view = fitToRect(pts, rect, W, H);
    }

    /* 背景：陆地基色 + 经纬网；城市 / 详情视图另加河流与环线（纯示意，不含任何行政区界） */
    var bg;
    if (isRegion) {
      bg = '<defs><pattern id="grid" width="110" height="110" patternUnits="userSpaceOnUse">' +
           '<path d="M110 0H0V110" fill="none" stroke="#DCE2E9" stroke-width="1"/></pattern></defs>' +
           '<rect width="100%" height="100%" fill="var(--fb-land)"/>' +
           '<rect width="100%" height="100%" fill="url(#grid)"/>';
    } else {
      var c = projectPoint(view.lng, view.lat, view, W, H);
      bg = '<rect width="100%" height="100%" fill="var(--fb-land)"/>' +
        '<ellipse cx="' + (c.x - W * 0.3) + '" cy="' + (c.y - H * 0.28) + '" rx="' + W * 0.16 + '" ry="' + H * 0.11 + '" fill="var(--fb-green)"/>' +
        '<ellipse cx="' + (c.x + W * 0.32) + '" cy="' + (c.y + H * 0.3) + '" rx="' + W * 0.14 + '" ry="' + H * 0.1 + '" fill="var(--fb-green)"/>' +
        '<ellipse cx="' + (c.x - W * 0.34) + '" cy="' + (c.y + H * 0.24) + '" rx="' + W * 0.1 + '" ry="' + H * 0.08 + '" fill="var(--fb-green)"/>' +
        '<path d="M' + (W * 0.08) + ',' + (H * 1.05) + ' C' + (W * 0.3) + ',' + (H * 0.76) + ' ' + (W * 0.44) + ',' + (H * 0.64) + ' ' + (W * 0.62) + ',' + (H * 0.48) + ' S' + (W * 0.88) + ',' + (H * 0.24) + ' ' + (W * 1.05) + ',' + (H * 0.08) + '" stroke="var(--fb-water)" stroke-width="' + (W * 0.012) + '" fill="none" stroke-linecap="round"/>' +
        '<g fill="none" stroke-linecap="round">' +
        '<circle cx="' + c.x + '" cy="' + c.y + '" r="' + W * 0.09 + '" stroke="var(--fb-road)" stroke-width="' + (W * 0.006) + '"/>' +
        '<circle cx="' + c.x + '" cy="' + c.y + '" r="' + W * 0.2 + '" stroke="var(--fb-road)" stroke-width="' + (W * 0.007) + '"/>' +
        '<circle cx="' + c.x + '" cy="' + c.y + '" r="' + W * 0.33 + '" stroke="var(--fb-road)" stroke-width="' + (W * 0.008) + '"/>' +
        '<path d="M' + (c.x - W) + ',' + c.y + 'H' + (c.x + W) + 'M' + c.x + ',' + (c.y - H) + 'V' + (c.y + H) + '" stroke="var(--fb-road)" stroke-width="' + (W * 0.005) + '"/>' +
        '<path d="M' + (c.x - W) + ',' + (c.y + H * 0.62) + 'L' + (c.x + W) + ',' + (c.y - H * 0.62) + '" stroke="var(--fb-road-2)" stroke-width="' + (W * 0.004) + '"/>' +
        '</g>';
    }

    /* ★ 行程连线：画在背景 svg 里（对应真实地图的 MultiPolyline）。
       用虚线是因为预计算矩阵**不存路径点**（只存距离与时长），静态命中只能直连 ——
       这是 09 文档 6.1 的既定取舍，UI 上也必须标注「直线示意」，不能假装是真实路线。 */
    if (S.route === 'plan') {
      /* ★ 逐段画线，而不是画一整条 —— 段是行程的一等公民：
           hover 某段要提亮、其余降到 40%；步行段要画虚线；拥堵子段要在上层叠一条橙/红线。
           这三个语义在一整条 path 上统统做不到，这也是这版重写的唯一理由。
         诚实标注：所有段都是「直线示意」（矩阵只存距离与时长、不存路径点），
           统一由图例声明，不逐段打标签 —— 否则图上全是字，反而看不见线。 */
      var fbTl = buildTimeline(planDay()), fbHot = focusLegIndex(fbTl);
      fbTl.legs.forEach(function (lg, li) {
        if (!lg.from || !lg.to) return;
        var hot = fbHot === li, dim = fbHot >= 0 && !hot;
        var walk = lg.modeKey === 'walking';
        var a = projectPoint(lg.from.lng, lg.from.lat, view, W, H);
        var b = projectPoint(lg.to.lng, lg.to.lat, view, W, H);
        /* class 供自检探针统计「当天画了几段线」——没有类名就只能数 <path>，
           而背景里还有道路弧线，数出来是错的 */
        bg += '<path class="fb-leg' + (hot ? ' is-hot' : dim ? ' is-dim' : '') +
          '" d="M' + a.x.toFixed(1) + ',' + a.y.toFixed(1) +
          'L' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + '" fill="none" stroke="' +
          (hot ? '#1677FF' : '#161A22') + '" stroke-width="' + (hot ? 4.5 : 3) + '"' +
          (walk ? ' stroke-dasharray="7 6"' : '') +
          ' stroke-linecap="round" opacity="' + (dim ? '.4' : '.85') + '"/>';
        /* 拥堵子段：★ 只有「点开过这一段」（拉了多方案 + get_speed）才有路况数据，
           所以拥堵描色只出现在展开方案卡的那一段 —— 没拉过就画，是在编造路况。
           抖动的子段位置是**示意**（无真实 polyline），看图例注明的「拥堵为示意」。 */
        if (hot && fbHot === li && S.openLeg) {
          var c1 = projectPoint(lerpPt(lg.from, lg.to, .42).lng, lerpPt(lg.from, lg.to, .42).lat, view, W, H);
          var c2 = projectPoint(lerpPt(lg.from, lg.to, .70).lng, lerpPt(lg.from, lg.to, .70).lat, view, W, H);
          bg += '<path class="fb-leg-jam" d="M' + c1.x.toFixed(1) + ',' + c1.y.toFixed(1) +
            'L' + c2.x.toFixed(1) + ',' + c2.y.toFixed(1) + '" fill="none" stroke="#F5222D" ' +
            'stroke-width="5.5" stroke-linecap="round" opacity=".9"/>';
        }
      });
    }

    /* 点位 + 点聚合 */
    var pins = '';
    if (isRegion) {
      /* 全国 / 省级层：只打「名称 + 收录数」计数徽标 —— **不画任何行政边界**（合规红线：
         行政边界只能来自腾讯区划服务，禁止第三方 GeoJSON）。未收录 = 灰底虚线 + 破折号（null ≠ 0）

         ★ 移动端低 zoom 只画「有数据」的区划：390px 宽的屏上，34 个省徽标会互相压成一团
         （依据 plans/10-map-drilldown.md「计数徽标」一行：全部显示 / 低 zoom 只显示有数据的区划）。
         未收录的区划不丢信息 —— 它们仍完整列在底部 Sheet 的区划列表里。 */
      var regItems = S.route === 'home' ? D.PROVINCES : D.SICHUAN_CITIES;
      if (isM) regItems = regItems.filter(function (it) { return it.count != null; });
      regItems.forEach(function (it) {
        var q = projectPoint(it.lng, it.lat, view, W, H);
        var lv = D.densityLevel(it.count);
        var on = S.route === 'home' ? (it.id === S.provinceId) : (it.id === SC_CITY);
        var cls = 'fb-badge' + (lv === 0 ? ' is-pending' : '') + (on && it.count != null ? ' is-active' : '');
        pins += '<div class="' + cls + '" style="left:' + q.x.toFixed(1) + 'px;top:' + q.y.toFixed(1) + 'px">' +
          '<b>' + esc(shortName(it.name)) + '</b>' +
          '<span class="fb-cnt' + (it.count == null ? ' is-none' : '') + '">' + (it.count == null ? '—' : it.count) + '</span>' +
          '</div>';
      });
    } else if (S.route === 'plan') {
      /* 行程层：住宿旗标（行程的锚）+ 序号点位。
         ★ 住宿点形状刻意与点位不同（方旗 vs 圆点），一眼能分出「起点」与「途经点」 */
      var fStay = D.stayOf(planDay());
      var sq = projectPoint(fStay.lng, fStay.lat, view, W, H);
      pins += '<div class="fb-stayflag" style="left:' + sq.x.toFixed(1) + 'px;top:' + sq.y.toFixed(1) + 'px">' +
        '<b>' + esc(fStay.name) + '</b><i></i></div>';
      var flagPts = planDay().items.map(placeOf).filter(Boolean);
      flagPts.forEach(function (p, i) {
        var q = projectPoint(p.lng, p.lat, view, W, H);
        pins += '<div class="fb-seq" style="left:' + q.x.toFixed(1) + 'px;top:' + q.y.toFixed(1) + 'px">' +
          '<span class="fb-seqn">' + (i + 1) + '</span>' +
          '<span class="fb-dot" style="background:' + (p.subColor || '#161A22') + '"></span></div>';
      });
    } else {
      var cell = isM ? 30 : 32;   // 聚合网格边长（px），越大地图越「抱团」
      /* 详情页的主点位单独绘制（永远可见、永远在最上层），不参与聚合 */
      var clusterInput = S.route === 'detail' && me
        ? pts.filter(function (p) { return p.id !== me.id; }) : pts;
      clusterPts(clusterInput, view, W, H, cell).forEach(function (g) {
        var col = g.subColor || catOf(g.cat).color;
        if (g.items.length === 1) {
          var p = g.items[0];
          var on = p.id === S.selectedId;
          pins += '<div class="fb-pin" style="left:' + g.x.toFixed(1) + 'px;top:' + g.y.toFixed(1) + 'px;' + (on ? 'z-index:6' : '') + '">' +
            '<span class="fb-dot" style="background:' + col + ';width:' + (on ? 18 : 12) + 'px;height:' + (on ? 18 : 12) + 'px;' +
            (on ? 'box-shadow:0 0 0 6px ' + col + '22,0 1px 4px rgba(16,24,40,.3)' : '') + '"></span></div>';
        } else {
          pins += '<div class="fb-bubble" style="left:' + g.x.toFixed(1) + 'px;top:' + g.y.toFixed(1) + 'px;background:' + col + '">' +
            g.items.length + '</div>';
        }
      });
      if (S.route === 'detail' && me) {
        var mp = projectPoint(me.lng, me.lat, view, W, H);
        pins += '<div class="fb-pin" style="left:' + mp.x.toFixed(1) + 'px;top:' + mp.y.toFixed(1) + 'px;z-index:8">' +
          '<span class="fb-lab" style="color:#1677FF;box-shadow:0 0 0 1.5px #1677FF">' + esc(me.name) + '</span>' +
          '<span class="fb-dot" style="background:' + (me.subColor || catOf(me.cat).color) + ';width:18px;height:18px;' +
          'box-shadow:0 0 0 7px ' + (me.subColor || catOf(me.cat).color) + '22,0 1px 4px rgba(16,24,40,.3)"></span></div>';
      }
    }
    elFb.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + bg + '</svg>' + pins;
  }

  /* ---------- 视野联动 ---------- */
  function fitToRoute(immediate) {
    S.userMoved = false;
    if (!MAP || S.mapMode !== 'real') { if (S.mapMode === 'fallback') renderFallback(); return; }
    var dur = immediate ? 0 : 600;
    var W = vp.clientWidth, H = vp.clientHeight;
    var rect = freeRect();
    /* padding 直接用实测空区换算：面板宽度、预览卡出现与否、Sheet 换档都会自动生效，
       不再写死数字（写死时详情抽屉 / 移动端 Sheet 都会把点位压到浮层底下）。 */
    var pad = { top: rect.y0, bottom: H - rect.y1, left: rect.x0, right: W - rect.x1 };
    try {
      if (S.route === 'home') {
        /* 全国层：把 34 个省级徽标铺进「未被浮层遮挡」的空区。
           用 bounds（而不是写死 center + zoom）才能适配不同宽高比 —— 写死时窄屏下边缘省份会被推到底图外 */
        var pb = new TMap.LatLngBounds(new TMap.LatLng(90, 180), new TMap.LatLng(-90, -180));
        D.PROVINCES.forEach(function (p) { pb.extend(new TMap.LatLng(p.lat, p.lng)); });
        MAP.fitBounds(pb, { padding: pad, duration: dur });
      } else if (S.route === 'province') {
        /* 省级层：把该省全部市州徽标铺进空区 */
        var cb = new TMap.LatLngBounds(new TMap.LatLng(90, 180), new TMap.LatLng(-90, -180));
        D.SICHUAN_CITIES.forEach(function (c) { cb.extend(new TMap.LatLng(c.lat, c.lng)); });
        MAP.fitBounds(cb, { padding: pad, duration: dur });
      } else if (S.route === 'plan') {
        /* 行程层：把「住宿点 + 当天点位」一起框进空区 —— 住宿点必须参与 fitBounds，
           否则行程的起点会落在视野外，用户一进页面就看不到自己从哪出发 */
        var pbox = new TMap.LatLngBounds(new TMap.LatLng(90, 180), new TMap.LatLng(-90, -180));
        /* 点开某一段后，视野收到那一段的两个端点 —— 「我看这一段」不该被整天的点拉远 */
        if (S.fitLeg) {
          var lg0 = legByKey(S.fitLeg);
          if (lg0 && lg0.from && lg0.to) {
            pbox.extend(new TMap.LatLng(lg0.from.lat, lg0.from.lng));
            pbox.extend(new TMap.LatLng(lg0.to.lat, lg0.to.lng));
            MAP.fitBounds(pbox, { padding: pad, duration: dur });
            return;
          }
        }
        var fitDay = planDay(), fitStay = D.stayOf(fitDay);
        pbox.extend(new TMap.LatLng(fitStay.lat, fitStay.lng));
        fitDay.items.forEach(function (it) {
          var p = placeOf(it);
          if (p) pbox.extend(new TMap.LatLng(p.lat, p.lng));
        });
        MAP.fitBounds(pbox, { padding: pad, duration: dur });
      } else if (S.route === 'city') {
        var list = viewPois();
        if (!list.length) return;
        var box = new TMap.LatLngBounds(new TMap.LatLng(90, 180), new TMap.LatLng(-90, -180));
        list.forEach(function (p) { box.extend(new TMap.LatLng(p.lat, p.lng)); });
        MAP.fitBounds(box, { padding: pad, duration: dur });
      } else {
        var p = POI_BY_ID[S.poiId];
        if (p) {
          /* 详情页把主点位钉在空区中心：直接 easeTo 会居中到整屏，会被抽屉挡住 */
          var c = centerForPoint(p.lng, p.lat, rect, W, H, spanForZoom(15.2, W));
          MAP.easeTo({ center: new TMap.LatLng(c.lat, c.lng), zoom: 15.2, duration: dur });
        }
      }
    } catch (err) {
      /* 个别版本不吃对象型 padding，退回数字型再试一次，别让视野整段失效 */
      try {
        if (S.route === 'city') {
          var lb = viewPois();
          if (lb.length) {
            var b2 = new TMap.LatLngBounds(new TMap.LatLng(90, 180), new TMap.LatLng(-90, -180));
            lb.forEach(function (p) { b2.extend(new TMap.LatLng(p.lat, p.lng)); });
            MAP.fitBounds(b2, { padding: Math.max(pad.top, pad.left, 40), duration: dur });
          }
        }
      } catch (e2) { /* 忽略视野失败 */ }
    }
  }

  /* 行政区简称：徽标上省掉「省 / 市 / 自治区 / 特别行政区」后缀，否则一颗徽标太长会互相压叠 */
  function shortName(n) {
    return String(n).replace(/(壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区|省|市)$/, '');
  }

  /* 省 / 市徽标几何：内容 = 「简称 计数」；未收录计数用破折号（null ≠ 0） */
  function regGeom(item, active) {
    var n = item.count;
    return {
      id: item.id,
      styleId: 'reg' + D.densityLevel(n) + (active ? 'A' : ''),
      position: new TMap.LatLng(item.lat, item.lng),
      content: shortName(item.name) + ' ' + (n == null ? '—' : n)
    };
  }

  function syncMarkers() {
    if (S.mapMode !== 'real') { renderFallback(); return; }
    /* 移动端低 zoom 只挂「有数据」的区划徽标，避免 34 个省互相压成一团
       —— 与降级示意画布 renderFallback() 同一规则，见 plans/10-map-drilldown.md */
    var mobOnlyData = function (list) {
      return S.device === 'mobile'
        ? list.filter(function (it) { return it.count != null; }) : list;
    };
    try {
      /* 行程专用图层默认清空，只在 plan 分支重建 —— 防止切走路线后连线还挂在地图上 */
      if (S.route !== 'plan') {
        if (routeLines) routeLines.setGeometries([]);
        if (congestLines) congestLines.setGeometries([]);
        if (seqMarkers) seqMarkers.setGeometries([]);
      }
      if (S.route === 'home') {
        /* 全国层：34 个省级单位的计数徽标；四川高亮 */
        if (markers) markers.setGeometries([]);
        if (labels) labels.setGeometries([]);
        if (regLabels) regLabels.setGeometries(mobOnlyData(D.PROVINCES).map(function (p) {
          return regGeom(p, p.id === S.provinceId && p.count != null);
        }));
      } else if (S.route === 'province') {
        /* 省级层：该省全部市州的计数徽标；已收录的市高亮 */
        if (markers) markers.setGeometries([]);
        if (labels) labels.setGeometries([]);
        if (regLabels) regLabels.setGeometries(mobOnlyData(D.SICHUAN_CITIES).map(function (c) {
          return regGeom(c, c.id === SC_CITY && c.count != null);
        }));
      } else if (S.route === 'plan') {
        /* ★ 行程层：住宿点 + 当天点位（细类着色）+ 序号 + 连线。
           只画「当天」的点位与连线 —— 切天时整层重画（09 文档 6.3 最后一行） */
        if (regLabels) regLabels.setGeometries([]);
        if (labels) labels.setGeometries([]);
        var day = planDay(), stay = D.stayOf(day);
        var pins = [], seqs = [], path = [];
        day.items.forEach(function (it, i) {
          var p = placeOf(it);
          if (!p) return;
          pins.push({ id: p.id, styleId: 'sub-' + p.subtype, position: new TMap.LatLng(p.lat, p.lng) });
          seqs.push({ id: 'seq-' + it.uid, styleId: 'seq' + Math.min(9, i + 1), position: new TMap.LatLng(p.lat, p.lng) });
          path.push(new TMap.LatLng(p.lat, p.lng));
        });
        pins.push({ id: 'stay-' + stay.id, styleId: 'stay', position: new TMap.LatLng(stay.lat, stay.lng) });
        if (markers) markers.setGeometries(pins);
        if (seqMarkers) seqMarkers.setGeometries(seqs);

        /* ★ 逐段 geometry：id 用段的稳定 key（住宿出发段是 '__leg0'，其余用来源 stop 的 uid），
           这样 hoverLeg / openLeg 能对上具体哪一根线 */
        var tl = buildTimeline(day), hot = focusLegIndex(tl), jams = [];
        var geos = tl.legs.map(function (lg, li) {
          if (!lg.from || !lg.to) return null;
          var isWalk = lg.modeKey === 'walking';
          var isHot = hot === li, dimmed = hot >= 0 && !isHot;
          var sid = isWalk ? (isHot ? 'legWalkOn' : dimmed ? 'legWalkDim' : 'legWalk')
                           : (isHot ? 'legOn'     : dimmed ? 'legDim'     : 'leg');
          /* 拥堵描色只给「展开过方案卡」的那一段 —— 路况数据是在点开时才拉的，
             没拉过就把红段画上去，等于凭空编路况（09 文档 3.6.1 / 6.3.1） */
          if (isHot && S.openLeg && lg.na !== true) {
            var s1 = lerpPt(lg.from, lg.to, .42), s2 = lerpPt(lg.from, lg.to, .70);
            jams.push({
              id: 'jam-' + li, styleId: 'jam',
              paths: [new TMap.LatLng(s1.lat, s1.lng), new TMap.LatLng(s2.lat, s2.lng)]
            });
          }
          return {
            id: 'leg-' + li, styleId: sid,
            paths: [new TMap.LatLng(lg.from.lat, lg.from.lng), new TMap.LatLng(lg.to.lat, lg.to.lng)]
          };
        }).filter(Boolean);
        if (routeLines) routeLines.setGeometries(geos);
        if (congestLines) congestLines.setGeometries(jams);
      } else {
        /* 城市 / 详情层：细类着色的 POI marker */
        if (regLabels) regLabels.setGeometries([]);
        if (routeLines) routeLines.setGeometries([]);
        if (congestLines) congestLines.setGeometries([]);
        if (seqMarkers) seqMarkers.setGeometries([]);
        var list = S.route === 'city' ? visiblePois() : D.POIS.filter(function (p) {
          return p.id === S.poiId || distTo(p.lng, p.lat) < 3.2;
        }).slice(0, 40);
        if (markers) markers.setGeometries(list.map(function (p) {
          return {
            id: p.id,
            styleId: 'sub-' + p.subtype + (p.id === S.selectedId ? 'A' : ''),
            position: new TMap.LatLng(p.lat, p.lng)
          };
        }));
        /* 名称标签只给「当前选中项」——46 个点位全打名字会糊成一片，
           选中项打名字则「我点的是哪个」一眼可辨，不需要回头查图例 */
        if (labels) labels.setGeometries(S.route === 'city' && S.selectedId && POI_BY_ID[S.selectedId]
          ? [{ id: S.selectedId, styleId: 'poi', position: new TMap.LatLng(POI_BY_ID[S.selectedId].lat, POI_BY_ID[S.selectedId].lng), content: POI_BY_ID[S.selectedId].name }]
          : []);
      }
    } catch (e) { /* 忽略图层失败 */ }
  }

  /* ======================================================================
     视图渲染
     ====================================================================== */
  function render() {
    VPUpdateClasses();
    renderTopbar();
    renderPanel();
    renderControls();
    renderLegend();
    renderPreview();
    renderMobile();
    syncMarkers();
    renderFallback();
    renderBasemapUI();
  }

  function searchPlaceholder() {
    if (S.route === 'home') return '搜索省份、城市…';
    if (S.route === 'province') return '在四川搜索市州…';
    var c = CITY_BY_ID[S.cityId];
    return '在' + (c ? c.name : '') + '搜索景点 / 美食 / 细类';
  }

  /* ---------- 顶栏（仅桌面端） ---------- */
  function renderTopbar() {
    if (S.device !== 'desktop') { elTopbar.innerHTML = ''; return; }
    var city = CITY_BY_ID[S.cityId];
    var isDetail = S.route === 'detail';
    var isPlan = S.route === 'plan';
    var poi = POI_BY_ID[S.poiId];

    var left = '';
    if (isPlan) {
      /* 行程页顶栏：返回城市 + 面包屑 + DayTabs（切天放在顶栏，不占面板高度） */
      left = '<button class="btn" data-act="goto-city">' + ico('back', 'ico--sm') + '返回城市页</button>' +
             '<nav class="crumb" aria-label="当前位置"><button data-act="goto-city">' +
             esc((city && city.name) || '成都') + '</button><span class="sep">/</span><b>我的行程</b></nav>' +
             dayTabsHTML();
    } else if (isDetail) {
      left = '<button class="btn" data-act="goto-city">' + ico('back', 'ico--sm') + '返回城市页</button>' +
             crumbHTML() +
             '<nav class="navlinks" style="margin-left:2px"><a href="#" aria-current="page">' + esc(poi.name) + '</a></nav>';
    } else {
      /* ★ 面包屑取代了原来的「城市切换下拉」：下钻路径本身就是导航，
         每一级都可点回上级，比一个下拉菜单更能表达"我现在在哪一层" */
      left = '<button class="brand" data-act="goto-home" aria-label="回到全国视图" style="cursor:pointer">' +
             '<span class="logo">' + ico('nav', 'ico--sm') + '</span>' +
             '<span class="brand-text">行迹<em>城市旅游攻略</em></span></button>' +
             crumbHTML() +
             '<div class="search"><label class="input">' + ico('search', 'ico--sm') +
             '<input type="search" placeholder="' + esc(searchPlaceholder()) +
             '" value="' + esc(S.q) + '" data-role="search" aria-label="搜索">' +
             '<span class="kbd">/</span></label></div>';
    }

    var right = '';
    if (isPlan) {
      /* 导出 / 分享：纯前端实现（JSON 下载 + LZ-string 压缩进 URL hash），不需要后端 */
      right += '<button class="btn" data-act="plan-export">' + ico('link', 'ico--sm') + '导出</button>';
      right += '<button class="btn" data-act="plan-share">' + ico('share', 'ico--sm') + '分享</button>';
    }
    if (isDetail) {
      right += '<button class="btn" data-act="share">' + ico('share', 'ico--sm') + '分享</button>';
    }
    right += segHTML('base', S.base, [['vector', '矢量'], ['satellite', '影像']], '底图切换');
    right += '<button class="iconbtn" data-act="lock" aria-pressed="' + S.baseLocked + '" aria-label="' +
             (S.baseLocked ? '解除底图锁定' : '锁定底图，禁止自动切换') + '">' +
             ico(S.baseLocked ? 'lock' : 'unlock', 'ico--sm') + '</button>';
    if (!isDetail && !isPlan) {
      right += '<span class="vdiv"></span><nav class="navlinks">' +
               '<a href="#" aria-current="page">城市</a><a href="#" data-act="about">关于</a>' +
               '<a href="#" data-act="about">数据来源</a></nav>';
    }
    right += '<span class="vdiv"></span><button class="iconbtn" data-act="fullscreen" aria-label="全屏">' + ico('expand', 'ico--sm') + '</button>';

    elTopbar.innerHTML = '<div class="flt flt--row topbar">' + left +
      '<div class="top-right">' + right + '</div></div>';
  }

  function segHTML(group, cur, items, label) {
    var html = '<div class="seg" role="group" aria-label="' + esc(label) + '">';
    items.forEach(function (it) {
      html += '<button data-act="set-base" data-group="' + group + '" data-value="' + it[0] +
              '" aria-pressed="' + (cur === it[0]) + '">' + esc(it[1]) + '</button>';
    });
    return html + '</div>';
  }

  /* ---------- 左面板 ---------- */
  /* ======================================================================
     行程规划（09 文档）
     -----------------------------------------------------------------------
     ★ 定位重申：这是「行程计时器」，不是「路线优化器」。
       buildTimeline 是一条直线推导，没有任何搜索或优化 —— 因为顺序由用户定，
       且缺少营业时间窗 / 预约时段的数据，「最优顺序」不可信（09 文档 1.1）。
     ====================================================================== */
  function placeOf(it) { return POI_BY_ID[it.poiId] || null; }
  /** 一段的「归属 uid」= 出发那个 stop 的 uid（住宿出发段为 null） */
  function uidOf(st) { return st && st.kind === 'poi' ? st.item.uid : null; }

  /**
   * 段的稳定 key —— ★ 住宿出发段没有 uid（出发点是住宿不是 POI），给它一个伪 key '__leg0'，
   *   否则第一段永远无法被 hover 聚焦、也无法展开方案卡（它在 UI 上明明存在）。
   */
  function legKeyOf(st, i) { return st && st.kind === 'poi' ? st.item.uid : (i === 0 ? '__leg0' : null); }

  /** 当前被聚焦的段下标：hover 优先于展开；无聚焦返回 -1（此时所有段都是常态） */
  function focusLegIndex(tl) {
    var idx = -1;
    for (var i = 0; i < tl.stops.length; i++) {
      var k = legKeyOf(tl.stops[i], i);
      if (k && (k === S.hoverLeg || k === S.openLeg)) idx = i;
    }
    return idx;
  }

  /** 两点线性插值 —— 拥堵子段用它切出中间一小截。≈ 示意级精度，够用且诚实标注了 */
  function lerpPt(a, b, t) {
    return { lng: a.lng + (b.lng - a.lng) * t, lat: a.lat + (b.lat - a.lat) * t };
  }

  function fmtDur(sec) {
    if (sec == null) return '—';
    var m = Math.max(0, Math.round(sec / 60));
    if (m < 60) return m + ' 分';
    return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  }
  function fmtClock(mins) {
    var m = ((mins % 1440) + 1440) % 1440;          // 跨天保护
    return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);
  }
  function parseClock(hhmm) {
    var p = String(hhmm || '09:00').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function fmtKm(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; }

  /** ★ 纯函数：给定一天的计划 + 住宿点，推导完整时间链。stops = [住宿] + 点位… + [住宿] */
  function buildTimeline(day) {
    var stay = D.stayOf(day);
    var stops = [{ kind: 'stay', place: stay }];
    day.items.forEach(function (it) {
      var p = placeOf(it);
      if (p) stops.push({ kind: 'poi', item: it, place: p });
    });
    stops.push({ kind: 'stay', place: stay });      // ★ 末段回到住宿

    var t = parseClock(day.startTime), transit = 0, dwell = 0;
    stops[0].atMin = t;
    var legs = [];
    for (var i = 0; i < stops.length - 1; i++) {
      var mode = stops[i].kind === 'poi' ? (stops[i].item.modeToNext || 'driving') : 'driving';
      var lg = D.legEstimate(stops[i].place, stops[i + 1].place, mode);
      lg.modeKey = mode; lg.from = stops[i].place; lg.to = stops[i + 1].place;
      /* ★ 用户在多方案卡里选了 B / C，就把该段时长按方案系数放大 —— 时间链整体随之后移。
         注意：只改时间，不改顺序；选哪条路的决定权也在用户手里。 */
      var opt = (uidOf(stops[i])) != null ? S.planOpts[uidOf(stops[i])] : null;
      if (opt === 'B') lg.duration = Math.round(lg.duration * 1.22);
      else if (opt === 'C') lg.duration = Math.round(lg.duration * 1.35);
      legs.push(lg);
      if (!lg.na) { t += Math.round(lg.duration / 60); transit += lg.duration; }
      stops[i + 1].atMin = t;
      if (stops[i + 1].kind === 'poi') {
        t += stops[i + 1].item.dwell;
        stops[i + 1].leaveMin = t;
        dwell += stops[i + 1].item.dwell;
      }
    }
    return { startTime: day.startTime, startMin: parseClock(day.startTime), endMin: t,
             legs: legs, stops: stops, transitSec: transit, dwellMin: dwell };
  }

  /** 四条过载规则 —— ★ 一律「陈述 + 建议」，不用祈使句（顺序的决定权在用户手里） */
  function overloadWarnings(tl) {
    var out = [];
    if (tl.endMin > 22 * 60) {
      out.push('行程排到 ' + fmtClock(tl.endMin) + '，可能过晚 · 建议减少 1 个点位');
    }
    if (tl.dwellMin > 0 && tl.transitSec > tl.dwellMin * 60 * 0.5) {
      out.push('路上耗掉 ' + fmtDur(tl.transitSec) + '，接近游玩时间的一半 · 建议把相近的点位安排在一起');
    }
    var mx = null;
    tl.legs.forEach(function (l) { if (!l.na && (!mx || l.duration > mx.duration)) mx = l; });
    if (mx && mx.duration > 60 * 60) {
      out.push('有一段需 ' + fmtDur(mx.duration) + '，是全天最长的一段 · 可考虑换个顺序');
    }
    var naLeg = null;
    tl.legs.forEach(function (l) { if (l.na && !naLeg) naLeg = l; });
    if (naLeg) {
      /* ★ 「不适用」要给**替代方式的具体时长**，只说「建议换方式」等于把活推回给用户（09 文档 3.2.5）。
         这里就在本地把其他可用方式算出来，取最快的两条列给用户 —— 零 API 调用，矩阵查表而已。 */
      var alts = D.MODE_META.map(function (m) {
        var e = D.legEstimate(naLeg.from, naLeg.to, m.key);
        return e.na ? null : { m: m, e: e };
      }).filter(Boolean).sort(function (x, y) { return x.e.duration - y.e.duration; }).slice(0, 2);
      out.push('有一段 ' + naLeg.mode.label + '超出合理距离（' + fmtKm(naLeg.distance) + ' 直线）' +
        (alts.length
          ? ' · 改用' + alts.map(function (a) {
              return a.m.label + '约 ' + fmtDur(a.e.duration);
            }).join(' / ') + ' · 或考虑删掉该点'
          : ' · 该段距离超出所有方式的合理范围，建议删掉该点'));
    }
    return out;
  }

  /** 六种方式切换条 —— ★ 用户看到六种，但矩阵只有三条通道；不适用者灰掉并划掉 */
  function modestripHTML(uid, cur, lg) {
    return '<div class="modestrip">' + D.MODE_META.map(function (m) {
      var na = false;
      if (lg && lg.from && lg.to) na = D.legEstimate(lg.from, lg.to, m.key).na;
      return '<button class="modepill' + (na ? ' is-na' : '') + '" aria-pressed="' + (m.key === cur) +
        '" data-act="plan-mode" data-uid="' + uid + '" data-mode="' + m.key + '" ' +
        'aria-label="' + esc(m.label) + (na ? '，超出该方式合理距离，不适用' : '') + '">' +
        ico(m.ico, 'ico--sm') + m.label + '</button>';
    }).join('') + '</div>';
  }

  /** 多方案卡片 —— ★ 点开某一段才拉（1 次调用），进入页面不拉；措辞一律「约 / 预估」 */
  function routeOptionsHTML(uid, lg) {
    if (lg.na) return '';
    /* 降级：get_mp=1 不保证返回 3 条，有些点对只有 1 条可行路线。
       UI 必须能优雅处理「只有 1 条」，不能按 3 条排版留两个空位（09 文档 3.6.3）。 */
    var single = S.degrade === 'single-opt';
    var b = lg.duration;
    var opts = [
      { k: 'A', sec: b,                     m: lg.distance,               tag: '少红绿灯' },
      { k: 'B', sec: Math.round(b * 1.22),  m: Math.round(lg.distance * 1.31), tag: '少收费' },
      { k: 'C', sec: Math.round(b * 1.35),  m: Math.round(lg.distance * 0.79), tag: '避堵', toll: 10 }
    ];
    if (single) opts = [opts[0]];
    var cur = S.planOpts[uid] || 'A';
    var rows = opts.map(function (o) {
      var on = o.k === cur;
      return '<button class="rto-opt' + (on ? ' is-on' : '') + '" data-act="plan-opt" data-uid="' + uid +
        '" data-opt="' + o.k + '">' +
        '<span class="rl">' + o.k + '</span><span class="rv">' + fmtDur(o.sec) + '</span>' +
        '<span class="rd">' + fmtKm(o.m) + '</span><span class="rt2">' + o.tag + '</span>' +
        '<span class="rsp">' + (o.toll ? '过路费 ¥' + o.toll : (on ? '已选' : '')) + '</span>' +
        '</button>';
    }).join('');
    /* ★ 诚实标注三连：① 时长是「生成时刻快照」不是实时 ② 按往返均值 ③ 路况是查询时刻的。
       这三条不写，用户会把一个 9 月的快照当成今天出发的实时路况（09 文档 3.2.3 / 3.2.6 / 3.6.3）。 */
    var fare = S.degrade === 'no-fare'
      ? ''                                    /* 降级：taxi_fare 缺失就整行隐藏，不显示「费用未知」 */
      : '<span>打车约 ¥18（预估）</span>';
    return '<div class="rto">' +
      '<div class="rto-h"><span>' + (single ? '仅 1 条方案可用' : opts.length + ' 条方案 · 接口最多返回 3 条') +
      '</span><span class="est">直线示意</span></div>' +
      rows +
      '<div class="rto-foot"><span class="slow">' + ico('alert', 'ico--sm') +
      '2 处缓行 · 最慢 18 km/h</span>' + fare + '</div>' +
      '<div class="rto-note">基于 2026-09-18 工作日上午路况估算 · 时长按往返均值 · 路况为查询时刻快照</div>' +
      '</div>';
  }

  /** limit = 只渲染前 N 个 stop（移动端 half 档用），截断时给一条「还有几项」的出口 */
  function planTimelineHTML(tl, compact, limit) {
    var rows = '', max = limit || tl.stops.length;
    tl.stops.forEach(function (st, i) {
      if (i >= max) return;
      var first = i === 0, last = i === tl.stops.length - 1;
      var lg = tl.legs[i];
      var uid = legKeyOf(st, i);          // ★ 住宿出发段用伪 key '__leg0'，让它也能被聚焦与展开
      var open = uid && S.openLeg === uid;

      var body;
      if (st.kind === 'stay') {
        body = '<div class="tl-h"><span class="hh">' + fmtClock(st.atMin) + '</span>' +
          '<span class="nm">' + (first ? '从住宿出发' : '回到住宿') + '</span></div>';
      } else {
        body = '<div class="tl-h"><span class="hh">' + fmtClock(st.atMin) + '</span>' +
          '<span class="nm">' + esc(st.place.name) + '</span>' +
          '<span class="tag">' + esc(st.place.subtypeName || CAT_NAME[st.place.cat] || '') + '</span>' +
          /* 移动端拖拽把手：★ 长按 300ms 才激活拖动，避免与 Sheet 下拉手势抢事件（08 文档 3·B） */
          (compact ? '<span class="m-grip" aria-hidden="true">≡</span>' : '') + '</div>' +
          (S.editDwell === uid
            /* 就地编辑态：±15 分步进，改完立刻重算整条时间链 */
            ? '<div class="tl-sub"><span>停留 <b>' + st.item.dwell + '</b> 分</span>' +
              '<button class="edit" data-act="plan-dwell-inc" data-uid="' + uid + '">+15</button>' +
              '<button class="edit" data-act="plan-dwell-dec" data-uid="' + uid + '">−15</button>' +
              '<button class="edit" data-act="plan-dwell-done">完成</button></div>'
            : '<div class="tl-sub"><span>停留 ' + st.item.dwell + ' 分</span>' +
              '<span class="default">默认值 · 点击可改</span>' +
              '<button class="edit" data-act="plan-dwell" data-uid="' + uid + '">修改</button>' +
              /* ★ 跨天移动入口：把点位挪到下一天。跨住宿段时会先说明落脚点变了（09 文档 6.2） */
              (compact || D.PLAN_DAYS.length < 2 ? ''
                : '<button class="edit" data-act="plan-move-day" data-uid="' + uid + '">移到下一天</button>') +
              '</div>');
      }
      rows += '<div class="tl-row' + (first ? ' tl-row--first' : '') + (last ? ' tl-row--last' : '') + '">' +
        '<div class="tl-mid"><span class="tl-dot' + (st.kind === 'stay' ? ' tl-dot--stay' : '') + '"></span></div>' +
        '<div class="tl-body">' + body + '</div></div>';

      if (!lg) return;                              // 最后一个 stop 之后没有段
      var m = lg.mode;
      var legHTML;
      if (lg.na) {
        legHTML = '<div class="legbox"><span class="lg-ic">' + ico(m.ico, 'ico--sm') + '</span>' +
          '<span class="lg-t">' + m.label + ' · 不适用（' + fmtKm(lg.distance) + '）</span>' +
          '<button class="lg-swap" data-act="plan-leg" data-uid="' + uid + '">换方式</button></div>';
      } else {
        legHTML = '<div class="legbox' + (open ? ' is-on' : '') + '" data-act="plan-leg" data-uid="' + uid +
          '" data-leg="' + uid + '">' +
          '<span class="lg-ic">' + ico(m.ico, 'ico--sm') + '</span>' +
          '<span class="lg-t"><b>' + fmtDur(lg.duration) + '</b> · ' + fmtKm(lg.distance) + '</span>' +
          '<span class="lg-swap">' + (open ? '收起' : '方案') + '</span></div>';
      }
      if (open) legHTML = modestripHTML(uid, lg.modeKey, lg) + legHTML + routeOptionsHTML(uid, lg);
      rows += '<div class="tl-row tl-row--leg"><div class="tl-mid"></div>' +
        '<div class="tl-body">' + legHTML + '</div></div>';
    });
    /* 截断出口：不给「往哪去」的线索，用户会以为行程就这几项 */
    if (tl.stops.length > max) {
      rows += '<div class="tl-more" data-act="sheet-full">还有 ' + (tl.stops.length - max) +
        ' 项 · 上滑查看全部</div>';
    }
    return rows;
  }

  function planDay() { return D.PLAN_DAYS[S.planDay - 1] || D.PLAN_DAYS[0]; }

  /** 按段的稳定 key 找到那一段（住宿出发段用 '__leg0'） */
  function legByKey(key) {
    var tl = buildTimeline(planDay());
    for (var i = 0; i < tl.stops.length; i++) {
      if (legKeyOf(tl.stops[i], i) === key) return tl.legs[i];
    }
    return null;
  }

  /**
   * 把视野收窄到某一段的两个端点 —— 09 文档 6.3：「点一段 Leg → 视野收窄到该段两端点」。
   * 做法是设一个 S.fitLeg 标记，让 fitToRoute 与降级画布共用同一套视野决策，不另写一条分支。
   */
  function fitToLeg(key) {
    S.fitLeg = legByKey(key) ? key : null;
    fitToRoute(false);
  }

  /**
   * 把点位移到下一天 —— ★ 跨天移动必须校验住宿段（09 文档 6.2）：
   *   目标天住的是另一个酒店时，这一天的起点/终点都变了，时间链的口径也随之变，
   *   所以要先把事实告诉用户，而不是默默替他决定。正式版这里是一个确认弹窗。
   */
  function movePlanItem(uid) {
    var src = null, item = null;
    D.PLAN_DAYS.forEach(function (d) {
      d.items.forEach(function (it) { if (it.uid === uid) { src = d; item = it; } });
    });
    if (!src || !item || D.PLAN_DAYS.length < 2) return;
    var dst = D.PLAN_DAYS[src.day % D.PLAN_DAYS.length];      // 循环到下一天
    var p = placeOf(item);
    src.items = src.items.filter(function (it) { return it.uid !== uid; });
    dst.items.push(item);
    S.openLeg = null; S.hoverLeg = null; S.fitLeg = null;
    render(); fitToRoute(false);
    showToast(src.stayId === dst.stayId
      ? '「' + (p ? p.name : '该点位') + '」已移到第 ' + dst.day + ' 天 · 同一住宿段，两条时间链已各自重算'
      : '「' + (p ? p.name : '该点位') + '」已移到第 ' + dst.day + ' 天 · 第 ' + dst.day +
        ' 天住的是另一个住宿点（' + D.stayOf(dst).name + '），出行落脚点随之改变 · ' +
        '正式版会先问一句「仍要移过去吗？」再执行');
  }

  /** 住宿点三路输入的替身：原型里「更换」= 在三个预设间轮转（09 文档 4.1.1）。
      坐标取自真实 POI，所以换住宿后连线与时间链都会跟着变。 */
  var STAY_PRESETS = [
    { name: '春熙路某酒店',     poiId: 'taikooli',       source: 'geocoded', address: '锦江区中纱帽街 8 号' },
    { name: '宽窄巷子附近民宿', poiId: 'kuanzhai-alley', source: 'picked',   address: '青羊区长顺上街' },
    { name: '武侯祠附近酒店',   poiId: 'wuhou-shrine',   source: 'poi',      address: '武侯区武侯祠大街 231 号' }
  ];
  function cycleStay() {
    /* ★ 换的是「当天所属」那个住宿段，不是写死的第一个 —— 多住宿段下必须按天定位 */
    var stay = D.stayOf(planDay()), i = 0;
    STAY_PRESETS.forEach(function (p, k) { if (p.name === stay.name) i = k; });
    var nx = STAY_PRESETS[(i + 1) % STAY_PRESETS.length];
    var ref = POI_BY_ID[nx.poiId];
    if (!ref) return;
    stay.name = nx.name; stay.source = nx.source; stay.address = nx.address;
    stay.lng = ref.lng; stay.lat = ref.lat;
    render(); fitToRoute(false);
    var how = nx.source === 'geocoded' ? '搜索定位' : nx.source === 'picked' ? '地图点选' : '从 POI 里选';
    showToast('住宿点已换为「' + nx.name + '」（' + how + '）· 时间链与地图连线已重算 · 只存本机，不上传');
  }

  /** 添加点位：追加到当天末尾 —— ★ 顺序仍由用户后续拖拽决定，系统不「替你排」 */
  function addPlanPoi() {
    var day = planDay();
    var used = {};
    day.items.forEach(function (it) { used[it.poiId] = 1; });
    var cand = D.POIS.filter(function (p) { return !used[p.id]; });
    if (!cand.length) { showToast('当前城市的点位都已在行程里了'); return; }
    var p = cand[0];
    day.items.push({ uid: 'x' + Date.now(), poiId: p.id, dwell: 60, modeToNext: 'driving' });
    S.openLeg = null;
    render(); fitToRoute(false);
    showToast('已加入「' + p.name + '」· 顺序由你决定，系统只算时间（长按 ≡ 可拖）');
  }

  /** 天切换 —— 桌面在顶栏、移动端在 Sheet 里，同一组件。橙点 = 该天行程偏满 */
  function dayTabsHTML(cls) {
    return '<div class="daytabs' + (cls ? ' ' + cls : '') + '" role="tablist" aria-label="切换行程天数">' +
      D.PLAN_DAYS.map(function (d) {
        var tl = buildTimeline(d);
        var over = tl.endMin > 22 * 60;
        return '<button class="daytab" role="tab" aria-current="' + (d.day === S.planDay) +
          '" data-act="plan-day" data-day="' + d.day + '">第 ' + d.day + ' 天' +
          (over ? '<span class="wdot"></span>' : '') + '</button>';
      }).join('') + '</div>';
  }

  /**
   * 降级条（09 文档第九节）—— 桌面面板与移动端 Sheet 共用同一段 HTML，避免两处各写一遍、措辞走样。
   * ★ 这几条是**系统状态**，不是行程质量问题，所以配色与橙色过载提示分开，别混为一谈。
   */
  function degradeBarHTML() {
    if (S.degrade === 'quota') {
      return '<div class="degbar">' + ico('info', 'ico--sm') +
        '<span>今日实时路况额度已用完，本页时长改为估算值 · 静态矩阵照常可用</span></div>';
    }
    if (S.degrade === 'nostore') {
      return '<div class="degbar">' + ico('info', 'ico--sm') +
        '<span>浏览器不允许本地存储（隐私模式？）· 本次会话有效，关闭后将丢失 · 建议导出 JSON</span></div>';
    }
    if (S.degrade === 'broken-link') {
      return '<div class="degbar">' + ico('info', 'ico--sm') +
        '<span>链接已失效或格式不兼容 · 已保留你当前的行程，可继续手动添加点位</span></div>';
    }
    return '';
  }

  /** 桌面行程面板：住宿行 + 时间轴 + 过载提示 + 汇总 + 添加点位 */
  function panelPlan() {
    var day = planDay();
    var tl = buildTimeline(day);
    var stay = D.stayOf(day);
    var srcTxt = stay.source === 'geocoded' ? '搜索定位' : stay.source === 'picked' ? '地图点选' : '从 POI 里选';

    var degHTML = degradeBarHTML();

    /* 住宿段列表：★ 多住宿段（09 文档 I1）—— 每天归属一个，中途换酒店是真实需求。
       列表常显是为了让「今天住哪个」一眼可见，切天时住宿行会自动换成对应那个。 */
    var stayRows = D.STAYS.map(function (s) {
      var on = s.id === day.stayId;
      return '<div class="stayrow' + (on ? ' is-on' : '') + '" data-act="plan-day" data-day="' +
        s.fromDay + '" role="button" tabindex="0" aria-current="' + on + '">' +
        '<span>' + (on ? ico('check', 'ico--sm') : ico('pin', 'ico--sm')) + '</span>' +
        '<span class="sd">' + esc(s.name) + ' · 第 ' + s.fromDay +
        (s.toDay > s.fromDay ? '–' + s.toDay : '') + ' 天</span>' +
        '<span class="addstay">查看该天</span></div>';
    }).join('');

    var warnHTML = overloadWarnings(tl).map(function (w) {
      return '<div class="warnbar" style="margin:0 0 6px">' + ico('alert', 'ico--sm') +
        '<span>' + esc(w) + '</span></div>';
    }).join('');

    return '<div class="flt flt--col flt--itin">' +
      '<div class="itin-stay">' +
        '<span class="ic">' + ico('pin', 'ico--sm') + '</span>' +
        '<span class="who"><b>' + esc(stay.name) + '</b>' +
        '<span>第 ' + stay.fromDay + '–' + stay.toDay + ' 天 · ' + srcTxt + ' · 仅存本机</span></span>' +
        '<button class="chg" data-act="plan-stay">更换</button>' +
      '</div>' +
      (D.STAYS.length > 1 ? '<div style="padding:0 12px 6px">' + stayRows + '</div>' : '') +
      (degHTML ? '<div style="padding:0 16px 2px">' + degHTML + '</div>' : '') +
      '<div class="tl">' + planTimelineHTML(tl) + '</div>' +
      (warnHTML ? '<div style="padding:2px 16px 8px">' + warnHTML + '</div>' : '') +
      '<div class="itin-sum">' +
        '<div class="l">在途 <b>' + fmtDur(tl.transitSec) + '</b> · 停留 <b>' + fmtDur(tl.dwellMin * 60) + '</b>' +
        '<br>共 ' + day.items.length + ' 个点位 · 顺序由你决定，系统只算时间</div>' +
        '<div class="big">' + fmtDur((tl.endMin - tl.startMin) * 60) + '<span>全天合计</span></div>' +
      '</div>' +
      '<div class="itin-add"><button class="addbtn" data-act="plan-add">' +
        ico('plus', 'ico--sm') + '添加点位</button>' +
        /* ★ 导入是导出的另一半：08 文档第八节要求能导出就能导回，否则导出的文件是一次性的 */
        '<button class="addbtn" data-act="plan-import" style="margin-top:8px">' +
        ico('upload', 'ico--sm') + '导入行程 JSON</button></div>' +
      '</div>';
  }

  function renderPanel() {
    if (S.device !== 'desktop') { elPanel.innerHTML = ''; return; }
    if (S.route === 'home') elPanel.innerHTML = panelHome();
    else if (S.route === 'province') elPanel.innerHTML = panelProvince();
    else if (S.route === 'plan') elPanel.innerHTML = panelPlan();
    else if (S.route === 'city') elPanel.innerHTML = panelCity();
    else elPanel.innerHTML = panelDetail();
  }

  /* 全国页面板：34 个省级单位 + 收录计数；未收录灰显、不可下钻（点它出「待收录」引导卡） */
  function panelHome() {
    var collected = D.PROVINCES.filter(function (p) { return p.count != null; }).length;
    var rows = D.PROVINCES.map(function (p) {
      var pending = p.count == null;
      var on = !pending && p.id === S.provinceId;
      return '<button class="drow' + (pending ? ' is-pending' : '') + '" data-act="goto-province" data-prov="' +
        p.id + '" aria-current="' + on + '">' +
        '<span class="dn"><b>' + esc(shortName(p.name)) + '</b><span>' + esc(provMeta(p)) + '</span></span>' +
        cntHTML(p.count) +
        '<span class="go">' + (pending ? '—' : ico('chev-right', 'ico--sm')) + '</span></button>';
    }).join('');

    return '<div class="flt flt--col panel-left">' +
      '<div class="p-head"><h2>全国概览</h2>' +
      '<div class="sub">先看「哪个省有多少内容」，再逐级下钻到市与具体点位。</div>' +
      '<div class="stats"><span><b>' + collected + '</b> 省已收录</span><span><b>' + D.TOTAL_POIS +
      '</b> 个点位</span><span>共 ' + D.PROVINCE_COUNT + ' 个省级单位</span>' +
      '<span>更新于 ' + esc(D.FETCHED_AT.slice(5)) + '</span></div></div>' +
      '<div class="p-sep"></div>' +
      '<div class="p-list scroll" style="padding-top:8px">' + rows + '</div>' +
      '<div class="p-foot"><span>含中国台湾 / 中国香港 / 中国澳门</span><span>未收录灰显</span></div>' +
      '</div>';
  }

  /* 省级页面板：该省全部市州 + 计数 */
  function panelProvince() {
    var p = PROVINCE_BY_ID[S.provinceId] || PROVINCE_BY_ID[SC_PROVINCE];
    var cities = D.SICHUAN_CITIES;
    var done = cities.filter(function (c) { return c.count != null; }).length;
    var rows = cities.map(function (c) {
      var pending = c.count == null;
      var on = !pending && c.id === SC_CITY;

        c.id + '" aria-current="' + on + '">' +
        '<span class="dn"><b>' + esc(shortName(c.name)) + '</b><span>' +

        cntHTML(c.count) +
        '<span class="go">' + (pending ? '—' : ico('chev-right', 'ico--sm')) + '</span></button>';
