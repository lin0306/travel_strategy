<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行迹 · 城市旅游攻略 — 高保真原型 v1.0</title>
<style>
/* ==========================================================================
   行迹 · 高保真原型 v1.0
   ---------------------------------------------------------------------------
   布局模型：地图即画布（Map as Canvas）—— 底层是铺满 100% 视口的真实地图，
   所有 UI 都是悬浮其上的浮层。详见 plans/05-ui-ux-design.md 第 1.0 节。

   与低保真原型的区别：
     · 真实腾讯地图（矢量 / 影像底图，真实 marker、真实视野联动）
     · 真实外链图片（Unsplash）、真实图标（内联 SVG）、真实排版
     · 真实可交互：筛选 / 联动 / 底图切换 / 自动降级 / Sheet 三档拖拽 / 灯箱
     · 视觉全 token 化：颜色、圆角、阴影、间距均取自 :root，禁止各处硬编码
   ========================================================================== */

/* ---------- 1. Design Token ---------- */
:root{
  /* 品牌与分类色 */
  --c-primary:#1677FF;
  --c-primary-ink:#0E5FD8;
  --c-primary-soft:#EBF3FF;
  --c-sight:#2F7BE8;
  --c-food:#E8672F;
  --c-hot:#E8389B;
  --c-special:#12A67A;

  /* ★ 细类色（12）—— 决定 marker 颜色与细类图例。色相刻意互相拉开（不按大类分色系），
     因为小尺寸 marker 上同色系深浅几乎分辨不出；大类的区分已由筛选 chip 承担。
     单一真源：plans/02-data-model.md 的 SUBTYPE_META，此处与之逐值对齐 */
  --s-nature:#3B8C4E;   --s-museum:#6B5BC7;  --s-historic:#8A6A3B;
  --s-park:#2A9D8F;     --s-temple:#B4553D;
  --s-local:#E76F2E;    --s-snack:#D99B1A;   --s-cafe:#A9805A;
  --s-photo:#D4537E;    --s-art:#9B5FB0;
  --s-street:#56707F;   --s-performance:#A33B6B;

  /* ★ 收录密度四级（省 / 市下钻页的计数徽标底色）：未收录 / 1–19 / 20–49 / 50+ */
  --d0:#EDEFF2; --d1:#D6E4F7; --d2:#A9C7F0; --d3:#6E9FE0;

  /* 中性阶 */
  --c-text:#161A22;
  --c-text-2:#5A6472;
  --c-text-3:#8B95A1;
  --c-text-4:#AEB6C2;
  --c-line:#E6E9EF;
  --c-line-2:#F0F2F6;
  --c-bg:#F7F8FA;
  --c-surface:#FFFFFF;
  --c-surface-2:#FAFBFC;
  --c-map-bg:#E8EBEF;
  --c-danger:#E5484D;

  /* 浮层 */
  --flt-bg:rgba(255,255,255,.955);
  --flt-inset:16px;
  --flt-gap:12px;
  --flt-radius:14px;
  --flt-shadow:0 6px 22px rgba(16,24,40,.14), 0 1px 3px rgba(16,24,40,.07);
  --flt-shadow-sm:0 3px 12px rgba(16,24,40,.13), 0 1px 2px rgba(16,24,40,.06);
  --flt-ring:0 0 0 1px rgba(16,24,40,.05);

  /* 浮层尺寸 token（禁止各处硬编码宽度） */
  --panel-left:348px;
  --panel-preview:326px;
  --panel-detail:620px;
  /* ★ 行程规划页：时间轴每行要放「时间 + 名称 + 停留 + 方式 + 时长 + 距离」，
     348px 会挤成三行（05 文档 P5 取舍表）。禁止在组件里硬编码这个宽度 */
  --panel-itinerary:420px;
  --panel-locate:300px;
  --topbar-h:52px;

  /* 形状 token */
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:10px;
  --radius-card:14px;
  --radius-pill:999px;

  /* 间距阶 */
  --sp-1:4px;  --sp-2:8px;  --sp-3:12px;
  --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;

  /* 字号阶 */
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px;
  --fs-xl:17px; --fs-2xl:20px; --fs-3xl:26px;

  /* 动效 */
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:.24s;

  /* 移动端 Sheet 档位（在 390×844 画布内的绝对值） */
  --sheet-peek:236px;
  --sheet-half:472px;
  --sheet-full:743px;
  --sheet-h:472px;   /* 由 JS 按当前档位覆写 */

  /* 地图降级画布用色 */
  --fb-land:#EBEFF3;
  --fb-water:#CFE0EE;
  --fb-green:#DEEADB;
  --fb-road:#FFFFFF;
  --fb-road-2:#F7F9FB;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:#DFE3E9;
  color:var(--c-text);
  line-height:1.6;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;border-radius:var(--radius-xs)}
img{display:block;max-width:100%}
ol,ul{list-style:none}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#C9D0DA;border-radius:var(--radius-pill);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB6C2;background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 2. 舞台：居中 + 等比缩放 ---------- */
.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px 22px 84px;      /* 底部留出原型控制台 */
  background:radial-gradient(120% 90% at 50% 0%,#EEF1F6 0%,#D9DEE6 100%);
}
.scaler{transform-origin:center center;transition:transform .18s ease}

/* 视口画布（唯一的布局根，两端共用同一模型） */
.vp{
  position:relative;overflow:hidden;background:var(--c-map-bg);
  color:var(--c-text);
  /* 地图右侧「轨道」（控件组 + 图例条）的左起点：默认贴左面板右缘，
     详情页抽屉更宽时由 .has-detail 覆写，避免抽屉压住轨道 */
  --rail-left:var(--panel-left);
}
.vp--desktop{width:1280px;height:820px;border-radius:var(--radius-md);
  box-shadow:0 18px 50px rgba(16,24,40,.20),0 0 0 1px rgba(16,24,40,.08)}
.vp--mobile{
  width:390px;height:844px;border-radius:34px;
  box-shadow:0 18px 50px rgba(16,24,40,.24),0 0 0 1px rgba(16,24,40,.08);
}
/* 详情页抽屉占 620px（--panel-detail），右侧轨道整体右移到抽屉之后 */
.vp--desktop.has-detail{--rail-left:var(--panel-detail)}

/* ---------- 3. 地图层（页面本身，不是页面里的组件） ---------- */
.map-layer{position:absolute;inset:0;z-index:0;background:var(--c-map-bg)}

/* 降级示意画布：SDK 未就绪时顶替地图层，保证浮层永远可读 */
.map-fallback{position:absolute;inset:0;z-index:1;display:none;overflow:hidden;background:var(--fb-land)}
.map-fallback.is-on{display:block}
.map-fallback svg{position:absolute;inset:0;width:100%;height:100%}
.fb-pin{
  position:absolute;transform:translate(-50%,-100%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;
}
.fb-dot{width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(16,24,40,.30)}
.fb-lab{
  font-size:11px;font-weight:600;color:#3D4757;background:rgba(255,255,255,.94);
  padding:1px 6px;border-radius:var(--radius-xs);white-space:nowrap;
  box-shadow:0 1px 3px rgba(16,24,40,.14);
}
/* 地图服务降级提示：挂在底部图例条的状态区里（不额外占地图空间） */
.fbtag{
  color:var(--c-text-3);font-size:10.5px;
  border:1px dashed var(--c-line-2);border-radius:var(--radius-xs);padding:2px 8px;white-space:nowrap;
}
/* 点聚合气泡 */
.fb-bubble{
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  min-width:26px;height:26px;padding:0 7px;border-radius:var(--radius-pill);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;letter-spacing:-.2px;
  border:2.5px solid #fff;box-shadow:0 2px 8px rgba(16,24,40,.28);
}

/* ---------- 4. 浮层基元 ---------- */
.flt{
  position:absolute;z-index:20;
  background:var(--flt-bg);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border-radius:var(--flt-radius);
  box-shadow:var(--flt-shadow),var(--flt-ring);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .flt{background:#fff}
}
.flt--col{display:flex;flex-direction:column;overflow:hidden}
.flt--row{display:flex;align-items:center}
.flt--pill{border-radius:var(--radius-pill)}

/* 内部滚动区：细滚动条，避免盖住圆角 */
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:#D2D8E0;border:1px solid transparent;background-clip:content-box}
.scroll:hover::-webkit-scrollbar-thumb{background:#B4BCC8;background-clip:content-box}

/* ---------- 5. 通用原子 ---------- */
.ico{width:16px;height:16px;flex:none;display:block}
.ico--sm{width:14px;height:14px}
.ico--lg{width:18px;height:18px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 14px;border-radius:var(--radius-sm);
  font-size:var(--fs-md);font-weight:500;color:var(--c-text-2);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);
  transition:background var(--dur),box-shadow var(--dur),color var(--dur);
  white-space:nowrap;
}
.btn:hover{background:var(--c-surface-2);color:var(--c-text)}
.btn--primary{background:var(--c-primary);color:#fff;box-shadow:0 1px 2px rgba(22,119,255,.35)}
.btn--primary:hover{background:var(--c-primary-ink);color:#fff}
.btn--ghost{background:transparent;box-shadow:none;color:var(--c-text-2)}
.btn--ghost:hover{background:rgba(16,24,40,.05);color:var(--c-text)}
.btn--sm{height:28px;padding:0 10px;font-size:var(--fs-sm)}
.btn--block{width:100%}

.iconbtn{
  width:34px;height:34px;border-radius:var(--radius-sm);flex:none;
  display:inline-flex;align-items:center;justify-content:center;color:var(--c-text-2);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);
  transition:background var(--dur),color var(--dur);
}
.iconbtn:hover{background:var(--c-surface-2);color:var(--c-text)}
.iconbtn--plain{background:transparent;box-shadow:none}
.iconbtn--plain:hover{background:rgba(16,24,40,.06)}

.badge{
  display:inline-flex;align-items:center;flex:none;
  font-size:var(--fs-xs);font-weight:600;line-height:1.6;
  padding:1px 7px;border-radius:var(--radius-xs);
}
.badge--sight{color:var(--c-sight);background:color-mix(in srgb,var(--c-sight) 11%,#fff)}
.badge--food{color:var(--c-food);background:color-mix(in srgb,var(--c-food) 11%,#fff)}
.badge--hot{color:var(--c-hot);background:color-mix(in srgb,var(--c-hot) 11%,#fff)}
.badge--special{color:var(--c-special);background:color-mix(in srgb,var(--c-special) 11%,#fff)}
.badge--region{color:var(--c-text-2);background:var(--c-line-2)}

.tag{
  display:inline-flex;align-items:center;flex:none;
  font-size:var(--fs-xs);color:var(--c-text-2);
  background:var(--c-line-2);border-radius:var(--radius-xs);padding:2px 7px;
}
.tag--dot::before{
  content:"";width:4px;height:4px;border-radius:50%;background:var(--c-text-4);
  margin-right:5px;flex:none;
}

.seg{
  display:inline-flex;flex:none;overflow:hidden;border-radius:var(--radius-sm);
  background:var(--c-line-2);padding:2px;gap:2px;
}
.seg button{
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text-2);
  padding:0 11px;height:26px;border-radius:var(--radius-xs);
  display:inline-flex;align-items:center;gap:5px;transition:background var(--dur),color var(--dur);
}
.seg button:hover{color:var(--c-text)}
.seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.10)}

.chip{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  font-size:var(--fs-sm);color:var(--c-text-2);
  background:var(--c-surface);border-radius:var(--radius-pill);
  padding:5px 12px;box-shadow:inset 0 0 0 1px var(--c-line);
  transition:background var(--dur),box-shadow var(--dur),color var(--dur);
  white-space:nowrap;
}
.chip:hover{background:var(--c-surface-2);color:var(--c-text)}
.chip[aria-pressed="true"]{background:var(--c-text);color:#fff;box-shadow:none;font-weight:500}
.chip b{font-weight:600;opacity:.62}

.input{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;
  border-radius:var(--radius-sm);background:var(--c-surface);
  box-shadow:inset 0 0 0 1px var(--c-line);
  font-size:var(--fs-sm);color:var(--c-text-3);
  transition:box-shadow var(--dur);
}
.input:focus-within{box-shadow:inset 0 0 0 1.5px var(--c-primary)}
.input input{
  flex:1;min-width:0;border:0;outline:0;background:none;
  font:inherit;color:var(--c-text);
}
.input input::placeholder{color:var(--c-text-4)}

.imgbox{position:relative;overflow:hidden;flex:none;background:var(--c-line-2)}
.imgbox img{width:100%;height:100%;object-fit:cover;transition:opacity .4s,transform .5s var(--ease)}
.imgbox::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,24,40,0) 55%,rgba(16,24,40,.34) 100%);
  opacity:0;transition:opacity var(--dur);
}
.imgbox--scrim::after{opacity:1}
.imgbox--zeta img{position:relative;z-index:1}
/* 图片未就绪时的骨架（防止 CLS 与灰块） */
.imgbox[data-state="loading"]::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(100deg,#EDF0F4 30%,#F6F8FA 50%,#EDF0F4 70%);
  background-size:220% 100%;animation:shimmer 1.3s linear infinite;
}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-20% 0}}

.credit{
  position:absolute;right:5px;bottom:4px;z-index:2;
  font-size:9.5px;color:rgba(255,255,255,.92);letter-spacing:.2px;
  text-shadow:0 1px 3px rgba(0,0,0,.55);
}

/* 字段级溯源角标 ¹ —— 点击跳到「数据来源」 */
.ref{
  display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;flex:none;
  font-size:9.5px;font-weight:700;line-height:1;
  color:var(--c-primary);background:var(--c-primary-soft);
  transition:background var(--dur),color var(--dur);
}
.ref:hover{background:var(--c-primary);color:#fff}

/* ---------- 6. 桌面端浮层骨架 ---------- */
.topbar{
  left:var(--flt-inset);right:var(--flt-inset);top:var(--flt-inset);
  height:var(--topbar-h);padding:0 10px 0 14px;gap:12px;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;flex:none;padding-right:4px}
.logo{
  width:28px;height:28px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,#2E8CFF 0%,#1677FF 55%,#0B4FC4 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(22,119,255,.38);
}
.brand-text{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.2px;line-height:1.1}
.brand-text em{display:block;font-style:normal;font-size:9.5px;color:var(--c-text-4);font-weight:400;letter-spacing:.4px}

.citysw{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  height:34px;padding:0 10px;border-radius:var(--radius-sm);
  font-size:var(--fs-md);font-weight:600;color:var(--c-text);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);
  transition:background var(--dur);
}
.citysw:hover{background:var(--c-surface-2)}
.citysw .caret{width:7px;height:7px;border-right:1.7px solid var(--c-text-3);border-bottom:1.7px solid var(--c-text-3);transform:rotate(45deg) translate(-1px,-1px);flex:none}

.topbar .search{flex:1;max-width:392px}
.topbar .search .input{background:var(--c-line-2);box-shadow:none;height:34px}
.topbar .search .input:focus-within{box-shadow:inset 0 0 0 1.5px var(--c-primary);background:var(--c-surface)}
.topbar .kbd{
  font-size:10px;color:var(--c-text-4);border:1px solid var(--c-line);
  border-radius:4px;padding:0 4px;flex:none;line-height:15px;
}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.navlinks{display:flex;gap:2px;align-items:center}
.navlinks a{
  font-size:var(--fs-md);color:var(--c-text-2);text-decoration:none;
  padding:6px 10px;border-radius:var(--radius-xs);transition:background var(--dur),color var(--dur);
}
.navlinks a:hover{background:rgba(16,24,40,.05);color:var(--c-text)}
.navlinks a[aria-current="page"]{color:var(--c-text);font-weight:600;background:rgba(16,24,40,.05)}
.vdiv{width:1px;height:20px;background:var(--c-line);flex:none}

/* 左侧主面板 */
.panel-left{
  left:var(--flt-inset);top:calc(var(--flt-inset) + var(--topbar-h) + var(--flt-gap));
  bottom:var(--flt-inset);width:var(--panel-left);z-index:25;
}
.p-head{padding:15px 16px 13px;flex:none}
.p-head h2{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.p-head .sub{font-size:var(--fs-sm);color:var(--c-text-2);margin-top:5px;line-height:1.6}
.p-head .stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:11px;font-size:var(--fs-xs);color:var(--c-text-3)}
.p-head .stats b{color:var(--c-text);font-weight:600}
.p-sep{height:1px;background:var(--c-line);flex:none;margin:0 16px}

.chips{display:flex;gap:6px;padding:12px 16px 10px;flex:none;flex-wrap:wrap}
.filterrow{display:flex;gap:8px;padding:0 16px 12px;flex:none}
.filterrow .input{flex:1}
.sortbtn{
  display:inline-flex;align-items:center;gap:6px;flex:none;height:36px;padding:0 11px;
  border-radius:var(--radius-sm);font-size:var(--fs-sm);color:var(--c-text-2);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);
}
.sortbtn:hover{background:var(--c-surface-2)}

.p-list{flex:1;min-height:0;padding:0 16px 4px;display:flex;flex-direction:column;gap:8px}
.p-foot{
  flex:none;padding:10px 16px 12px;font-size:var(--fs-xs);color:var(--c-text-3);
  display:flex;justify-content:space-between;align-items:center;
}

/* 城市行（首页） */
.cityrow{
  display:flex;gap:12px;align-items:center;padding:9px;flex:none;border-radius:var(--radius-md);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line-2);
  transition:box-shadow var(--dur),transform var(--dur);cursor:pointer;text-align:left;width:100%;
}
.cityrow:hover{box-shadow:inset 0 0 0 1px var(--c-line),0 3px 10px rgba(16,24,40,.07);transform:translateY(-1px)}
.cityrow[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--c-primary);background:var(--c-primary-soft)}
.cityrow .imgbox{width:64px;height:50px;border-radius:var(--radius-sm)}
.cityrow .cbody{flex:1;min-width:0}
.cityrow .cname{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:7px}
.cityrow .cmeta{font-size:var(--fs-xs);color:var(--c-text-3);margin-top:3px}
.cityrow .cgo{flex:none;color:var(--c-text-4);display:flex;align-items:center}
/* 列表行尾的箭头（城市行与 POI 行共用） */
.cgo{flex:none;color:var(--c-text-4);display:flex;align-items:center}

/* POI 行（城市页） */
.poirow{
  display:flex;gap:10px;padding:9px;flex:none;border-radius:var(--radius-md);
  background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line-2);
  transition:box-shadow var(--dur),transform var(--dur),background var(--dur);
  cursor:pointer;text-align:left;width:100%;
}
.poirow:hover{box-shadow:inset 0 0 0 1px var(--c-line),0 3px 10px rgba(16,24,40,.07);transform:translateY(-1px)}
.poirow.is-hover{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c-primary) 45%,#fff)}
.poirow[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--c-primary);background:var(--c-primary-soft)}
.poirow .imgbox{width:62px;height:62px;border-radius:var(--radius-sm)}
.poirow .pbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.poirow .ptop{display:flex;align-items:center;gap:7px}
.poirow .ptop b{font-size:var(--fs-md);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poirow .pdesc{
  font-size:var(--fs-sm);color:var(--c-text-2);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.poirow .ptags{display:flex;gap:5px;margin-top:6px;overflow:hidden}
.poirow .pdist{font-size:var(--fs-xs);color:var(--c-text-4);flex:none;align-self:flex-start;margin-top:2px}
.emptystate{padding:34px 16px;text-align:center;color:var(--c-text-3);font-size:var(--fs-sm);line-height:1.9}
.emptystate b{display:block;color:var(--c-text-2);font-size:var(--fs-md);margin-bottom:4px}

/* 地图控件组（紧贴左面板右缘） */
.ctlwrap{
  position:absolute;top:calc(var(--flt-inset) + var(--topbar-h) + var(--flt-gap));
  left:calc(var(--flt-inset) + var(--rail-left) + var(--flt-gap));z-index:24;
}
.mapctl{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--flt-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius-md);box-shadow:var(--flt-shadow-sm),var(--flt-ring);
}
.mapctl button{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--c-text-2);transition:background var(--dur),color var(--dur);
}
.mapctl button+button{box-shadow:inset 0 1px 0 var(--c-line-2)}
.mapctl button:hover{background:rgba(16,24,40,.05);color:var(--c-text)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.mapctl{background:#fff}}

/* 底部图例 + 版权条 */
.bottombar{
  left:calc(var(--flt-inset) + var(--rail-left) + var(--flt-gap));
  right:var(--flt-inset);bottom:var(--flt-inset);height:42px;
  padding:0 14px;gap:14px;font-size:var(--fs-xs);color:var(--c-text-2);z-index:24;
}
.legend-i{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend-i i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
/* 行程页图例的三种符号：住宿旗标（方）、序号（带数字圆）、连线（虚线横杠） */
.legend-i i.lg-stay{border-radius:2px;width:8px;height:11px}
.legend-i i.lg-seq{
  width:12px;height:12px;background:var(--c-primary);color:#fff;
  font-size:8px;line-height:12px;text-align:center;font-style:normal;font-weight:700;
}
.legend-i i.lg-line{
  width:14px;height:0;border-radius:0;border-top:2px dashed var(--c-primary);background:none;
}
/* 图例里的线型：实线（驾车等）/ 虚线（步行）/ 红段（拥堵，叠加在基准线之上） */
.legend-i i.lg-line.is-solid{border-top:2.5px solid var(--c-text);background:none}
.legend-i i.lg-line.is-walk{border-top:2px dashed var(--c-text-2);background:none}
.legend-i i.lg-line.is-jam{border-top:4px solid #F5222D;background:none;width:10px}
.bottombar .creditline{margin-left:auto;font-size:10.5px;color:var(--c-text-4);white-space:nowrap}
.bottombar .state{color:var(--c-text-2);white-space:nowrap}
/* 详情页轨道被抽屉压窄，只保留底图状态 / 地图服务状态 / 署名 */
.vp--desktop.has-detail .bottombar .legend-only{display:none}
.bottombar .state b{color:var(--c-text);font-weight:600}

/* ==========================================================================
   ★ 三级下钻新增基元
   ========================================================================== */

/* 面包屑（全国 / 四川 / 成都）：各级可点回上级 */
.crumb{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--c-text-3);
  flex:none;padding:0 4px;white-space:nowrap}
.crumb button{
  border:0;background:none;font:inherit;cursor:pointer;padding:2px 1px;border-radius:var(--radius-xs);
  color:var(--c-primary);transition:background var(--dur),color var(--dur);
}
.crumb button:hover{background:var(--c-primary-soft)}
.crumb b{color:var(--c-text);font-weight:600}
.crumb .sep{color:var(--c-text-4)}

/* 省 / 市计数徽标：底色 = 收录密度；未收录 = 灰底虚线 + 破折号（绝不用 0） */
.cnt{
  display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;
  padding:0 7px;border-radius:var(--radius-pill);font-size:var(--fs-xs);font-weight:700;
  color:#0B2B57;background:var(--d1);flex:none;
}
.cnt--d2{background:var(--d2)} .cnt--d3{background:var(--d3);color:#fff}
.cnt--d1{background:var(--d1)}
.cnt--none{background:transparent;border:1px dashed #C3CCD8;color:var(--c-text-4);font-weight:500}

/* 下钻列表行（省 / 市） */
.drow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;
  cursor:pointer;transition:background var(--dur),border-color var(--dur);font:inherit;color:inherit}
.drow+.drow{margin-top:4px}
.drow:hover{background:var(--c-surface-2);border-color:var(--c-line)}
.drow[aria-current="true"]{background:var(--c-primary-soft);border-color:#C7DDFF}
.drow.is-pending{cursor:default;opacity:.72}
.drow .dn{flex:1;min-width:0}
.drow .dn b{font-size:var(--fs-md);font-weight:600}
.drow .dn span{display:block;font-size:var(--fs-xs);color:var(--c-text-3);margin-top:2px}
.drow .go{font-size:var(--fs-xs);color:var(--c-text-3);flex:none}

/* 待收录引导卡 */
.pending{padding:16px 17px;max-width:300px}
.pending h3{font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;gap:8px}
.pending p{font-size:var(--fs-sm);color:var(--c-text-2);margin-top:8px;line-height:1.7}
.pending .sug{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* 细类图例（12 色，按大类分组，点选可二次过滤） */
.sublegend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:9px 16px 10px;
  box-shadow:inset 0 -1px 0 var(--c-line-2)}
.sublegend .si{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--c-text-2);
  border:0;background:none;font-family:inherit;cursor:pointer;padding:1px 0;transition:opacity var(--dur)}
.sublegend .si:hover{color:var(--c-text)}
.sublegend .si i{width:9px;height:9px;border-radius:50%;display:block;flex:none;
  border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(16,24,40,.22)}
.sublegend .si[aria-pressed="false"]{opacity:.34}
.sublegend .gp{width:1px;height:12px;background:var(--c-line);flex:none;align-self:center}
/* 移动端 Sheet 里的图例：折行会把列表挤下去，改成单行横向滚动。
   子项必须 flex:none + 不换行 —— 否则 flex 默认允许收缩，
   12 项会被压成「每项只剩 1 个字宽」的多行竖排，比折行更难看（同 .chip 的做法） */
.sublegend--nowrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 16px 9px}
.sublegend--nowrap .si{flex:none;white-space:nowrap}
.sublegend--nowrap::-webkit-scrollbar{display:none}

/* 适游群体标签（6 类 + 无障碍）；无数据不渲染，不臆造 */
.audrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.aud{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:#374151;
  background:#EEF2F7;border-radius:var(--radius-pill);padding:2px 8px}
.aud--a11y{background:#E7F5EF;color:#0F766E;font-weight:600}

/* 降级示意画布上的省 / 市计数徽标（不画任何行政边界 —— 合规） */
.fb-badge{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:var(--radius-pill);background:#fff;
  box-shadow:0 1px 4px rgba(16,24,40,.18),0 0 0 1px rgba(16,24,40,.06);
  font-size:var(--fs-xs);white-space:nowrap;z-index:5}
.fb-badge.is-pending{background:rgba(255,255,255,.85);border:1px dashed #C3CCD8;box-shadow:none;color:var(--c-text-4)}
.fb-badge.is-active{box-shadow:0 0 0 2px var(--c-primary),0 2px 8px rgba(16,24,40,.22)}
.fb-badge b{font-weight:600;color:var(--c-text)}
.fb-badge .fb-cnt{font-weight:700;color:#0B2B57}
.fb-badge .fb-cnt.is-none{color:var(--c-text-4);font-weight:500}

/* 右侧 POI 预览卡（替代地图气泡） */
.preview{
  right:var(--flt-inset);top:calc(var(--flt-inset) + var(--topbar-h) + var(--flt-gap));
  width:var(--panel-preview);z-index:26;overflow:hidden;
  animation:cardIn .26s var(--ease);
}
@keyframes cardIn{from{opacity:0;transform:translateX(10px) scale(.985)}to{opacity:1;transform:none}}
.pv-cover{height:150px;width:100%}
.pv-close{
  position:absolute;right:9px;top:9px;z-index:4;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--c-text);
  background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(16,24,40,.20);
  transition:transform var(--dur),background var(--dur);
}
.pv-close:hover{transform:scale(1.07);background:#fff}
.pv-body{padding:13px 15px 14px}
.pv-title{display:flex;align-items:center;gap:8px}
.pv-title b{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.2px}
.pv-lead{font-size:var(--fs-sm);color:var(--c-text-2);margin-top:7px;line-height:1.65}
.pv-tags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.pv-meta{margin-top:12px;padding-top:11px;box-shadow:inset 0 1px 0 var(--c-line-2);display:flex;flex-direction:column;gap:8px}
.pv-metarow{display:flex;gap:10px;font-size:var(--fs-sm);align-items:flex-start}
.pv-metarow .k{color:var(--c-text-3);width:60px;flex:none}
.pv-metarow .v{color:var(--c-text);flex:1;min-width:0;font-weight:500}
.pv-actions{display:flex;gap:8px;margin-top:14px}
.pv-actions .btn{flex:1}
.pv-foot{font-size:10.5px;color:var(--c-text-4);margin-top:9px;text-align:center}

/* 详情页：左内容面板 620px */
.panel-detail{
  left:var(--flt-inset);top:calc(var(--flt-inset) + var(--topbar-h) + var(--flt-gap));
  bottom:var(--flt-inset);width:var(--panel-detail);z-index:25;
}
.pd-scroll{flex:1;min-height:0;padding:16px 18px 18px}
.gal{position:relative;border-radius:var(--radius-md);overflow:hidden}
.gal-main{width:100%;height:196px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumbs .imgbox{height:52px;border-radius:var(--radius-sm);cursor:pointer}
.thumbs .imgbox:hover img{transform:scale(1.06)}
.thumbs .imgbox[aria-current="true"]{box-shadow:0 0 0 2px var(--c-primary)}
.pd-title{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pd-title h1{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.25}
.pd-lead{font-size:var(--fs-md);color:var(--c-text-2);margin-top:9px;line-height:1.75}
.pd-h{
  font-size:var(--fs-lg);font-weight:700;margin:20px 0 10px;
  display:flex;align-items:center;gap:8px;letter-spacing:-.2px;
}
.pd-h::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--c-primary);flex:none}
/* 说明性小字（数据来源 / 未核实提示）：比正文弱一级，不抢标题 */
.pd-note{font-size:var(--fs-xs);color:var(--c-text-3);line-height:1.7;margin-top:8px}
.metagrid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--c-line);
  border-radius:var(--radius-md);overflow:hidden;box-shadow:0 0 0 1px var(--c-line);
}
.metacell{background:var(--c-surface);padding:10px 12px;position:relative;min-height:62px}
.metacell .k{font-size:var(--fs-xs);color:var(--c-text-3);display:flex;align-items:center;gap:5px}
.metacell .v{font-size:var(--fs-md);color:var(--c-text);margin-top:3px;font-weight:600;line-height:1.5}
.hllist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hl{
  display:flex;gap:9px;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.6;
  border-radius:var(--radius-sm);padding:10px 12px;background:var(--c-surface-2);
  box-shadow:inset 0 0 0 1px var(--c-line-2);
}
.hl .dot{width:6px;height:6px;border-radius:50%;background:var(--c-primary);flex:none;margin-top:7px}
.srcbox{
  border-radius:var(--radius-sm);padding:13px;background:var(--c-surface-2);
  box-shadow:inset 0 0 0 1px var(--c-line-2);font-size:var(--fs-sm);color:var(--c-text-2);
}
.srcbox li{display:flex;gap:8px;line-height:1.65;margin-bottom:6px}
.srcbox li:last-child{margin-bottom:0}
.srcbox .num{
  flex:none;width:15px;height:15px;border-radius:50%;background:var(--c-primary-soft);
  color:var(--c-primary);font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.srcbox a{color:var(--c-primary);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--c-primary) 35%,#fff)}
.srcbox a:hover{border-bottom-color:var(--c-primary)}
.srcbox .fine{font-size:10.5px;color:var(--c-text-4);margin-top:11px;padding-top:10px;box-shadow:inset 0 1px 0 var(--c-line-2);line-height:1.7}
.nearby{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.nearby a{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:var(--fs-sm);color:var(--c-text-2);background:var(--c-surface-2);
  border-radius:var(--radius-pill);padding:5px 11px;box-shadow:inset 0 0 0 1px var(--c-line-2);
}
.nearby a:hover{background:var(--c-primary-soft);color:var(--c-primary)}

/* 详情页右下「位置与到达」卡 */
.locate-card{right:var(--flt-inset);bottom:calc(var(--flt-inset) + 42px + var(--flt-gap));width:var(--panel-locate);padding:15px;z-index:26}
.lc-title{font-size:var(--fs-md);font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.lc-row{display:flex;gap:10px;font-size:var(--fs-sm);padding:5px 0}
.lc-row .k{color:var(--c-text-3);width:56px;flex:none}
.lc-row .v{color:var(--c-text);flex:1;min-width:0;font-weight:500}
.lc-actions{display:flex;gap:8px;margin-top:13px}
.lc-actions .btn{flex:1}

/* 地图右下角版权（详情页） */
.mapcredit{
  position:absolute;right:var(--flt-inset);bottom:var(--flt-inset);z-index:22;
  font-size:10px;color:var(--c-text-3);background:rgba(255,255,255,.88);
  padding:3px 9px;border-radius:var(--radius-xs);box-shadow:var(--flt-shadow-sm);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

/* 浮动提示 */
.toast{
  position:absolute;left:50%;bottom:74px;transform:translate(-50%,10px);z-index:60;
  display:flex;align-items:center;gap:10px;max-width:min(560px,80%);
  background:rgba(22,26,34,.94);color:#fff;font-size:var(--fs-sm);
  padding:9px 12px 9px 15px;border-radius:var(--radius-pill);
  box-shadow:0 10px 28px rgba(16,24,40,.30);
  opacity:0;pointer-events:none;transition:opacity var(--dur),transform var(--dur);
}
.toast.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#fff;font-size:var(--fs-sm);font-weight:600;padding:0 6px;opacity:.92;white-space:nowrap}
.toast button:hover{opacity:1;text-decoration:underline}

/* 灯箱 */
.lightbox{
  position:absolute;inset:0;z-index:80;display:none;
  background:rgba(12,16,22,.90);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:44px 56px;
}
.lightbox.is-on{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--radius-md);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lb-close{position:absolute;right:18px;top:18px;color:#fff;opacity:.85}
.lb-close:hover{opacity:1}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);color:#fff;opacity:.8;
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;
}
.lb-nav:hover{opacity:1;background:rgba(255,255,255,.22)}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-cap{
  position:absolute;left:50%;transform:translateX(-50%);bottom:18px;
  color:rgba(255,255,255,.86);font-size:var(--fs-sm);text-align:center;line-height:1.7;
}
.lb-cap b{color:#fff;font-weight:600}

/* ---------- 7. 移动端浮层骨架 ---------- */
.vp--mobile .statusbar{
  position:absolute;left:0;right:0;top:0;height:54px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px 0;pointer-events:none;
  font-size:13px;font-weight:600;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.42);
}
.vp--mobile .statusbar .sb-right{display:flex;align-items:center;gap:5px}
.vp--mobile .island{
  position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:118px;height:34px;border-radius:var(--radius-pill);background:#0A0C10;z-index:41;
}
.vp--mobile .homebar{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:42;
  width:134px;height:5px;border-radius:var(--radius-pill);background:rgba(12,16,22,.30);pointer-events:none;
}
/* 移动端状态栏在浅色底图上需要深色文字 */
.vp--mobile.light-status .statusbar{color:#161A22;text-shadow:0 1px 2px rgba(255,255,255,.7)}

.m-top{
  position:absolute;left:12px;right:12px;top:56px;z-index:30;
  display:flex;gap:8px;align-items:center;
}
.m-pill{
  height:40px;padding:0 13px;border-radius:var(--radius-pill);
  display:inline-flex;align-items:center;gap:8px;flex:none;
  font-size:var(--fs-md);color:var(--c-text-2);
  background:var(--flt-bg);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:var(--flt-shadow-sm),var(--flt-ring);
  transition:background var(--dur),transform var(--dur);
}
.m-pill:hover{transform:translateY(-1px)}
.m-pill--grow{flex:1;min-width:0;color:var(--c-text-3)}
.m-pill--grow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-pill--city{font-weight:600;color:var(--c-text)}
.m-pill--icon{width:40px;padding:0;justify-content:center}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.m-pill,.m-seg{background:#fff}}

.m-segwrap{position:absolute;right:12px;top:108px;z-index:30}
.m-seg{
  display:inline-flex;overflow:hidden;border-radius:var(--radius-pill);
  background:var(--flt-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--flt-shadow-sm),var(--flt-ring);padding:3px;gap:3px;
}
.m-seg button{
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text-2);
  height:30px;padding:0 12px;border-radius:var(--radius-pill);
  display:inline-flex;align-items:center;gap:5px;transition:background var(--dur),color var(--dur);
}
.m-seg button[aria-pressed="true"]{background:var(--c-text);color:#fff}

.m-float{position:absolute;z-index:30;transition:bottom var(--dur) var(--ease)}
/* Sheet 过高时署名改贴地图左上角（避免与顶部胶囊行重叠） */
.m-float.is-top{left:12px;top:94px;bottom:auto;width:auto}

/* 底部 Sheet：三档吸附 */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:28;
  height:var(--sheet-h);
  background:var(--c-surface);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(16,24,40,.20);
  display:flex;flex-direction:column;overflow:hidden;
  transition:height var(--dur) var(--ease);
  will-change:height;
}
.sheet.is-dragging{transition:none}
.sheet-grip{
  flex:none;padding:9px 0 3px;display:flex;justify-content:center;cursor:grab;touch-action:none;
  position:relative;
}
.sheet-grip::after{content:"";width:40px;height:4px;border-radius:2px;background:#D3D9E1;transition:background var(--dur)}
.sheet-grip:hover::after{background:#B4BCC8}
.sheet-grip:active{cursor:grabbing}
.sheet-head{padding:4px 16px 12px;flex:none;position:relative}   /* relative：行程页「更换住宿」按钮贴右上 */
.sheet-head .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet-head b{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.2px}
.sheet-head .hint{font-size:var(--fs-xs);color:var(--c-text-4);flex:none}
.sheet-head .sub{font-size:var(--fs-xs);color:var(--c-text-3);margin-top:4px}
.m-chips{display:flex;gap:6px;padding:0 16px 11px;flex:none;overflow-x:auto;scrollbar-width:none}
.m-chips::-webkit-scrollbar{display:none}
.m-list{flex:1;min-height:0;padding:0 16px 6px;display:flex;flex-direction:column;gap:9px}
.m-foot{
  flex:none;padding:11px 16px calc(11px + 20px);box-shadow:inset 0 1px 0 var(--c-line-2);
  display:flex;gap:9px;background:var(--c-surface);
}
.m-foot .btn{flex:1;height:44px;font-size:var(--fs-lg);border-radius:var(--radius-md)}
.m-detail{flex:1;min-height:0}
.m-gal{height:212px;width:100%}
.m-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 16px 0}
.m-thumbs .imgbox{height:50px;border-radius:var(--radius-sm)}
.m-dbody{padding:15px 16px 0}
.m-dbody h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-dbody .lead{font-size:var(--fs-md);color:var(--c-text-2);margin-top:8px;line-height:1.7}
.m-metagrid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--c-line);
  border-radius:var(--radius-md);overflow:hidden;box-shadow:0 0 0 1px var(--c-line);margin-top:14px;
}
.m-metacell{background:var(--c-surface);padding:11px 12px;position:relative;min-height:66px}
.m-metacell .k{font-size:var(--fs-xs);color:var(--c-text-3);display:flex;align-items:center;gap:5px}
.m-metacell .v{font-size:var(--fs-md);color:var(--c-text);margin-top:3px;font-weight:600;line-height:1.5}
.m-hl{
  display:flex;gap:9px;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.65;
  background:var(--c-surface-2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;
  box-shadow:inset 0 0 0 1px var(--c-line-2);
}
.m-hl .dot{width:6px;height:6px;border-radius:50%;background:var(--c-primary);flex:none;margin-top:7px}

/* 三档参考线（仅调试时显示） */
.guides{position:absolute;inset:0;z-index:70;pointer-events:none;display:none}
.guides.is-on{display:block}
.guide{position:absolute;left:0;right:0;border-top:1.5px dashed #E8A33D}
.guide span{
  position:absolute;right:8px;top:-10px;font-size:10px;font-weight:600;color:#9A6415;
  background:#FFF6E4;border:1px solid #F2D9A6;border-radius:var(--radius-xs);padding:0 6px;line-height:17px;
}

/* ---------- 7.5 行程规划页 P5 `/city/:id/plan`（09 文档第六节 + 05 文档 P5）----------
   仍是「地图即画布」：行程面板只是换了个更宽的浮层（--panel-itinerary），
   不是另一种布局模型。产品主张：用户定住宿 / 挑点位 / 排顺序，系统只算时间。
   --------------------------------------------------------------------------- */
.flt--itin{
  left:var(--flt-inset);top:calc(var(--flt-inset) + var(--topbar-h) + var(--flt-gap));
  bottom:var(--flt-inset);width:var(--panel-itinerary);
}
/* 右侧控件 / 图例轨道要为更宽的面板让位 —— 位置由 token 推出，不硬编码 448px */
.rail--itin{left:calc(var(--flt-inset) + var(--panel-itinerary) + var(--flt-gap))}

/* DayTabs（桌面在顶栏，移动端在 Sheet 里，同一组件） */
.daytabs{display:flex;align-items:center;gap:6px;flex:none}
.daytab{
  position:relative;height:30px;padding:0 13px;border:1px solid var(--c-line);
  border-radius:var(--radius-pill);background:var(--c-surface);color:var(--c-text-2);
  font-size:var(--fs-sm);white-space:nowrap;flex:none;transition:all var(--dur) var(--ease);
}
.daytab:hover{border-color:var(--c-text-4);color:var(--c-text)}
.daytab[aria-current="true"]{background:var(--c-text);border-color:var(--c-text);color:#fff;font-weight:600}
.daytab .wdot{
  position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--c-food);box-shadow:0 0 0 2px var(--c-surface);
}

/* 行程入口（城市页面板 / 移动端 Sheet 底部共用同一段） */
.p-itin{
  flex:none;display:flex;flex-direction:column;gap:6px;
  padding:10px 16px 12px;box-shadow:inset 0 1px 0 var(--c-line-2);
}
.p-itin .btn{justify-content:center;width:100%;height:38px}
.p-itin .hint{font-size:var(--fs-xs);color:var(--c-text-3);text-align:center;line-height:1.5}

/* 住宿行：行程的锚，必须常显 */
.itin-stay{display:flex;align-items:center;gap:10px;padding:14px var(--sp-4);border-bottom:1px solid var(--c-line-2);flex:none}
.itin-stay .ic{
  width:30px;height:30px;border-radius:var(--radius-sm);flex:none;
  background:#FFF6E4;border:1px solid #F2D9A6;color:#9A6415;
  display:flex;align-items:center;justify-content:center;
}
.itin-stay .who{flex:1;min-width:0}
.itin-stay .who b{display:block;font-size:var(--fs-md);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itin-stay .who span{display:block;font-size:var(--fs-xs);color:var(--c-text-3);margin-top:2px}
.itin-stay .chg{
  flex:none;font-size:var(--fs-sm);color:var(--c-primary);border:1px solid var(--c-line);
  border-radius:var(--radius-sm);padding:5px 11px;background:var(--c-surface);white-space:nowrap;
}

/* 时间轴 */
.tl{flex:1;min-height:0;overflow-y:auto;padding:10px var(--sp-4) 0;-webkit-overflow-scrolling:touch}
.tl-row{display:grid;grid-template-columns:22px 1fr;position:relative}
.tl-mid{position:relative;display:flex;justify-content:center}
.tl-mid::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--c-line)}
.tl-row--first .tl-mid::before{top:15px}
.tl-row--last .tl-mid::before{height:15px;bottom:auto}
.tl-dot{
  width:11px;height:11px;border-radius:50%;background:var(--c-surface);
  border:2.5px solid var(--c-text);margin-top:7px;position:relative;z-index:2;flex:none;
}
.tl-dot--stay{border-color:var(--c-food);border-radius:3px}
.tl-body{min-width:0;padding:0 0 12px}
.tl-row--leg .tl-body{padding-bottom:9px}
.tl-h{display:flex;align-items:baseline;gap:8px}
.tl-h .hh{font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums;flex:none;letter-spacing:-.2px}
.tl-h .nm{font-size:var(--fs-md);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-h .tag{
  font-size:10px;color:var(--c-text-3);border:1px solid var(--c-line);
  border-radius:var(--radius-xs);padding:0 5px;line-height:16px;flex:none;
}
.tl-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;font-size:var(--fs-xs);color:var(--c-text-3)}
.tl-sub .edit{
  color:var(--c-primary);border:1px solid var(--c-line);background:var(--c-surface);
  border-radius:var(--radius-xs);padding:0 6px;line-height:17px;
}
.tl-sub .default{color:var(--c-text-4);border-style:dashed;border-radius:var(--radius-xs);padding:0 5px;line-height:16px}

/* 六种出行方式切换：必须挤在一行，否则时间轴会被推高导致末行被裁 */
.modestrip{
  display:flex;gap:4px;flex-wrap:nowrap;padding:5px 8px;margin-bottom:6px;
  border:1px solid var(--c-line);border-radius:var(--radius-sm);background:var(--c-surface-2);
}
.modepill{
  display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px;flex:none;
  border:1px solid var(--c-line);border-radius:var(--radius-pill);
  background:var(--c-surface);color:var(--c-text-2);font-size:var(--fs-xs);white-space:nowrap;
  transition:all var(--dur) var(--ease);
}
.modepill .ico{width:13px;height:13px}
.modepill:hover{border-color:var(--c-text-4)}
.modepill[aria-pressed="true"]{background:var(--c-primary-soft);border-color:var(--c-primary);color:var(--c-primary);font-weight:600}
.modepill.is-na{opacity:.42;text-decoration:line-through}

/* Leg 段行 */
.legbox{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--c-line);border-radius:var(--radius-sm);background:var(--c-surface);
  transition:all var(--dur) var(--ease);
}
.legbox:hover{border-color:var(--c-text-4)}
.legbox.is-on{border-color:var(--c-primary);background:var(--c-primary-soft)}
.legbox .lg-ic{flex:none;color:var(--c-text-2);display:flex}
.legbox.is-on .lg-ic{color:var(--c-primary)}
.legbox .lg-t{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--c-text-2)}
.legbox .lg-t b{color:var(--c-text);font-weight:600;font-variant-numeric:tabular-nums}
.legbox .lg-swap{flex:none;font-size:var(--fs-xs);color:var(--c-primary)}
.legbox .lg-na{flex:none;font-size:var(--fs-xs);color:var(--c-text-4)}

/* 多方案卡片（点开某一段才拉，进入页面不拉） */
.rto{
  margin-top:7px;padding:10px;border:1px solid var(--c-line);
  border-radius:var(--radius-md);background:var(--c-surface-2);
}
.rto-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:var(--fs-xs);color:var(--c-text-3)}
.rto-h .est{color:var(--c-text-4);border:1px dashed var(--c-line);border-radius:var(--radius-xs);padding:0 5px;line-height:16px}
.rto-opt{
  display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:5px;
  border:1px solid var(--c-line);border-radius:var(--radius-sm);background:var(--c-surface);
}
.rto-opt:last-of-type{margin-bottom:0}
.rto-opt.is-on{border-color:var(--c-primary);background:var(--c-primary-soft)}
.rto-opt .rl{width:15px;flex:none;font-size:var(--fs-xs);color:var(--c-text-3);font-weight:600}
.rto-opt .rv{flex:none;font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums}
.rto-opt .rd{flex:none;font-size:var(--fs-xs);color:var(--c-text-3);font-variant-numeric:tabular-nums}
.rto-opt .rt2{
  flex:none;font-size:10px;color:var(--c-text-2);border:1px solid var(--c-line);
  border-radius:var(--radius-xs);padding:0 5px;line-height:16px;
}
.rto-opt .rsp{margin-left:auto;flex:none;font-size:var(--fs-xs);color:var(--c-text-3)}
.rto-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:var(--fs-xs);color:var(--c-text-3)}
.rto-foot .slow{display:inline-flex;align-items:center;gap:4px;color:var(--c-food)}
/* 段的诚实标注：快照 / 往返均值 / 查询时刻路况 —— 三件事必须同时说清 */
.rto-note{
  margin-top:6px;padding-top:6px;border-top:1px dashed var(--c-line);
  font-size:var(--fs-xs);color:var(--c-text-4);line-height:1.5;
}
/* 降级条：配额用尽 / localStorage 不可用 —— 与过载提示区分开来（这是系统状态，不是行程质量） */
.degbar{
  flex:none;display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:9px 11px;
  background:#F1F5FB;border:1px solid #C9DCF5;border-radius:var(--radius-sm);
  font-size:var(--fs-sm);color:#2B5A99;line-height:1.55;
}
.degbar .ico{width:15px;height:15px;flex:none;margin-top:1px}
/* 住宿段列表（多住宿段）：每天归属一个住宿段，中途换酒店是真实需求 */
.stayrow{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:var(--radius-sm);
  font-size:var(--fs-sm);color:var(--c-text-2);
}
.stayrow.is-on{background:var(--c-primary-soft);color:var(--c-text);font-weight:600}
.stayrow .sd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stayrow .addstay{
  flex:none;font-size:var(--fs-xs);color:var(--c-primary);border:1px dashed var(--c-primary);
  border-radius:var(--radius-sm);padding:2px 7px;
}
/* 移动端 half 档的汇总条 —— 「一天够不够」在这里就回答，不用滚到 full 档 */
.m-sum{
  flex:none;display:flex;align-items:center;gap:14px;padding:9px var(--sp-4);
  border-top:1px solid var(--c-line-2);font-size:var(--fs-xs);color:var(--c-text-3);
}
.m-sum b{color:var(--c-text);font-weight:600;font-variant-numeric:tabular-nums}
.m-sum .tot{margin-left:auto}
.m-sum .tot b{font-size:var(--fs-md);font-weight:700}
/* 时间轴被截断时的出口 */
.tl-more{
  padding:8px 2px 2px;font-size:var(--fs-xs);color:var(--c-primary);
  display:flex;align-items:center;gap:4px;
}

/* 过载提示：一律「陈述 + 建议」，不用祈使句 —— 顺序的决定权在用户手里 */
.warnbar{
  display:flex;gap:9px;align-items:flex-start;padding:9px 11px;
  background:#FFF8EB;border:1px solid #F2D9A6;border-radius:var(--radius-sm);
  font-size:var(--fs-sm);color:#88571A;line-height:1.55;
}
.warnbar .ico{width:15px;height:15px;flex:none;margin-top:1px;color:#B7791F}

/* 汇总 + 添加点位 */
.itin-sum{
  flex:none;padding:11px var(--sp-4) 12px;border-top:1px solid var(--c-line-2);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.itin-sum .l{font-size:var(--fs-xs);color:var(--c-text-3);line-height:1.65}
.itin-sum .l b{color:var(--c-text);font-weight:600;font-variant-numeric:tabular-nums}
.itin-sum .big{
  flex:none;text-align:right;font-size:var(--fs-xl);font-weight:700;
  color:var(--c-text);line-height:1.2;font-variant-numeric:tabular-nums;
}
.itin-sum .big span{display:block;font-size:var(--fs-xs);color:var(--c-text-3);font-weight:500}
.itin-add{flex:none;padding:0 var(--sp-4) var(--sp-4)}
.itin-add .addbtn{
  width:100%;height:40px;border:1.5px dashed var(--c-line);border-radius:var(--radius-md);
  font-size:var(--fs-md);color:var(--c-text-2);display:flex;align-items:center;justify-content:center;gap:6px;
}
.itin-add .addbtn:hover{border-color:var(--c-text-4);color:var(--c-text)}

/* 行程层（降级示意画布）：住宿旗标 + 序号点位 —— 与真实地图的 PIN_STYLES.stay / seq1-9 对应 */
.fb-stayflag{
  position:absolute;transform:translate(-50%,-100%);z-index:9;
  display:flex;flex-direction:column;align-items:center;
}
.fb-stayflag b{
  background:var(--c-food);color:#fff;font-size:10.5px;font-weight:600;
  padding:2px 8px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(16,24,40,.24);
}
.fb-stayflag i{
  width:0;height:0;border:7px solid transparent;border-bottom-color:var(--c-food);
  border-top:0;display:block;
}
.fb-seq{
  position:absolute;transform:translate(-50%,-50%);z-index:8;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.fb-seqn{
  width:22px;height:22px;border-radius:50%;background:var(--c-text);color:#fff;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(16,24,40,.28);
}

/* 移动端行程：同一套时间轴，只缩字号 */
.tl--m{padding:0 var(--sp-4) 4px}
.tl--m .tl-h .hh,.tl--m .tl-h .nm{font-size:var(--fs-sm)}
.tl--m .tl-body{padding-bottom:9px}
.m-daytabs{display:flex;gap:6px;padding:0 var(--sp-4) 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.m-daytabs::-webkit-scrollbar{display:none}
.m-grip{
  width:16px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--c-text-4);cursor:grab;font-size:14px;line-height:1;
}

/* ---------- 8. 原型控制台（非产品 UI，明确与产品区隔） ---------- */
.console{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;
  display:flex;align-items:center;gap:10px;
  background:rgba(20,24,31,.94);color:#E6E9EF;
  border-radius:var(--radius-pill);padding:7px 10px 7px 16px;
  box-shadow:0 14px 34px rgba(16,24,40,.34);
  font-size:var(--fs-sm);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  max-width:calc(100vw - 32px);flex-wrap:nowrap;
}
.console .ctag{
  font-size:10px;font-weight:700;letter-spacing:.6px;color:#9AA5B4;
  text-transform:uppercase;flex:none;padding-right:2px;
}
.console .cgrp{display:flex;align-items:center;gap:4px;flex:none}
.console .cdiv{width:1px;height:18px;background:rgba(255,255,255,.16);flex:none}
.console .cbtn{
  height:28px;padding:0 11px;border-radius:var(--radius-pill);flex:none;
  font-size:var(--fs-sm);color:#C8D0DB;transition:background var(--dur),color var(--dur);
  white-space:nowrap;
}
.console .cbtn:hover{background:rgba(255,255,255,.11);color:#fff}
.console .cbtn[aria-pressed="true"]{background:#fff;color:#161A22;font-weight:600}
.console .cmsg{font-size:var(--fs-xs);color:#9AA5B4;flex:none;padding-left:2px}
.console .cmap{font-size:var(--fs-xs);color:#7E8896;flex:none;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:900px){
  .console{flex-wrap:wrap;justify-content:center;border-radius:var(--radius-card);bottom:10px}
  .console .cmap{display:none}
}
</style>
</head>
<body>

<!-- ===================== 内联 SVG 图标集 ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
